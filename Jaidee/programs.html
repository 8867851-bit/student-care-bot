<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>ใจดี TU — Programs</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --forest:        #F5F1E8;
      --forest-mid:    #EDE8DC;
      --forest-border: #D8D0C0;
      --forest-lift:   #EEEAE0;
      --cream:         #2A3A28;
      --cream-warm:    #FFFFFF;
      --cream-border:  #D4CCBC;
      --cream-mid:     #6A6050;
      --cream-soft:    #8A8070;
      --green:         #3A7A36;
      --green-dim:     #5A8A56;
      --red-muted:     #B04840;
      --red-bg:        rgba(176,72,64,0.07);
      --red-border:    rgba(176,72,64,0.15);
      --radius:        18px;
      --radius-sm:     11px;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--forest);
      color: #1C2B1A;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* Grain */
    body::before {
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      opacity:0.04;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:180px 180px;
    }
    body > * { position:relative; z-index:1; }

    /* ── HERO: centred, gold glow behind title ── */
    .hero {
      padding: 52px 24px 32px;
      position: relative; overflow: hidden;
      text-align: center;
      display: flex; flex-direction: column; align-items: center;
    }
    /* gold radial glow centred behind the title */
    .hero::after {
      content:'';
      position:absolute; top:50px; left:50%; transform:translateX(-50%);
      width:300px; height:200px;
      background:radial-gradient(ellipse, rgba(160,120,10,0.10) 0%, transparent 68%);
      pointer-events:none; z-index:0;
    }

    .hero-back {
      align-self:flex-start;
      display:inline-flex; align-items:center; gap:5px;
      font-size:12px; font-weight:300; color:var(--green-dim);
      margin-bottom:24px; cursor:pointer;
      background:none; border:none; font-family:'Sarabun',sans-serif;
      transition:color 0.15s; position:relative; z-index:1;
    }
    .hero-back:hover { color:var(--green); }

    .hero-title {
      font-family:'Instrument Serif',serif;
      font-size:42px; font-weight:400;
      /* pure white — fully readable on dark green */
      color: #1C2B1A; line-height:1.05;
      margin-bottom:10px;
      position:relative; z-index:1;
    }
    .hero-title em { font-style:italic; color: #A07820; }

    .hero-sub {
      font-size:13px; font-weight:300;
      color:#5A7A56; line-height:1.85;
      max-width:280px; position:relative; z-index:1;
    }

    /* ── STATS: cream/light background, dark text ── */
    .stats-strip {
      display:flex; gap:8px; padding:20px 24px 0;
    }
    .stat-card {
      flex:1;
      background:#F4EFE3;       /* light cream */
      border:1px solid #E0D8C8;
      border-radius:14px; padding:12px 8px; text-align:center;
    }
    .stat-num {
      font-family:'Instrument Serif',serif;
      font-size:26px; color:#1A2B1E; /* dark green number */
      display:block; line-height:1;
    }
    .stat-label {
      font-size:9px; font-weight:400;
      color:#6A6050; letter-spacing:0.5px;
      margin-top:4px; display:block;
    }

    /* ── FILTER CHIPS ── */
    .filter-row {
      display:flex; gap:7px; padding:20px 24px 24px;
      overflow-x:auto; scrollbar-width:none;
    }
    .filter-row::-webkit-scrollbar { display:none; }
    .chip {
      flex-shrink:0; padding:6px 16px; border-radius:99px;
      font-size:11px; border:1px solid var(--forest-border);
      color:#5A7A56; background:rgba(255,255,255,0.7);
      cursor:pointer; font-family:'Sarabun',sans-serif;
      transition:all 0.18s ease; white-space:nowrap;
    }
    .chip:hover { border-color:var(--green-dim); color:var(--green); }
    .chip.active {
      background:var(--green); border-color:var(--green);
      color:#FFFFFF; font-weight:600;
      box-shadow:0 0 16px rgba(58,122,54,0.25);
    }

    /* ── SECTION DIVIDER ── */
    .section-divider {
      display:flex; align-items:center; gap:12px; padding:4px 24px 16px;
    }
    .sd-text {
      font-size:9px; font-weight:500; letter-spacing:2.5px;
      text-transform:uppercase; color:var(--green-dim); white-space:nowrap;
    }
    .sd-line { flex:1; height:1px; background:var(--forest-border); }

    /* ── CARDS ── */
    .cards { display:flex; flex-direction:column; gap:14px; padding:0 16px; }

    .prog-card {
      background:var(--cream-warm);
      border-radius:var(--radius); overflow:hidden; cursor:pointer;
      /* uplifting glow: top-edge highlight, faint upper halo */
      box-shadow:
        0 0 0 1px rgba(125,198,122,0.28),
        0 0 14px rgba(125,198,122,0.18),
        inset 0 1px 0 rgba(125,198,122,0.20),
        0 2px 6px rgba(0,0,0,0.22);
      opacity:0; transform:translateY(14px);
      transition:opacity 0.38s ease, transform 0.38s ease, box-shadow 0.22s ease;
    }
    .prog-card.visible { opacity:1; transform:translateY(0); }
    .prog-card:hover {
      box-shadow:
        0 0 0 1px rgba(125,198,122,0.50),
        0 0 22px rgba(125,198,122,0.28),
        inset 0 1px 0 rgba(125,198,122,0.32),
        0 2px 8px rgba(0,0,0,0.22);
      transform:translateY(-2px);
    }
    .prog-card:active { transform:scale(0.985); }

    .card-photo {
      width:100%; aspect-ratio:16/7;
      background:linear-gradient(140deg,#D4EAD0 0%,#BDD8B8 100%);
      display:flex; align-items:center; justify-content:center;
      font-size:44px; position:relative; overflow:hidden;
    }
    .card-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .card-photo-overlay {
      position:absolute; inset:0;
      background:linear-gradient(to bottom,transparent 25%,rgba(8,16,9,0.5) 100%);
    }
    .card-photo-cat {
      position:absolute; bottom:12px; left:14px;
      font-size:9px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
      background:rgba(8,16,9,0.72); backdrop-filter:blur(8px);
      padding:4px 10px; border-radius:99px;
    }
    .card-photo-type {
      position:absolute; bottom:12px; right:14px;
      font-size:9px; color:rgba(200,190,168,0.8);
      background:rgba(8,16,9,0.6); backdrop-filter:blur(8px);
      padding:4px 10px; border-radius:99px;
    }

    .card-body { padding:16px 18px 18px; background:var(--cream-warm); }
    .card-name {
      font-family:'Noto Serif Thai',serif;
      font-size:17px; font-weight:600;
      color:#1C1710; line-height:1.35; margin-bottom:6px;
    }
    .card-desc {
      font-size:12px; font-weight:300;
      color:#6A6050; line-height:1.75; margin-bottom:14px;
    }
    .card-meta-row {
      display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px;
    }
    .card-meta-item {
      display:flex; align-items:center; gap:5px;
      font-size:11px; font-weight:300; color:#7A7060;
    }
    .card-deadline {
      background:var(--red-bg); border:1px solid var(--red-border);
      border-radius:10px; padding:8px 12px;
      font-size:11px; color:var(--red-muted); margin-bottom:14px;
    }

    /* Two CTAs: detail + สมัคร */
    .card-cta-row { display:flex; gap:8px; }
    .card-cta {
      flex:1; background:#2A3A28; color:#FFFFFF;
      border:1.5px solid rgba(42,58,40,0.15);
      border-radius:var(--radius-sm); padding:11px 10px;
      font-size:12px; font-weight:500;
      font-family:'Sarabun',sans-serif; cursor:pointer;
      transition:all 0.2s ease; text-align:center;
      /* white glow behind the text */
      text-shadow: 0 0 12px rgba(255,255,255,0.55), 0 0 4px rgba(255,255,255,0.3);
    }
    .card-cta:hover {
      background:rgba(255,255,255,0.12); color:#FFFFFF;
      border-color:rgba(255,255,255,0.35);
      text-shadow: 0 0 18px rgba(255,255,255,0.8), 0 0 6px rgba(255,255,255,0.5);
    }
    .card-cta:active { transform:scale(0.97); }
    .card-cta.primary {
      flex:1.3; background:var(--green); color:#FFFFFF;
      border-color:var(--green); font-weight:600;
    }
    .card-cta.primary:hover {
      box-shadow:0 0 20px rgba(125,198,122,0.35);
    }
    .card-cta.closed {
      background:#EDE7DC; color:#9A9080;
      border-color:transparent; cursor:default;
    }
    .card-cta.closed:hover { background:#EDE7DC; box-shadow:none; }

    /* ── PAST PROGRAMS ── */
    .past-scroll {
      display:flex; gap:10px; padding:0 16px; overflow-x:auto; scrollbar-width:none;
    }
    .past-scroll::-webkit-scrollbar { display:none; }
    .past-card {
      flex:0 0 190px; background:#FFFFFF;
      border:1px solid var(--forest-border);
      border-radius:14px; padding:14px; opacity:0.65;
    }
    .past-cat { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--green-dim); margin-bottom:5px; }
    .past-name { font-family:'Noto Serif Thai',serif; font-size:13px; font-weight:600; color:#2A3A28; line-height:1.4; margin-bottom:4px; }
    .past-date { font-size:10px; color:#6A8A66; }

    /* ── LOADING ── */
    .skeletons { display:flex; flex-direction:column; gap:14px; padding:0 16px; }
    .skel {
      border-radius:var(--radius);
      background:linear-gradient(90deg,#E8E3D8 25%,#F0EBE0 50%,#E8E3D8 75%);
      background-size:200% 100%; animation:shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── EMPTY ── */
    .empty-state { display:none; flex-direction:column; align-items:center; gap:12px; padding:64px 24px; text-align:center; }
    .empty-state.show { display:flex; }
    .empty-icon { font-size:40px; opacity:0.3; }
    .empty-title { font-family:'Instrument Serif',serif; font-size:20px; color:var(--cream-mid); }
    .empty-sub { font-size:13px; font-weight:300; color:#6A8A66; line-height:1.7; max-width:240px; }

    /* ── FOOTER ── */
    .footer { padding:40px 24px 16px; text-align:center; }
    .footer p { font-size:12px; font-weight:300; color:var(--green-dim); line-height:1.9; }
    .footer a { color:var(--green); text-decoration:none; }

    /* ── DETAIL SHEET ── */
    .sheet-overlay { position:fixed; inset:0; z-index:100; display:none; }
    .sheet-overlay.open { display:block; }
    .sheet-backdrop {
      position:absolute; inset:0;
      background:rgba(6,12,7,0.82); backdrop-filter:blur(6px); cursor:pointer;
    }
    .sheet-panel {
      position:absolute; bottom:0; left:0; right:0;
      background:var(--cream-warm);
      border-radius:24px 24px 0 0; max-height:90vh; overflow-y:auto;
      animation:sheetUp 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes sheetUp { from{transform:translateY(50px);opacity:0} to{transform:translateY(0);opacity:1} }
    .sheet-handle { width:36px; height:4px; border-radius:99px; background:#D8D0C2; margin:14px auto 0; }
    .sheet-photo {
      width:100%; aspect-ratio:16/8;
      background:linear-gradient(140deg,#D4EAD0,#BDD8B8);
      display:flex; align-items:center; justify-content:center;
      font-size:52px; margin-top:16px; overflow:hidden;
    }
    .sheet-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .sheet-body { padding:20px 20px 40px; }
    .sheet-cat { font-size:9px; font-weight:600; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
    .sheet-name { font-family:'Noto Serif Thai',serif; font-size:22px; font-weight:700; color:#1C1710; line-height:1.3; margin-bottom:14px; }
    .sheet-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
    .sheet-cell { background:#EDE7DC; border-radius:10px; padding:10px 12px; }
    .sheet-cell-label { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:#9A9080; margin-bottom:3px; }
    .sheet-cell-val { font-size:13px; font-weight:500; color:#2A241A; }
    .sheet-rule { height:1px; background:#E4DCD0; margin:14px 0; }
    .sheet-desc-label { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:#9A9080; margin-bottom:8px; }
    .sheet-desc { font-size:14px; font-weight:300; color:#4A4038; line-height:1.9; white-space:pre-wrap; }
    /* images inside description */
    .sheet-desc img { width:100%; border-radius:12px; margin-top:12px; display:block; }
    .sheet-deadline { margin-top:14px; background:var(--red-bg); border:1px solid var(--red-border); border-radius:12px; padding:11px 14px; font-size:12px; color:var(--red-muted); }
    .sheet-cta-row { display:flex; gap:10px; margin-top:20px; }
    .sheet-cta {
      flex:1; background:#2A3A28; color:#FFFFFF;
      border:1.5px solid rgba(42,58,40,0.20);
      border-radius:14px; padding:14px;
      font-size:14px; font-weight:500;
      font-family:'Sarabun',sans-serif; cursor:pointer; transition:all 0.2s;
    }
    .sheet-cta:hover { background:var(--green); color:#091208; }
    .sheet-cta.primary {
      flex:1.4; background:var(--green); color:#FFFFFF;
      border-color:var(--green); font-weight:600;
    }
    .sheet-cta.primary:hover { box-shadow:0 0 24px rgba(125,198,122,0.28); }
    .sheet-cta.closed { background:#EDE7DC; color:#9A9080; border-color:transparent; cursor:default; flex:1; }
    .sheet-cta.closed:hover { background:#EDE7DC; box-shadow:none; }
    /* ── SPLIT LAYOUT ── */
    .split-wrap {
      display:flex; gap:0; padding:0 0 0 0;
      align-items:flex-start; min-height:60vh;
    }
    .split-col {
      flex:1; display:flex; flex-direction:column;
      gap:12px; padding:0 14px 32px;
      min-width:0;
    }
    .split-divider {
      width:1px; background:var(--forest-border);
      align-self:stretch; flex-shrink:0;
      margin-top:8px;
    }
    .split-header {
      font-family:'Sarabun',sans-serif;
      font-size:12px; font-weight:600;
      letter-spacing:0.5px; color:#F5F1E8;
      background:#2A3A28;
      border:none;
      border-radius:99px; padding:8px 16px;
      text-align:center; white-space:nowrap;
      box-shadow:0 2px 8px rgba(42,58,40,0.18);
    }
    /* make cards inside split cols slightly more compact */
    .split-col .prog-card .card-photo { aspect-ratio:16/6; }
    .split-col .cards { gap:10px; padding:0; }
    .split-col .skeletons { padding:0; gap:10px; }
    .split-col .empty-state { padding:32px 8px; }
  </style>
</head>

    form_url:"https://selflove.wlifepath.com/", photo_url:"", status:"active" }
];
const FALLBACK_PAST = [];

let active = [], past = [], filter = "all";
// Track registration clicks in sessionStorage per program id
function getRegCount(id) {
  try { return parseInt(sessionStorage.getItem("reg_" + id) || "0"); } catch { return 0; }
}
function incRegCount(id) {
  try { sessionStorage.setItem("reg_" + id, (getRegCount(id) + 1).toString()); } catch {}
}
function totalRegCount() {
  return active.reduce((sum, p) => sum + getRegCount(p.id), 0);
}

const CAT_COLORS = {
  "Wellbeing":"#7DC67A","Academic":"#7AAED4","Career":"#C8A032",
  "Leadership":"#B07AD4","จิตวิทยา":"#7DC67A","การเรียน":"#7AAED4",
  "อาชีพ":"#C8A032","ทักษะชีวิต":"#7DC67A",
};
function cc(cat) { return CAT_COLORS[cat] || "#7DC67A"; }

function filterBy(btn) {
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  filter = btn.dataset.cat;
  renderCards();
}

function buildChips() {
  const cats = [...new Set(active.map(p => p.category).filter(Boolean))];
  const row = document.getElementById("filter-row");
  cats.forEach(cat => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.cat = cat; b.textContent = cat;
    b.onclick = () => filterBy(b);
    row.appendChild(b);
  });
}

function renderCards() {
  const intContainer = document.getElementById("cards-int");
  const extContainer = document.getElementById("cards-ext");
  const emptyInt = document.getElementById("empty-int");
  const emptyExt = document.getElementById("empty-ext");
  intContainer.innerHTML = ""; extContainer.innerHTML = "";

  const list = filter === "all" ? active : active.filter(p => p.category === filter);
  const internal = list.filter(p => p.source !== "external");
  const external = list.filter(p => p.source === "external");

  emptyInt.classList.toggle("show", !internal.length);
  emptyExt.classList.toggle("show", !external.length);

  function buildCard(p, i, container) {
    const isClosed = p.status === "closed" || p.status === "past";
    const color = cc(p.category);
    const emoji = p.emoji || "🌱";
    const hasForm = p.form_url && p.form_url !== "#" && p.form_url !== "";
    let photoInner = p.photo_url
      ? `<img src="${p.photo_url}" alt="" onerror="this.style.display='none'"/>`
      : `<span style="opacity:0.3">${emoji}</span>`;
    let ctaHtml = "";
    if (isClosed) {
      ctaHtml = `<div class="card-cta-row"><button class="card-cta closed">ปิดรับสมัครแล้ว</button></div>`;
    } else if (hasForm) {
      ctaHtml = `<div class="card-cta-row">
        <button class="card-cta" onclick="openSheet('${p.id}');event.stopPropagation()">ดูรายละเอียด</button>
        <button class="card-cta primary" onclick="handleReg('${p.id}','${p.form_url}');event.stopPropagation()">สมัครเลย →</button>
      </div>`;
    } else {
      ctaHtml = `<div class="card-cta-row"><button class="card-cta" style="flex:1" onclick="openSheet('${p.id}');event.stopPropagation()">ดูรายละเอียด →</button></div>`;
    }
    const card = document.createElement("div");
    card.className = "prog-card";
    card.onclick = () => openSheet(p.id);
    card.innerHTML = `
      <div class="card-photo">
        ${photoInner}
        <div class="card-photo-overlay"></div>
        ${p.category ? `<div class="card-photo-cat" style="color:${color}">${p.category}</div>` : ""}
        ${p.type     ? `<div class="card-photo-type">${p.type}</div>` : ""}
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        ${p.short_desc ? `<div class="card-desc">${p.short_desc}</div>` : ""}
        <div class="card-meta-row">
          ${p.start_date ? `<div class="card-meta-item">📅 ${p.start_date}</div>` : ""}
          ${p.type       ? `<div class="card-meta-item">✦ ${p.type}</div>` : ""}
        </div>
        ${p.reg_deadline && !isClosed ? `<div class="card-deadline">⏰ ปิดรับสมัคร ${p.reg_deadline}</div>` : ""}
        ${ctaHtml}
      </div>`;
    container.appendChild(card);
    setTimeout(() => card.classList.add("visible"), i * 75);
  }

  internal.forEach((p, i) => buildCard(p, i, intContainer));
  external.forEach((p, i) => buildCard(p, i, extContainer));
  document.getElementById("stat-reg").textContent = totalRegCount() || "—";
}

function handleReg(id, url) {
  incRegCount(id);
  document.getElementById("stat-reg").textContent = totalRegCount();
  window.open(url, "_blank");
}

function renderPast() {
  if (!past.length) return;
  document.getElementById("past-section").style.display = "block";
  const el = document.getElementById("past-cards");
  past.forEach(p => {
    const c = document.createElement("div"); c.className = "past-card";
    c.innerHTML = `<div class="past-cat">${p.category||""}</div><div class="past-name">${p.name}</div><div class="past-date">${p.start_date||""}</div>`;
    el.appendChild(c);
  });
}

function renderStats() { /* removed */ }

// ── DETAIL SHEET ──────────────────────────────────────────
function openSheet(id) {
  const p = active.find(x => x.id === id);
  if (!p) return;
  const isClosed = p.status === "closed" || p.status === "past";
  const color = cc(p.category);
  const emoji = p.emoji || "🌱";
  const hasForm = p.form_url && p.form_url !== "#" && p.form_url !== "";

  const photoEl = document.getElementById("s-photo");
  if (p.photo_url) {
    photoEl.innerHTML = `<img src="${p.photo_url}" alt="" onerror="this.innerHTML='<span style=\\"font-size:52px;opacity:.3\\">${emoji}</span>'"/>`;
  } else {
    photoEl.innerHTML = `<span style="font-size:52px;opacity:0.3">${emoji}</span>`;
  }

  document.getElementById("s-cat").textContent = p.category || "";
  document.getElementById("s-cat").style.color = color;
  document.getElementById("s-name").textContent = p.name;

  // Description — supports image URLs embedded in text as [img:URL]
  const rawDesc = p.full_desc || p.short_desc || "—";
  const descEl = document.getElementById("s-desc");
  descEl.innerHTML = rawDesc.replace(/\[img:(https?:\/\/[^\]]+)\]/g,
    (_, url) => `<img src="${url}" alt=""/>`);

  // Meta grid — last cell = ผู้สมัคร count
  document.getElementById("s-grid").innerHTML = [
    p.start_date   && `<div class="sheet-cell"><div class="sheet-cell-label">วันที่จัดงาน</div><div class="sheet-cell-val">${p.start_date}</div></div>`,
    p.type         && `<div class="sheet-cell"><div class="sheet-cell-label">รูปแบบ</div><div class="sheet-cell-val">${p.type}</div></div>`,
    p.reg_deadline && `<div class="sheet-cell"><div class="sheet-cell-label">ปิดรับสมัคร</div><div class="sheet-cell-val">${p.reg_deadline}</div></div>`,
    `<div class="sheet-cell"><div class="sheet-cell-label">ผู้สมัคร</div><div class="sheet-cell-val">${getRegCount(p.id) || "—"} คน</div></div>`,
  ].filter(Boolean).join("");

  // Deadline
  const dlEl = document.getElementById("s-deadline");
  if (p.reg_deadline && !isClosed) {
    dlEl.style.display = "block";
    dlEl.textContent = `⏰ ปิดรับสมัคร ${p.reg_deadline} — อย่าลืมนะ`;
  } else { dlEl.style.display = "none"; }

  // CTA row
  const ctaRow = document.getElementById("s-cta-row");
  if (isClosed) {
    ctaRow.innerHTML = `<button class="sheet-cta closed">ปิดรับสมัครแล้ว</button>`;
  } else if (hasForm) {
    ctaRow.innerHTML = `
      <button class="sheet-cta" onclick="closeSheet()">ปิด</button>
      <button class="sheet-cta primary" onclick="handleReg('${p.id}','${p.form_url}')">สมัครเลย →</button>`;
  } else {
    ctaRow.innerHTML = `<button class="sheet-cta" onclick="closeSheet()">ปิด</button>`;
  }

  document.getElementById("sheet").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeSheet() {
  document.getElementById("sheet").classList.remove("open");
  document.body.style.overflow = "";
}
window.addEventListener("popstate", closeSheet);

// ── INIT ──────────────────────────────────────────────────
async function init() {
  try {
    const res  = await fetch(`${API_URL}?action=getPrograms`);
    const data = await res.json();
    if (data.status === "OK" && data.programs?.length) {
      active = data.programs.filter(p => p.status !== "past" && p.status !== "completed");
      past   = data.programs.filter(p => p.status === "past"  || p.status === "completed");
    } else { active = FALLBACK_ACTIVE; past = FALLBACK_PAST; }
  } catch { active = FALLBACK_ACTIVE; past = FALLBACK_PAST; }

  document.getElementById("skeletons-int").style.display = "none";
  document.getElementById("skeletons-ext").style.display = "none";
  renderStats();
  renderCards();
  renderPast();
}
init();
</script>
</body>
</html>
