<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>ดู LINE ID — ใจดี TU</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green: #3a8c6e;
    --green-soft: #eaf5f0;
    --green-border: #b8ddd0;
    --mid: #444;
    --soft: #888;
    --softer: #bbb;
    --border: #e8e8e8;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 360px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .logo {
    font-family: 'Noto Serif Thai', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--green);
  }
  .label {
    font-size: 13px;
    color: var(--soft);
  }
  .id-box {
    background: var(--green-soft);
    border: 1.5px solid var(--green-border);
    border-radius: 12px;
    padding: 16px;
    font-size: 13px;
    font-family: monospace;
    color: var(--mid);
    word-break: break-all;
    text-align: left;
    min-height: 52px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .id-text { flex: 1; line-height: 1.5; }
  .copy-btn {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.15s;
  }
  .copy-btn:active { opacity: 0.8; }
  .copy-btn:disabled { background: var(--softer); cursor: default; }
  .note {
    font-size: 12px;
    color: var(--soft);
    line-height: 1.7;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--green-border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success-toast {
    font-size: 13px;
    color: var(--green);
    font-weight: 600;
    min-height: 20px;
    transition: opacity 0.3s;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">ใจดี TU</div>
  <div class="label">LINE User ID ของฉัน<br>(ใช้สำหรับเข้าระบบ Dashboard)</div>

  <div class="id-box" id="id-box">
    <div class="spinner" id="spinner"></div>
    <span class="id-text" id="id-text"></span>
  </div>

  <button class="copy-btn" id="copy-btn" onclick="copyId()" disabled>คัดลอก ID</button>
  <div class="success-toast" id="toast"></div>

  <div class="note">
    ID นี้เป็น LINE User ID ของเธอ<br>
    ใช้ใส่ใน Dashboard (JaideeOS) ตอนล็อกอินครั้งแรก<br>
    จะถูกบันทึกไว้อัตโนมัติหลังจากนั้น<br><br>
    <strong>ไม่ต้องแชร์กับใคร</strong> — ใช้แค่สำหรับระบบนี้เท่านั้น
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = "2009806939-xslRo9A6";
let myId = null;

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    myId = profile.userId;
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('id-text').textContent = myId;
    document.getElementById('copy-btn').disabled = false;
  } catch(e) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('id-text').textContent = 'โหลดไม่ได้ — กรุณาเปิดใน LINE';
  }
}

function copyId() {
  if (!myId) return;
  navigator.clipboard.writeText(myId).then(() => {
    const t = document.getElementById('toast');
    t.textContent = '✓ คัดลอกแล้ว';
    setTimeout(() => { t.textContent = ''; }, 2500);
  }).catch(() => {
    // Fallback for older LINE browsers
    const tmp = document.createElement('textarea');
    tmp.value = myId;
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand('copy');
    document.body.removeChild(tmp);
    const t = document.getElementById('toast');
    t.textContent = '✓ คัดลอกแล้ว';
    setTimeout(() => { t.textContent = ''; }, 2500);
  });
}

init();
</script>
</body>
</html>
