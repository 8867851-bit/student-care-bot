<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>ใจดี TU — Puzzle Piece</title>
<style>
/* System font stack — Thai-safe, no external requests */
:root {
  --bg:       #F5F0E8;
  --warm:     #F0EAE0;
  --card:     #FFFEF9;
  --ink:      #211D18;
  --ink2:     #5C5550;
  --ink3:     #A09890;
  --rule:     #E4DDD0;
  --gold:     #B07D10;
  --gold-lt:  #FBF3E2;
  --gold-bd:  #E2C060;
  --noir:     #141210;
  --ease:     cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { font-size:16px; }
body {
  font-family: 'Sarabun', 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 80px;
  overflow-x: hidden;
}

/* ── MASTHEAD ─────────────────────────────── */
.masthead { padding: 52px 22px 24px; }
.masthead-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
}
.masthead-eyebrow {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--ink3);
}
.masthead-date { font-size: 9px; color: var(--ink3); letter-spacing: .5px; }
.masthead-title {
  font-family: 'Noto Serif Thai', Georgia, 'Times New Roman', serif;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--ink);
  margin-bottom: 8px;
}
.masthead-title em { font-style: italic; color: var(--gold); }
.masthead-sub {
  font-size: 13px;
  font-weight: 300;
  color: var(--ink3);
  border-left: 2px solid var(--rule);
  padding-left: 10px;
  line-height: 1.6;
  margin-bottom: 0;
}
.masthead-rule { height: 1px; background: var(--rule); margin-top: 24px; }

/* ── CHIPS ────────────────────────────────── */
.chips {
  display: flex;
  gap: 7px;
  padding: 16px 22px 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  background: transparent;
  border: 1.5px solid var(--rule);
  border-radius: 99px;
  padding: 7px 16px;
  font-family: 'Sarabun', 'Helvetica Neue', Arial, sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: var(--ink3);
  cursor: pointer;
  white-space: nowrap;
  transition: all .2s;
}
.chip.active {
  color: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(176,125,16,0.1), 0 0 14px rgba(176,125,16,0.12);
}

/* ── VIDEO STRIP ──────────────────────────── */
.vscroll {
  display: flex;
  gap: 12px;
  padding: 0 22px 24px;
  overflow-x: auto;
  scrollbar-width: none;
}
.vscroll::-webkit-scrollbar { display: none; }
.vcard {
  flex-shrink: 0;
  width: 186px;
  background: var(--warm);
  border-radius: 14px;
  border: 1px solid var(--rule);
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.6), 0 0 18px 4px rgba(255,255,255,0.55);
}
.vthumb {
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--noir);
  position: relative;
  overflow: hidden;
}
.vthumb img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  filter: saturate(0.75);
}
.vplay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.vplay-btn {
  width: 32px; height: 32px;
  background: rgba(255,255,255,0.88);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--ink);
  padding-left: 2px;
}
.vsrc {
  position: absolute; top: 8px; left: 8px;
  background: rgba(255,255,255,0.9);
  font-size: 8px; font-weight: 700;
  padding: 2px 8px;
  color: var(--ink);
  border-radius: 3px;
}
.vbody { padding: 11px 13px 13px; }
.vtag {
  font-size: 8px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--gold); margin-bottom: 5px;
}
.vtitle {
  font-size: 12px; font-weight: 600;
  line-height: 1.45; color: var(--ink);
  display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.vdur { font-size: 10px; color: var(--ink3); margin-top: 4px; }

/* ── FEED DIVIDER ─────────────────────────── */
.feed-divider {
  display: flex; align-items: center;
  padding: 4px 22px 16px;
}
.fd-line { flex: 1; height: 1px; background: var(--rule); }
.fd-label {
  font-size: 9px; font-weight: 600;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--ink3); padding: 0 12px;
}

/* ── ARTICLE ROWS ─────────────────────────── */
.article-list { padding: 0 22px; }

.article-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 18px 0;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.article-row.visible { opacity: 1; transform: translateY(0); }
.article-row:active { opacity: .7; }

/* First article: hero treatment */
.article-row.is-hero {
  flex-direction: column;
  gap: 0;
  padding-bottom: 20px;
}
.hero-img {
  width: 100%;
  aspect-ratio: 2/1;
  object-fit: cover;
  display: block;
  filter: saturate(0.82);
  border-radius: 12px;
  margin-bottom: 14px;
}

.ar-body { flex: 1; min-width: 0; }
.ar-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.ar-tag {
  font-size: 9px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--gold);
  background: var(--gold-lt);
  border: 1px solid var(--gold-bd);
  border-radius: 99px;
  padding: 3px 10px;
}
.ar-level { font-size: 10px; color: var(--ink3); }
.ar-lang {
  font-size: 9px; font-weight: 600;
  letter-spacing: .5px;
  color: #6B21A8;
  background: #F3E8FF;
  border: 1px solid #D8B4FE;
  border-radius: 99px;
  padding: 2px 8px;
}
/* Language dots — feed card */
.lang-dots { display:flex; align-items:center; gap:3px; }
.lang-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--rule);
}
.lang-dot.on { background: #7C3AED; }
/* Language scale bar — inside article */
.lang-scale {
  padding: 14px 0 0;
  border-top: 1px solid var(--rule);
  margin-top: 14px;
}
.lang-scale-labels {
  display: flex; justify-content: space-between;
  font-size: 9px; color: var(--ink3);
  letter-spacing: .5px;
  margin-bottom: 8px;
}
.lang-scale-track {
  position: relative; height: 3px;
  background: var(--rule); border-radius: 99px;
}
.lang-scale-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  border-radius: 99px;
  background: linear-gradient(90deg, #A78BFA, #6B21A8);
}
.lang-scale-dot {
  position: absolute; top: 50%;
  transform: translate(-50%, -50%);
  width: 9px; height: 9px;
  background: #6B21A8;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 1px 4px rgba(107,33,168,.35);
}
.ar-title {
  font-family: 'Noto Serif Thai', Georgia, 'Times New Roman', serif;
  font-size: 16px; font-weight: 700;
  line-height: 1.4; color: var(--ink);
  margin-bottom: 5px;
}
.article-row.is-hero .ar-title { font-size: 20px; }
.ar-desc {
  font-size: 12px; font-weight: 300;
  color: var(--ink2); line-height: 1.75;
  margin-bottom: 8px;
}
.ar-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 8px;
}
.ar-rt { font-size: 10px; color: var(--ink3); }
.ar-arr {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--warm); border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--ink3);
}

/* Thumbnail for non-hero rows */
.ar-thumb {
  width: 76px; height: 64px;
  border-radius: 8px; overflow: hidden; flex-shrink: 0;
}
.ar-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.75); }

/* ── COLLAB SECTION ───────────────────────── */
.collab-section { margin-top: 32px; }



.collab-card {
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin-bottom: 12px;
  background: var(--warm);
  border-radius: 0;
}

/* Collab header — tap to open bio */
.collab-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  background: var(--card);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
/* gold left accent */
.collab-header::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--gold-bd), var(--gold));
  border-radius: 0 2px 2px 0;
  z-index: 1;
}
/* Photo panel — right side, fixed width, any image fits */
.collab-photo {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--warm);
  position: relative;
  overflow: hidden;
  border: 2px solid var(--gold-bd);
}
.collab-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.collab-photo-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
  background: rgba(0,0,0,0.04);
  border-left: 1px dashed var(--rule);
}
.collab-photo-placeholder span:first-child {
  font-size: 22px;
}
.collab-photo-placeholder span:last-child {
  font-size: 9px; color: var(--ink3);
  letter-spacing: .5px; text-align: center;
  line-height: 1.4;
}
.collab-text-area {
  flex: 1; min-width: 0;
}
.collab-info { flex: 1; min-width: 0; }
.collab-name {
  font-family: 'Sarabun', 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px; font-weight: 700;
  color: var(--ink); margin-bottom: 2px;
}
.collab-role {
  font-size: 11px; font-weight: 300;
  color: var(--ink3); font-style: italic;
  margin-bottom: 8px; line-height: 1.4;
}
.collab-counts { display: flex; gap: 6px; flex-wrap: wrap; }
.collab-count {
  font-size: 9px; color: var(--ink3);
  border: 1px solid var(--rule);
  border-radius: 99px; padding: 2px 9px;
}

/* Collab content — warm background */
.collab-content { background: var(--warm); }

/* collab video strip */
.collab-vscroll {
  display: flex; gap: 10px;
  padding: 14px 22px 0;
  overflow-x: auto; scrollbar-width: none;
}
.collab-vscroll::-webkit-scrollbar { display: none; }
.cvcard {
  flex-shrink: 0; width: 150px;
  background: var(--warm);
  border-radius: 12px;
  border: 1px solid rgba(0,0,0,0.08);
  overflow: hidden; cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.6), 0 0 18px 4px rgba(255,255,255,0.55);
}
.cvthumb {
  width: 100%; aspect-ratio: 16/9;
  background: var(--noir);
  position: relative; overflow: hidden;
}
.cvthumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .85; }
.cvfb { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #141210; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: rgba(255,255,255,.3); }
.cvplay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.cvplay-btn {
  width: 26px; height: 26px;
  border: 1.5px solid rgba(255,255,255,.7);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #fff; padding-left: 2px;
}
.cvbody { padding: 8px 10px 10px; background: var(--warm); }
.cvtitle {
  font-size: 11px; font-weight: 600;
  line-height: 1.4; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.cvmeta { font-size: 9px; color: var(--ink3); margin-top: 3px; }

/* collab article rows */
.collab-arts { padding: 12px 22px 0; background: var(--warm); }
.ca-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-top: 1px solid rgba(0,0,0,0.07);
  cursor: pointer;
}
.ca-row:first-child { border-top: none; }

.ca-body { flex: 1; min-width: 0; }
.ca-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; margin-bottom: 2px; }
.ca-meta { font-size: 10px; color: var(--ink3); }
.ca-arr { font-size: 11px; color: var(--ink3); flex-shrink: 0; }

.collab-bio-btn {
  width: 100%; background: var(--warm); border: none;
  border-top: 1px solid var(--rule);
  padding: 12px 22px; margin-top: 12px;
  font-family: 'Sarabun', 'Helvetica Neue', Arial, sans-serif;
  font-size: 10px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--gold);
  cursor: pointer; text-align: left; display: block;
}

/* ── SERIES / BIO PAGE ────────────────────── */
.series-page {
  display: none; position: fixed; inset: 0;
  background: var(--bg); z-index: 300;
  flex-direction: column; overflow: hidden;
}
.series-page.active {
  display: flex;
  animation: slideUp .28s var(--ease) both;
}
@keyframes slideUp {
  from { transform: translateY(18px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.series-topbar {
  background: rgba(245,240,232,0.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center;
  height: 46px; padding: 0 18px; gap: 12px; flex-shrink: 0;
}
.series-back {
  background: none; border: none;
  font-size: 20px; color: var(--ink3); cursor: pointer; line-height: 1;
}
.series-topbar-title {
  font-size: 13px; font-weight: 600; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.series-body { flex: 1; overflow-y: auto; padding-bottom: 60px; }

.series-hero {
  background: var(--noir); padding: 36px 22px 30px;
  text-align: center; position: relative; overflow: hidden;
}
.series-hero::after {
  content: ''; position: absolute;
  bottom: 0; left: 15%; right: 15%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(176,125,16,.3), transparent);
}
.series-portrait {
  width: 110px; height: 110px; border-radius: 50%;
  object-fit: cover; display: block;
  border: 2px solid rgba(255,255,255,.1);
  margin: 0 auto 18px;
}
.series-portrait-ph {
  width: 110px; height: 110px; border-radius: 50%;
  background: rgba(255,255,255,.06);
  border: 2px solid rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px; margin: 0 auto 18px;
}
.series-x { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,.25); margin-bottom: 8px; }
.series-name { font-family: 'Sarabun', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 5px; line-height: 1.2; }
.series-role { font-size: 12px; color: rgba(255,255,255,.35); margin-bottom: 18px; font-style: italic; }
.series-bio { font-size: 13px; color: rgba(255,255,255,.48); line-height: 1.85; max-width: 300px; margin: 0 auto; }
.series-content { padding: 24px 22px 0; }
.series-eye {
  font-size: 9px; font-weight: 600; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--ink3);
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}
.series-item {
  display: flex; align-items: center; gap: 13px;
  padding: 14px 0; border-bottom: 1px solid var(--rule); cursor: pointer;
}
.si-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--gold-lt); border: 1px solid var(--gold-bd);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.si-icon.video { background: #F5F0FF; border-color: #C4B5FD; }
.si-title { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 3px; }
.si-meta { font-size: 10px; color: var(--ink3); }
.si-arr { font-size: 12px; color: var(--ink3); flex-shrink: 0; }

/* ── EMPTY & BACK ─────────────────────────── */
.empty-state {
  display: none; flex-direction: column;
  align-items: center; padding: 64px 24px;
  gap: 14px; text-align: center;
}
.empty-state.show { display: flex; }
.back-btn {
  background: none; border: none; color: var(--ink3);
  font-family: 'Sarabun', 'Helvetica Neue', Arial, sans-serif; font-size: 13px;
  padding: 24px 22px 0; display: block; cursor: pointer;
}
</style>
</head>
<body>

<!-- HOME -->
<div id="view-home">

  <div class="masthead">
    <div class="masthead-top">
      <div class="masthead-eyebrow">ใจดี TU · Puzzle Piece</div>
      <div class="masthead-date" id="today-date"></div>
    </div>
    <div class="masthead-title">เลือกชิ้นที่ใช่<br><em>ในแบบที่เป็นคุณ</em></div>
    <div class="masthead-sub">ไม่มีสูตรสำเร็จ — มีแต่ชิ้นส่วนที่ใช่สำหรับคุณ</div>
    <div class="masthead-rule"></div>
  </div>

  <div class="chips" id="chip-bar">
    <button class="chip active" id="chip-all">ทั้งหมด</button>
  </div>

  <!-- Video strip — no label, just the cards -->
  <div class="vscroll" id="vscroll"></div>

  <!-- Articles -->
  <div class="feed-divider">
    <div class="fd-line"></div>
    <div class="fd-label">บทความ</div>
    <div class="fd-line"></div>
  </div>

  <div class="article-list" id="article-list"></div>

  <div class="empty-state" id="empty-state">
    <div style="font-size:40px">🧩</div>
    <div style="font-family:'Noto Serif Thai',Georgia,serif;font-size:18px;font-weight:700">กำลังสร้าง</div>
    <div style="font-size:13px;color:var(--ink3);line-height:1.7">ทีมกำลังเตรียมเนื้อหา ติดตามผ่าน LINE 💛</div>
  </div>

  <!-- Collab sections -->
  <div id="collab-sections"></div>

  <button class="back-btn" onclick="window.history.back()">← กลับ</button>
</div>

<!-- READER — inline preview with language scale bar -->
<div id="reader" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:200;flex-direction:column;overflow:hidden;">
  <div style="background:rgba(245,240,232,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);display:flex;align-items:center;height:46px;padding:0 18px;gap:12px;flex-shrink:0;position:sticky;top:0;">
    <button id="reader-back" style="background:none;border:none;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1;">←</button>
    <div style="flex:1;height:2px;background:var(--rule);border-radius:99px;overflow:hidden;">
      <div id="reader-prog" style="height:100%;width:0%;background:var(--gold);transition:width .2s;"></div>
    </div>
  </div>
  <div id="reader-body" style="flex:1;overflow-y:auto;padding-bottom:80px;max-width:640px;margin:0 auto;width:100%;padding-top:0;">
    <div id="reader-content"></div>
  </div>
</div>

<!-- SERIES / BIO PAGE -->
<div class="series-page" id="series-page">
  <div class="series-topbar">
    <button class="series-back" id="btn-close-series">←</button>
    <div class="series-topbar-title" id="series-topbar-title"></div>
  </div>
  <div class="series-body" id="series-body"></div>
</div>

<script>
// ── DATE ──────────────────────────────────────
(function(){
  var d = new Date();
  var m = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
           "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  document.getElementById("today-date").textContent =
    d.getDate() + " " + m[d.getMonth()] + " " + (d.getFullYear() + 543);
})();

// ── DATA ──────────────────────────────────────
var VIDEOS = [
  { id:"V1", title:"Window of Tolerance คืออะไร", tag:"ระบบประสาท",
    source:"YouTube", url:"https://youtube.com", youtube_id:"dQw4w9WgXcQ", duration:"8:42" },

var LANG_SCALE = {
  'ทำให้เข้าใจง่าย': { pct: 8,  dots: 0 },
  'ภาษาทั่วไป':       { pct: 30, dots: 1 },
  'กึ่งวิชาการ':       { pct: 60, dots: 2 },
  'วิชาการ':           { pct: 92, dots: 3 }
};
function langDots(lang) {
  var info = LANG_SCALE[lang];
  if (!info) return '';
  var dots = '';
  for (var i = 0; i < 3; i++) {
    dots += '<div class="lang-dot' + (i < info.dots ? ' on' : '') + '"></div>';
  }
  return '<div class="lang-dots">' + dots + '</div>';
}
function langScaleBar(lang) {
  var info = LANG_SCALE[lang];
  if (!info) return '';
  return '<div class="lang-scale">' +
    '<div class="lang-scale-labels">' +
      '<span>เข้าใจง่าย</span><span>กึ่งวิชาการ</span><span>วิชาการ</span>' +
    '</div>' +
    '<div class="lang-scale-track">' +
      '<div class="lang-scale-fill" style="width:' + info.pct + '%;"></div>' +
      '<div class="lang-scale-dot" style="left:' + info.pct + '%;"></div>' +
    '</div>' +
  '</div>';
}

function loadLiveData() {
  // Fetch articles and collaborators in parallel
  var articlesReq = new XMLHttpRequest();
  articlesReq.open("GET", API_URL + "?action=getContent&world=puzzle", true);
  articlesReq.onload = function() {
    try {
      var d = JSON.parse(articlesReq.responseText);
      if (d.status === "OK" && d.content && d.content.length) {
        var parsed = [];
        d.content.forEach(function(c) {
          try {
            var body = typeof c.body === "string" ? JSON.parse(c.body) : c.body;
            parsed.push({
              id: c.id,
              title: c.title || "",
              tag: c.tag || "จิตวิทยา",
              desc: c.desc || "",
              level: c.level || "🟢 เบา",
              readTime: c.readTime || c.read_time || "5 นาที",
              language: c.language || "",
              heroUrl: c.heroUrl || c.hero_url || ""
            });
          } catch(e) {}
        });
        if (parsed.length) {
          ARTICLES = parsed;
          // Rebuild chips with real tags, re-render
          var bar = document.getElementById("chip-bar");
          bar.innerHTML = '<button class="chip active" id="chip-all">ทั้งหมด</button>';
          buildChips();
          renderArticles(ARTICLES, false);
        }
      }
    } catch(e) {}
  };
  articlesReq.onerror = function() {};
  articlesReq.send();

  var collabReq = new XMLHttpRequest();
  collabReq.open("GET", API_URL + "?action=getCollaborators", true);
  collabReq.onload = function() {
    try {
      var d = JSON.parse(collabReq.responseText);
      if (d.status === "OK" && d.collaborators && d.collaborators.length) {
        var active = d.collaborators.filter(function(c) {
          return c.active !== "FALSE" && c.active !== false;
        }).map(function(c) {
          // Normalise field names from Sheets → puzzle format
          return {
            id: c.id,
            name: c.name || "",
            role: c.role || "",
            description: c.description || c.bio || "",
            photo_url: c.photo_url || c.photo || "",
            active: true,
            content: typeof c.content === "string" ? (function(){ try{ return JSON.parse(c.content); } catch(e){ return []; } })() : (c.content || [])
          };
        });
        if (active.length) {
          COLLABS = active;
          renderCollabs(COLLABS);
        }
      }
    } catch(e) {}
  };
  collabReq.onerror = function() {};
  collabReq.send();
}

// ── CHIPS ─────────────────────────────────────
function buildChips() {
  var bar = document.getElementById("chip-bar");
  var ORDER = ["ความวิตกกังวล","ความเครียด","ความสัมพันธ์","ตัวตน",
               "แรงจูงใจ","การเรียนรู้","การนอน","หนังสือ","งานวิจัย"];
  var existing = {};
  [PINNED].concat(ARTICLES).forEach(function(a){ if(a.tag) existing[a.tag] = true; });
  var tags = ORDER.filter(function(t){ return existing[t]; });
  Object.keys(existing).forEach(function(t){ if(tags.indexOf(t)===-1) tags.push(t); });

  tags.forEach(function(tag){
    var btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = tag;
    btn.addEventListener("click", function(){
      document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
      btn.classList.add("active");
      renderArticles(ARTICLES.filter(function(a){ return a.tag===tag; }), true);
    });
    bar.appendChild(btn);
  });

  document.getElementById("chip-all").addEventListener("click", function(){
    document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
    this.classList.add("active");
    renderArticles(ARTICLES, false);
  });
}

function renderVideos(videos) {

// ── ARTICLES ──────────────────────────────────
function renderArticles(list, filterMode) {
  var container = document.getElementById("article-list");
  container.innerHTML = "";
  var empty = document.getElementById("empty-state");

  // In filter mode don't show pinned; in all mode pinned is always first
  var feed = filterMode
    ? list
    : [PINNED].concat(list.filter(function(a){ return a.id !== PINNED.id; }));

  if (!feed.length){ empty.classList.add("show"); return; }
  empty.classList.remove("show");

  feed.forEach(function(a, i){
    var row = document.createElement("div");
    row.className = "article-row" + (i===0 && !filterMode ? " is-hero" : "");

    if (i===0 && !filterMode && a.heroUrl) {
      // Hero: image on top, full desc
      row.innerHTML =
        '<img class="hero-img" src="'+a.heroUrl+'" onerror="this.style.display=\'none\'"/>'+
        '<div class="ar-body">'+
          '<div class="ar-meta"><div class="ar-tag">'+(a.tag||"")+'</div>'+
          (a.language ? langDots(a.language) : '')+
        '</div>'+
          '<div class="ar-title">'+a.title+'</div>'+
          '<div class="ar-desc">'+(a.desc||"")+'</div>'+
          '<div class="ar-foot"><div class="ar-rt">⏱ '+(a.readTime||"5 นาที")+'</div><div class="ar-arr">→</div></div>'+
        '</div>';
    } else {
      // Plain row: text left, small thumb right if exists
      var thumbHtml = a.heroUrl
        ? '<div class="ar-thumb"><img src="'+a.heroUrl+'" onerror="this.parentElement.style.display=\'none\'"/></div>'
        : '';
      row.innerHTML =
        '<div class="ar-body">'+
          '<div class="ar-meta"><div class="ar-tag">'+(a.tag||"")+'</div>'+
          (a.language ? langDots(a.language) : '')+
        '</div>'+
          '<div class="ar-title">'+a.title+'</div>'+
          '<div class="ar-foot"><div class="ar-rt">⏱ '+(a.readTime||"5 นาที")+'</div><div class="ar-arr">→</div></div>'+
        '</div>'+
        thumbHtml;
    }

    (function(article){ row.addEventListener("click", function(){ openReader(article); }); })(a);
    container.appendChild(row);
    setTimeout(function(){ row.classList.add("visible"); }, i * 60);
  });
}

// ── COLLABS ───────────────────────────────────
function renderCollabs(collabs) {
  var container = document.getElementById("collab-sections");
  container.innerHTML = "";
  var active = collabs.filter(function(c){ return c.active; });
  if (!active.length) return;



  active.forEach(function(c, i){
    container.appendChild(makeCollabCard(c, i));
  });
}

function makeCollabCard(c, idx) {
  var videos   = (c.content||[]).filter(function(x){ return x.type==="video"; });
  var articles = (c.content||[]).filter(function(x){ return x.type==="article"; });

  var counts = "";
  if (videos.length)   counts += '<span class="collab-count">▶ '+videos.length+' วิดีโอ</span>';
  if (articles.length) counts += '<span class="collab-count">📝 '+articles.length+' บทความ</span>';

  var wrap = document.createElement("div");
  wrap.className = "collab-card";

  // Header
  var header = document.createElement("div");
  header.className = "collab-header";
  var photoHtml = c.photo_url
    ? '<div class="collab-photo"><img src="'+c.photo_url+'" onerror="this.parentElement.innerHTML=\'<div class=collab-photo-placeholder><span>📷</span><span>ใส่รูปผ่าน<br>dashboard</span></div>\'"/></div>'
    : '<div class="collab-photo"><div class="collab-photo-placeholder"><span>📷</span><span>ใส่รูปผ่าน<br>dashboard</span></div></div>';
  header.innerHTML =
    '<div class="collab-text-area">'+
      '<div class="collab-info">'+
        '<div class="collab-name">'+(c.name||"")+'</div>'+
        '<div class="collab-role">'+(c.role||"")+'</div>'+
        '<div class="collab-counts">'+counts+'</div>'+
      '</div>'+
      /* no arrow */
    '</div>'+
    photoHtml;
  header.addEventListener("click", function(){ openSeries(c); });

  // Content
  var content = document.createElement("div");
  content.className = "collab-content";

  // Videos
  if (videos.length) {
    var vstrip = document.createElement("div");
    vstrip.className = "collab-vscroll";
    videos.forEach(function(v){
      var vc = document.createElement("div");
      vc.className = "cvcard";
      var th = v.youtube_id
        ? '<img src="https://img.youtube.com/vi/'+v.youtube_id+'/hqdefault.jpg" onerror="this.style.display=\'none\'"/>'
        : '<div class="cvfb">'+(v.source||'')+'</div>';
      vc.innerHTML =
        '<div class="cvthumb">'+th+
          '<div class="cvplay"><div class="cvplay-btn">▶</div></div>'+
        '</div>'+
        '<div class="cvbody">'+
          '<div class="cvtitle">'+v.title+'</div>'+
          '<div class="cvmeta">▶ '+(v.duration||"")+' · '+(v.source||"YouTube")+'</div>'+
        '</div>';
      vc.addEventListener("click", function(){ if(v.url) window.open(v.url,"_blank"); });
      vstrip.appendChild(vc);
    });
    content.appendChild(vstrip);
  }

  // Articles
  if (articles.length) {
    var alist = document.createElement("div");
    alist.className = "collab-arts";
    articles.forEach(function(a){
      var row = document.createElement("div");
      row.className = "ca-row";
      row.innerHTML =
        '<div class="ca-body">'+
          '<div class="ca-title">'+a.title+'</div>'+
          '<div class="ca-meta">📖 '+(a.readTime||"5 นาที")+' · '+(a.tag||"")+'</div>'+
        '</div>'+
        '<div class="ca-arr">→</div>';
      alist.appendChild(row);
    });
    content.appendChild(alist);
  }

  // Bio button
  var bioBtn = document.createElement("button");
  bioBtn.className = "collab-bio-btn";
  bioBtn.textContent = "ดูโปรไฟล์ทั้งหมด →";
  bioBtn.addEventListener("click", function(){ openSeries(c); });
  content.appendChild(bioBtn);

  wrap.appendChild(header);
  wrap.appendChild(content);

  // Animate in
  wrap.style.opacity = "0";
  wrap.style.transform = "translateY(8px)";
  wrap.style.transition = "opacity .4s var(--ease), transform .4s var(--ease)";
  setTimeout(function(){
    wrap.style.opacity = "1";
    wrap.style.transform = "translateY(0)";
  }, 150 + idx * 100);

  return wrap;
}

      '</div>'+
      '<div class="si-arr">→</div>'+
      '</div>';
  }).join("");

  document.getElementById("series-body").innerHTML =
    '<div class="series-hero">'+
      '<div class="series-x">ใจดี TU ×</div>'+
      portrait+
      '<div class="series-name">'+(c.name||"")+'</div>'+
      '<div class="series-role">'+(c.role||"")+'</div>'+
      (c.description?'<div class="series-bio">'+c.description+'</div>':"")+
    '</div>'+
    '<div class="series-content">'+
      '<div class="series-eye">เนื้อหาทั้งหมด · '+(c.content||[]).length+' รายการ</div>'+
      items+
    '</div>';

  document.querySelectorAll(".series-item").forEach(function(el){
    el.addEventListener("click", function(){
      var item = currentCollab.content[parseInt(this.dataset.idx)];
      if (item && item.type==="video" && item.url) window.open(item.url,"_blank");
    });
  });

  document.getElementById("series-page").classList.add("active");
  document.body.style.overflow = "hidden";
  document.getElementById("series-body").scrollTop = 0;
}

// ── READER ───────────────────────────────────────
function openReader(a) {
  var body = document.getElementById("reader-body");
  var prog = document.getElementById("reader-prog");
  prog.style.width = "0%";

  var lang = a.language || "";
  var scaleHtml = langScaleBar(lang);

  document.getElementById("reader-content").innerHTML =
    // Hero image if exists
    (a.heroUrl ? '<img src="'+a.heroUrl+'" style="width:100%;aspect-ratio:2/1;object-fit:cover;display:block;filter:saturate(.82);" onerror="this.style.display=\'none\'"/>' : '') +
    // Header
    '<div style="padding:28px 22px 22px;border-bottom:1px solid var(--rule);text-align:center;">' +
      '<div style="font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:12px;">'+(a.tag||"")+'</div>' +
      '<div style="font-size:24px;font-weight:700;line-height:1.3;margin-bottom:12px;">'+a.title+'</div>' +
      '<div style="font-size:13px;color:var(--ink2);line-height:1.8;margin-bottom:14px;">'+(a.desc||"")+'</div>' +
      '<div style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--ink3);">' +
        '<span>ใจดี TU</span><span style="color:var(--rule);">·</span>' +
        '<span>'+(a.level||"🟢 เบา")+'</span><span style="color:var(--rule);">·</span>' +
        '<span>⏱ '+(a.readTime||"5 นาที")+'</span>' +
      '</div>' +
      // SCALE BAR — no text label below
      scaleHtml +
    '</div>' +
    // Body preview
    '<div style="padding:24px 22px 0;">' +
      '<p style="font-size:15px;font-weight:300;color:var(--ink2);line-height:2.1;margin-bottom:24px;">'+(a.desc ? a.desc + ' — เนื้อหาเต็มจะแสดงเมื่อ deploy จริง บทความนี้ถูกเก็บใน Google Sheets และโหลดผ่าน Apps Script' : "")+'</p>' +
      '<div style="border:1.5px dashed var(--rule);border-radius:12px;padding:24px;text-align:center;color:var(--ink3);">'+
        '<div style="font-size:24px;margin-bottom:8px;">🧩</div>'+
        '<div style="font-size:13px;font-weight:600;margin-bottom:4px;">เนื้อหาเต็มใน production</div>'+
        '<div style="font-size:12px;line-height:1.7;">บทความนี้เชื่อมกับ dashboard — ทีมเพิ่มเนื้อหาผ่าน puzzle builder แล้วแสดงที่นี่อัตโนมัติ</div>'+
      '</div>'+
    '</div>';

  var reader = document.getElementById("reader");
  reader.style.display = "flex";
  document.body.style.overflow = "hidden";
  body.scrollTop = 0;

  body.onscroll = function() {
    var max = body.scrollHeight - body.clientHeight;
    if (!max) return;
    prog.style.width = Math.min(Math.round((body.scrollTop / max) * 100), 100) + "%";
  };
}

function closeReader() {
  document.getElementById("reader").style.display = "none";
  document.body.style.overflow = "";
}

function closeSeries(){
  document.getElementById("series-page").classList.remove("active");
  document.body.style.overflow = "";
}
document.getElementById("btn-close-series").addEventListener("click", closeSeries);
document.getElementById("reader-back").addEventListener("click", closeReader);
</script>
</body>
</html>
