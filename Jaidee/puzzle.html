<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>ใจดี TU — Puzzle Piece</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --cream:#FAF9F6; --ink:#1A1714; --ink-mid:#4A4540; --ink-soft:#928C85;
      --rule:#DDD9D2; --gold:#B07D10; --gold-bg:#FBF3E2; --gold-border:#F0D080;
      --dark:#1A1714; --mid:#4A4540; --soft:#928C85; --border:#DDD9D2;
      --white:#fff; --surface:#F7F4EF;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Sarabun',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding-bottom:80px;}

    /* HOME */
    .home-header{padding:48px 20px 16px;}
    .eyebrow{font-size:10px;font-weight:500;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
    .headline{font-family:'Noto Serif Thai',serif;font-size:26px;font-weight:600;line-height:1.3;}
    .sub{font-size:13px;font-weight:300;color:var(--ink-mid);line-height:1.7;margin-top:6px;}
    .chips{display:flex;gap:8px;padding:0 20px 16px;overflow-x:auto;scrollbar-width:none;}
    .chips::-webkit-scrollbar{display:none;}
    .chip{flex-shrink:0;background:var(--white);border:1px solid var(--border);border-radius:99px;padding:6px 14px;font-size:12px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:all 0.15s;}
    .chip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
    .card-grid{display:flex;flex-direction:column;gap:12px;padding:0 16px;}
    .article-card{background:var(--white);border-radius:16px;border:1px solid var(--border);padding:18px;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity 0.3s,transform 0.3s;}
    .article-card.visible{opacity:1;transform:translateY(0);}
    .article-card:active{transform:scale(0.98);}
    .card-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
    .card-tag{font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-border);border-radius:99px;padding:3px 10px;}
    .card-level{font-size:10px;color:var(--ink-soft);}
    .card-title{font-family:'Noto Serif Thai',serif;font-size:17px;font-weight:600;line-height:1.4;margin-bottom:6px;}
    .card-desc{font-size:12px;font-weight:300;color:var(--ink-mid);line-height:1.6;}
    .card-footer{margin-top:14px;display:flex;align-items:center;justify-content:space-between;}
    .card-rt{font-size:11px;color:var(--ink-soft);}
    .card-arr{width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft);}
    .loading-row{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:13px;padding:12px 20px;}
    .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state{padding:64px 24px;text-align:center;display:none;flex-direction:column;align-items:center;gap:14px;}
    .empty-icon{font-size:44px;}
    .empty-title{font-family:'Noto Serif Thai',serif;font-size:20px;}
    .empty-sub{font-size:13px;color:var(--ink-soft);line-height:1.7;max-width:260px;}
    .back-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;padding:20px 20px 0;display:block;}

    /* READER */
    .reader{display:none;position:fixed;inset:0;background:var(--cream);z-index:100;flex-direction:column;overflow:hidden;}
    .reader.active{display:flex;animation:slideUp 0.28s cubic-bezier(0.22,1,0.36,1) both;}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .reader-topbar{position:sticky;top:0;z-index:10;background:rgba(250,249,246,0.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);display:flex;align-items:center;height:44px;padding:0 18px;gap:12px;flex-shrink:0;}
    .reader-back{font-size:18px;color:var(--ink-soft);background:none;border:none;cursor:pointer;flex-shrink:0;}
    .reader-prog{flex:1;height:2px;background:var(--rule);border-radius:99px;overflow:hidden;}
    .reader-prog-fill{height:100%;width:0%;background:var(--ink);transition:width 0.25s;}
    .reader-pct{font-size:11px;color:var(--ink-soft);min-width:28px;text-align:right;}
    .reader-body{flex:1;overflow-y:auto;padding-bottom:60px;}

    /* ARTICLE */
    .art{max-width:620px;margin:0 auto;}
    .art-hero img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;}
    .art-hero-cap{font-size:12px;color:var(--ink-soft);font-style:italic;padding:8px 20px 0;line-height:1.6;}
    .art-hdr{padding:28px 20px 24px;text-align:center;border-bottom:1px solid var(--rule);}
    .art-hdr-tag{font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
    .art-hdr-title{font-family:'Noto Serif Thai',serif;font-size:26px;font-weight:700;line-height:1.3;margin-bottom:12px;}
    .art-hdr-deck{font-size:14px;font-weight:300;color:var(--ink-mid);line-height:1.8;max-width:480px;margin:0 auto 16px;}
    .art-hdr-meta{font-size:11px;color:var(--ink-soft);display:flex;gap:8px;justify-content:center;align-items:center;}
    .art-hdr-meta .sep{color:var(--rule);}
    .art-body{padding:24px 20px 0;}
    p.ap{font-size:15px;font-weight:300;color:var(--ink-mid);line-height:2;margin-bottom:24px;}
    p.ap strong{font-weight:500;color:var(--ink);}
    p.ap em{font-style:italic;}
    p.ap.drop::first-letter{font-family:'Noto Serif Thai',serif;font-size:56px;font-weight:700;line-height:0.78;float:left;margin-right:5px;margin-top:8px;color:var(--ink);}
    h2.ah{font-family:'Noto Serif Thai',serif;font-size:20px;font-weight:700;color:var(--ink);line-height:1.4;margin:36px 0 14px;text-align:center;}
    hr.ar{border:none;border-top:1px solid var(--rule);margin:28px 0;}
    .a-callout{background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:14px 16px;margin:20px 0;}
    .a-callout p{font-family:'Noto Serif Thai',serif;font-size:14px;font-weight:400;color:#5C3A00;line-height:1.75;font-style:italic;}
    .a-pullquote{margin:28px 0;padding:18px 0 20px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);}
    .a-pullquote p{font-family:'Noto Serif Thai',serif;font-size:17px;font-style:italic;color:var(--ink);line-height:1.6;}
    .a-pullquote .attr{font-size:11px;letter-spacing:1px;color:var(--ink-soft);margin-top:8px;font-style:normal;}
    .a-bleed{width:100%;margin:24px 0;}
    .a-bleed img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;}
    .a-bleed-cap{font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:7px;line-height:1.5;}
    .a-video{width:100%;margin:24px 0;}
    .a-video iframe{width:100%;display:block;aspect-ratio:16/9;border:none;}
    .a-video-cap{font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:7px;line-height:1.5;}
    .a-pullquote{margin:28px 0;padding:18px 0 20px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);}
    .a-pullquote p{font-family:'Noto Serif Thai',serif;font-size:17px;font-style:italic;color:var(--ink);line-height:1.65;}
    .a-pullquote-attr{font-size:11px;letter-spacing:1px;color:var(--ink-soft);margin-top:8px;font-style:normal;}
    .a-table{width:100%;border-collapse:collapse;margin:22px 0;font-size:13px;}
    .a-table th{font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:8px 10px 6px;border-bottom:2px solid var(--ink);}
    .a-table td{padding:10px 10px;color:var(--ink-mid);font-weight:300;line-height:1.6;border-bottom:1px solid var(--rule);vertical-align:top;}
    .a-table tr:last-child td{border-bottom:none;}

    /* QUIZ */
    .a-quiz{margin:28px 0;padding-top:16px;border-top:2px solid var(--ink);}
    .a-quiz-eye{font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;}
    .a-quiz-q{font-family:'Noto Serif Thai',serif;font-size:17px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:16px;}
    .a-quiz-opts{display:flex;flex-direction:column;}
    .a-quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:'Sarabun',sans-serif;text-align:left;width:100%;transition:background 0.1s;}
    .a-quiz-opt:first-child{border-top:1px solid var(--rule);}
    .a-quiz-opt.selected{background:var(--gold-bg);}
    .aql{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:var(--ink-soft);margin-top:1px;transition:all 0.15s;}
    .a-quiz-opt.selected .aql{background:var(--ink);color:var(--white);border-color:var(--ink);}
    .aqt{font-size:14px;font-weight:300;color:var(--ink-mid);line-height:1.65;flex:1;}
    .a-quiz-opt.selected .aqt{color:var(--ink);font-weight:400;}
    .a-quiz-fb{margin-top:14px;padding:13px 14px;background:var(--gold-bg);border-left:3px solid var(--gold);font-size:13px;font-weight:300;color:#5C3A00;line-height:1.7;display:none;}
    .a-quiz-fb.show{display:block;animation:fi 0.22s ease;}
    @keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

    /* REFLECTION */
    .a-reflect{margin:40px 0 0;padding-top:20px;border-top:3px double var(--ink);}
    .a-reflect-eye{font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;}
    .a-reflect-q{font-family:'Noto Serif Thai',serif;font-size:18px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:18px;}
    .a-reflect-opts{display:flex;flex-direction:column;}
    .a-reflect-opt{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:'Sarabun',sans-serif;text-align:left;width:100%;transition:background 0.12s;}
    .a-reflect-opt:first-child{border-top:1px solid var(--rule);}
    .a-reflect-opt.selected{background:#F0ECE5;}
    .arl{font-size:18px;flex-shrink:0;width:28px;text-align:center;}
    .art-rt{font-size:14px;font-weight:300;color:var(--ink-mid);line-height:1.6;}
    .a-reflect-opt.selected .art-rt{color:var(--ink);font-weight:400;}

    /* COMPLETION */
    .a-completion{background:var(--ink);padding:32px 20px;margin:36px 0 0;text-align:center;display:none;}
    .a-comp-eye{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:12px;}
    .a-comp-title{font-family:'Noto Serif Thai',serif;font-size:22px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:8px;}
    .a-comp-sub{font-size:13px;font-weight:300;color:rgba(255,255,255,0.5);line-height:1.75;margin-bottom:22px;}
    .a-comp-tag-eye{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:8px;}
    .a-comp-tag{display:inline-block;border:1px solid rgba(255,255,255,0.2);padding:7px 18px;font-size:13px;font-weight:500;letter-spacing:1px;color:#fff;border-radius:2px;}
    .a-comp-btn{display:block;margin-top:24px;width:100%;background:none;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.55);padding:13px;font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;}

    /* ── COLLAB BANNER ── */
    .collab-banner{margin:4px 16px 0;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--ink);border:1px solid var(--ink);}
    .collab-banner-inner{padding:20px;display:flex;align-items:center;gap:14px;}
    .collab-avatar{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);flex-shrink:0;object-fit:cover;background:rgba(255,255,255,0.08);}
    .collab-x{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:3px;}
    .collab-name{font-family:'Noto Serif Thai',serif;font-size:16px;font-weight:600;color:#fff;line-height:1.2;margin-bottom:3px;}
    .collab-role{font-size:11px;font-weight:300;color:rgba(255,255,255,0.45);margin-bottom:10px;}
    .collab-pills{display:flex;gap:7px;flex-wrap:wrap;}
    .collab-pill{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:99px;padding:3px 10px;font-size:10px;color:rgba(255,255,255,0.55);}
    .collab-arr{color:rgba(255,255,255,0.25);font-size:16px;flex-shrink:0;margin-left:auto;}

    /* ── COLLAB SERIES PAGE ── */
    .series-page{display:none;position:fixed;inset:0;background:var(--cream);z-index:200;flex-direction:column;overflow:hidden;}
    .series-page.active{display:flex;animation:slideUp 0.28s cubic-bezier(0.22,1,0.36,1) both;}
    .series-topbar{background:rgba(250,249,246,0.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);display:flex;align-items:center;height:44px;padding:0 18px;gap:12px;flex-shrink:0;}
    .series-back{font-size:18px;color:var(--ink-soft);background:none;border:none;cursor:pointer;flex-shrink:0;}
    .series-topbar-title{font-size:13px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .series-body{flex:1;overflow-y:auto;padding-bottom:60px;}
    .series-hero{background:var(--ink);padding:28px 20px 24px;}
    .series-hero-x{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:16px;}
    .series-hero-row{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
    .series-avatar{width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);object-fit:cover;flex-shrink:0;}
    .series-name{font-family:'Noto Serif Thai',serif;font-size:22px;font-weight:700;color:#fff;line-height:1.25;margin-bottom:4px;}
    .series-role{font-size:12px;font-weight:300;color:rgba(255,255,255,0.45);}
    .series-bio{font-size:13px;font-weight:300;color:rgba(255,255,255,0.55);line-height:1.8;margin-bottom:16px;}
    .series-socials{display:flex;gap:7px;flex-wrap:wrap;}
    .series-social{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:99px;padding:6px 13px;font-size:11px;color:rgba(255,255,255,0.6);text-decoration:none;cursor:pointer;}
    .series-content{padding:20px 16px 0;}
    .series-section-eye{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;}
    .series-item{background:var(--white);border-radius:14px;border:1px solid var(--rule);display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;}
    .si-icon{width:38px;height:38px;border-radius:9px;background:var(--gold-bg);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
    .si-icon.video{background:var(--purple-soft,#F5F3FF);border-color:#DDD6FE;}
    .si-body{flex:1;min-width:0;}
    .si-title{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:3px;}
    .si-meta{font-size:11px;color:var(--ink-soft);}
    .si-arr{font-size:13px;color:var(--ink-soft);flex-shrink:0;}
  </style>
</head>
<body>

<!-- HOME -->
<div id="view-home">
  <div class="home-header">
    <div class="eyebrow">ใจดี TU · Puzzle Piece</div>
    <div class="headline" id="headline">จิตวิทยาที่<em style="font-style:italic;color:var(--gold);">อ่านได้</em></div>
    <div class="sub" id="sub">อ่าน → คิด → เชื่อมกับตัวเอง</div>
  </div>
  <div class="chips" id="chip-bar">
    <div class="chip active" onclick="filterByTag('all',this)">ทั้งหมด</div>
  </div>
  <div id="loading-row" class="loading-row"><div class="spinner"></div><span>กำลังโหลด...</span></div>
  <div class="card-grid" id="card-grid"></div>
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">🧩</div>
    <div class="empty-title">กำลังสร้าง</div>
    <div class="empty-sub">ทีม Content กำลังเตรียมเนื้อหา ติดตามได้ผ่าน LINE 💛</div>
  </div>
  <button class="back-btn" onclick="window.history.back()">← กลับ</button>
</div>

<!-- READER -->
<div class="reader" id="reader">
  <div class="reader-topbar">
    <button class="reader-back" onclick="closeReader()">←</button>
    <div class="reader-prog"><div class="reader-prog-fill" id="rpf"></div></div>
    <div class="reader-pct" id="rpct">0%</div>
  </div>
  <div class="reader-body" id="reader-body" onscroll="updateProg()">
    <div class="art" id="art-content"></div>
  </div>
</div>

<!-- COLLAB SERIES PAGE -->
<div class="series-page" id="series-page">
  <div class="series-topbar">
    <button class="series-back" onclick="closeSeries()">←</button>
    <div class="series-topbar-title" id="series-topbar-title"></div>
  </div>
  <div class="series-body" id="series-body"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyQFbcxgTyjwRrp-3vJb0MPMD8ZVAPnzZiGJFD68ojv3jQlUaEOadYoSPYua5052B9kWQ/exec";

const MOCK_ARTICLES = [
  {
    id:"MOCK001", title:"แรงจูงใจของเรามาจากไหนกันแน่?",
    tag:"แรงจูงใจ", desc:"ทำไมบางวันเราทำได้ไม่หยุด บางวันแค่เปิดหนังสือก็ยังสู้ไม่ไหว",
    level:"🟡 กลาง", readTime:"10 นาที",
    heroUrl:"https://images.stockcake.com/public/b/d/3/bd3568b3-0e3f-4484-9671-e574e6e35d91_large/late-night-studying-stockcake.jpg",
    body:{
      sections:[
        {type:"text",heading:"",content:"ลองนึกถึงครั้งสุดท้ายที่คุณทำอะไรบางอย่างจนลืมเวลา นักจิตวิทยาสนใจคำถามนี้มากว่าครึ่งศตวรรษ และคำตอบที่ได้ไม่ใช่แค่ว่าแรงจูงใจมาจากรางวัล แต่ซับซ้อนกว่ามาก"},
        {type:"callout",content:"แรงจูงใจที่แข็งแกร่งที่สุดไม่ใช่ 'อยากได้รางวัล' แต่คือ 'นี่คือสิ่งที่คนแบบฉันทำ'"},
        {type:"interaction",id:"i1",question:"ตอนนี้คุณมาอ่านบทความนี้เพราะอะไร?",choices:[
          {text:"อยากรู้ว่าจิตวิทยาอธิบายเรื่องนี้ยังไง",feedback:"นั่นคือสัญญาณของ IM ที่ยังมีชีวิต 💛"},
          {text:"รู้สึกว่าต้องอ่าน มีประโยชน์กับการเรียน",feedback:"EM ก็ขับเคลื่อนได้นะ ลองสังเกตว่าถ้าความมีประโยชน์หายไป คุณยังอยากอ่านอยู่ไหม"},

let allArticles = [], currentArticle = null, reflectionResult = null, activeTag = "all";
let currentQuizSelections = {};
let allCollabs = [], currentCollab = null;

function filterByTag(tag, el) {
  activeTag = tag;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  const filtered = allArticles.filter(a => tag === "all" || a.tag === tag);
  if(tag === "all") renderFeedWithCollabs(filtered);
  else renderCards(filtered);
}

function buildChips(articles) {
  const tags = [...new Set(articles.map(a => a.tag).filter(Boolean))];
  const bar = document.getElementById("chip-bar");
  bar.querySelectorAll(".chip:not(:first-child)").forEach(c => c.remove());
  tags.forEach(tag => {
    const chip = document.createElement("div");
    chip.className = "chip"; chip.textContent = tag;
    chip.onclick = () => filterByTag(tag, chip);
    bar.appendChild(chip);
  });
}

function renderCards(articles) {
  const grid = document.getElementById("card-grid");
  grid.innerHTML = "";
  if(!articles.length){document.getElementById("empty-state").style.display="flex";return;}
  document.getElementById("empty-state").style.display="none";
  articles.forEach((a,i) => {
    const card = document.createElement("div");
    card.className = "article-card";
    card.onclick = () => openReader(a);
    card.innerHTML = `
      <div class="card-meta"><div class="card-tag">${a.tag||"จิตวิทยา"}</div><div class="card-level">${a.level||""}</div></div>
      <div class="card-title">${a.title}</div>
      <div class="card-desc">${a.desc||""}</div>
      <div class="card-footer"><div class="card-rt">⏱ ${a.readTime||"5 นาที"}</div><div class="card-arr">→</div></div>`;
    grid.appendChild(card);
    setTimeout(() => card.classList.add("visible"), i * 60);
  });
}

async function loadSettings() {
  try {
    const d = await (await fetch(API_URL + "?action=getSiteSettings")).json();
    if(d.status==="OK"&&d.settings){
      if(d.settings.puzzle_headline) document.getElementById("headline").innerHTML =
        d.settings.puzzle_headline.replace(/\*(.+?)\*/g,'<em style="font-style:italic;color:var(--gold);">$1</em>');
      if(d.settings.puzzle_sub) document.getElementById("sub").innerText = d.settings.puzzle_sub;
    }
  } catch {}
}

async function load() {
  // Show mock immediately so page is never blank
  allArticles = MOCK_ARTICLES;
  document.getElementById("loading-row").style.display = "none";
  buildChips(MOCK_ARTICLES);
  renderFeedWithCollabs(MOCK_ARTICLES);

  // Fetch real content + collabs in parallel
  try {
    const [contentRes, collabRes] = await Promise.all([
      fetch(API_URL + "?action=getContent&world=puzzle").then(r=>r.json()).catch(()=>null),
      fetch(API_URL + "?action=getCollaborators").then(r=>r.json()).catch(()=>null),
    ]);

    let items = MOCK_ARTICLES;
    if(contentRes?.status==="OK" && contentRes.content?.length) {
      const parsed = contentRes.content.map(c => {
        let body = null;
        try { body = typeof c.body==="string" ? JSON.parse(c.body) : c.body; } catch {}
        return { id:c.id, title:c.title, tag:c.tag||"จิตวิทยา", desc:c.desc||"", level:c.level||"🟢 เบา", readTime:c.readTime||"5 นาที", heroUrl:c.heroUrl||"", body };
      }).filter(a => a.body?.sections);
      if(parsed.length) items = parsed;
    }

    if(collabRes?.status==="OK" && collabRes.collaborators?.length) {
      allCollabs = collabRes.collaborators.filter(c => c.active !== "FALSE" && c.active !== false);
    }

    // Re-render with real data if anything changed
    allArticles = items;
    buildChips(items);
    renderFeedWithCollabs(items);
    loadViews(items);
  } catch(e) {}
}

// READER
function openReader(article) {
  currentArticle = article; reflectionResult = null; currentQuizSelections = {};
  trackView(article.id);
  document.getElementById("rpf").style.width = "0%";
  document.getElementById("rpct").textContent = "0%";
  renderArticle(article);
  document.getElementById("reader").classList.add("active");
  document.body.style.overflow = "hidden";
  document.getElementById("reader-body").scrollTop = 0;
}

function closeReader() {
  document.getElementById("reader").classList.remove("active");
  document.body.style.overflow = "";
}

function updateProg() {
  const b = document.getElementById("reader-body");
  const max = b.scrollHeight - b.clientHeight;
  if(!max) return;
  const pct = Math.min(Math.round((b.scrollTop/max)*100),100);
  document.getElementById("rpf").style.width = pct + "%";
  document.getElementById("rpct").textContent = pct + "%";
}

function renderArticle(a) {
  const b = a.body;
  let html = "";

  // Hero image
  if(a.heroUrl) {
    html += `<div class="art-hero"><img src="${a.heroUrl}" alt="${a.title}" onerror="this.parentElement.style.display='none'"/></div>`;
  }

  // Header
  html += `
    <div class="art-hdr">
      <div class="art-hdr-tag">${a.tag||"จิตวิทยา"}</div>
      <div class="art-hdr-title">${a.title}</div>
      <div class="art-hdr-deck">${a.desc||""}</div>
      <div class="art-hdr-meta">
        <span>ใจดี TU</span><span class="sep">·</span>
        <span>${a.level||"🟢 เบา"}</span><span class="sep">·</span>
        <span>⏱ ${a.readTime||"5 นาที"}</span>
      </div>
    </div>
    <div class="art-body">`;

  let isFirst = true;
  (b.sections||[]).forEach((s, idx) => {
    if(s.type==="text") {
      if(s.heading) html += `<h2 class="ah">${s.heading}</h2>`;
      const cls = isFirst ? "ap drop" : "ap";
      html += `<p class="${cls}">${(s.content||"").replace(/\n/g,"<br/>")}</p>`;
      isFirst = false;
      if(idx < b.sections.length-1 && b.sections[idx+1]?.type==="text") html += `<hr class="ar"/>`;
    }
    else if(s.type==="callout") {
      html += `<div class="a-callout"><p>${s.content}</p></div>`;
    }
    else if(s.type==="image") {
      html += `<div class="a-bleed"><img src="${s.url}" alt="${s.caption||""}" onerror="this.parentElement.style.display='none'"/></div>`;
      if(s.caption) html += `<div class="a-bleed-cap">${s.caption}</div>`;
    }
    else if(s.type==="video") {
      const ytId = (s.url||"").match(/(?:youtu\.be\/|[?&]v=)([a-zA-Z0-9_-]{11})/)?.[1];
      if(ytId) {
        html += `<div class="a-video"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>`;
        if(s.caption) html += `<div class="a-video-cap">${s.caption}</div>`;
      }
    }
    else if(s.type==="interaction") {
      const bid = "qi-"+s.id+"-"+idx;
      const choices = (s.choices||[]).map((c,i) => `
        <button class="a-quiz-opt" id="${bid}-c${i}" onclick="pickQuiz('${bid}',${i},'${s.id||idx}')">
          <span class="aql">${String.fromCharCode(65+i)}</span>
          <span class="aqt">${c.text}</span>
        </button>`).join("");
      html += `
        <div class="a-quiz">
          <div class="a-quiz-eye">ลองคิดก่อนอ่านต่อ</div>
          <div class="a-quiz-q">${s.question}</div>
          <div class="a-quiz-opts">${choices}</div>
          <div class="a-quiz-fb" id="${bid}-fb"></div>
        </div>`;
    }
    else if(s.type==="reflection") {
      const bid = "ri-"+s.id+"-"+idx;
      const opts = (s.options||[]).map((o,i) => `
        <button class="a-reflect-opt" id="${bid}-o${i}" onclick="pickReflect('${bid}',${i},'${s.id||idx}',${idx})">
          <span class="arl">${o.icon||"💭"}</span>
          <span class="art-rt">${o.text}</span>
        </button>`).join("");
      html += `
        <div class="a-reflect">
          <div class="a-reflect-eye">สะท้อนตัวเอง</div>
          <div class="a-reflect-q">${s.prompt}</div>
          <div class="a-reflect-opts">${opts}</div>
        </div>`;
    }
  });

  html += `
    </div>
    <div class="a-completion" id="art-completion">
      <div class="a-comp-eye">Puzzle Piece · ใจดี TU</div>
      <div class="a-comp-title">${b.completionTitle||"ได้ชิ้นส่วนใหม่แล้ว"}</div>
      <div class="a-comp-sub">${b.completionSub||""}</div>
      <div class="a-comp-tag-eye">ชิ้นส่วนของคุณ</div>
      <div class="a-comp-tag" id="art-comp-tag">—</div>
      <a href="care.html" style="display:flex;align-items:center;gap:10px;padding:13px 15px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:12px;text-decoration:none;color:inherit;margin-bottom:10px;text-align:left;">
        <span style="font-size:18px;flex-shrink:0;">🌿</span>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:500;color:rgba(255,255,255,0.9);margin-bottom:2px;">อยากลงมือทำ?</div>
          <div style="font-size:11px;font-weight:300;color:rgba(255,255,255,0.45);line-height:1.5;">ดูวิธีดูแลตัวเองที่เชื่อมกับสิ่งที่เพิ่งอ่าน</div>
        </div>
        <span style="color:rgba(255,255,255,0.3);font-size:14px;">→</span>
      </a>
      <button class="a-comp-btn" onclick="closeReader()">← กลับ</button>
    </div>`;

  document.getElementById("art-content").innerHTML = html;
}

function pickQuiz(bid, choiceIdx, sectionId) {
  const section = (currentArticle?.body?.sections||[]).find(s => s.id===sectionId);
  const container = document.getElementById(bid+"-c0")?.closest(".a-quiz-opts");
  if(!container) return;
  container.querySelectorAll(".a-quiz-opt").forEach((b,i) => {
    b.classList.remove("selected");
    b.querySelector(".aql").textContent = String.fromCharCode(65+i);
  });
  const sel = document.getElementById(bid+"-c"+choiceIdx);
  if(sel){ sel.classList.add("selected"); sel.querySelector(".aql").textContent = "✓"; }
  const fb = document.getElementById(bid+"-fb");
  if(fb && section?.choices?.[choiceIdx]){ fb.textContent = section.choices[choiceIdx].feedback; fb.classList.add("show"); }
}

function pickReflect(bid, optIdx, sectionId, sIdx) {
  const section = (currentArticle?.body?.sections||[]).find(s => s.id===sectionId) ||
                  currentArticle?.body?.sections?.[sIdx];
  const opts = document.querySelectorAll(`[id^="${bid}-o"]`);
  opts.forEach(o => o.classList.remove("selected"));
  const sel = document.getElementById(bid+"-o"+optIdx); if(sel) sel.classList.add("selected");
  reflectionResult = section?.insightMap?.[optIdx] || section?.options?.[optIdx]?.text || "";
  setTimeout(() => {
    const c = document.getElementById("art-completion");
    if(!c || c.style.display==="block") return;
    c.style.display = "block";
    document.getElementById("art-comp-tag").textContent = reflectionResult;
    document.getElementById("rpf").style.width = "100%";
    document.getElementById("rpct").textContent = "100%";
    setTimeout(() => c.scrollIntoView({behavior:"smooth",block:"start"}), 80);
  }, 380);
}

function renderFeedWithCollabs(articles) {
  const grid = document.getElementById("card-grid");
  grid.innerHTML = "";
  if(!articles.length && !allCollabs.length){
    document.getElementById("empty-state").style.display="flex"; return;
  }
  document.getElementById("empty-state").style.display="none";

  let feedItems = articles.map(function(a,i){ return {type:"article", data:a, pos:i}; });
  allCollabs.forEach(function(c){
    const pos = parseInt(c.position) || 999;
    feedItems.push({type:"collab", data:c, pos:pos - 0.5});
  });
  feedItems.sort(function(a,b){ return a.pos - b.pos; });

  feedItems.forEach(function(item, i) {
    if(item.type === "article") {
      const a = item.data;
      const card = document.createElement("div");
      card.className = "article-card";
      card.onclick = function(){ openReader(a); };
      card.innerHTML =
        '<div class="card-meta"><div class="card-tag">' + (a.tag||"จิตวิทยา") + '</div><div class="card-level">' + (a.level||"") + '</div></div>' +
        '<div class="card-title">' + (a.title||"") + '</div>' +
        '<div class="card-desc">' + (a.desc||"") + '</div>' +
        '<div class="card-footer"><div class="card-rt">⏱ ' + (a.readTime||"5 นาที") + '</div><div class="card-arr">→</div></div>';
      grid.appendChild(card);
      setTimeout(function(){ card.classList.add("visible"); }, i * 50);
    } else {
      const c = item.data;
      const articleCount = (c.content||[]).filter(function(x){ return x.type==="article"||!x.type; }).length;
      const videoCount   = (c.content||[]).filter(function(x){ return x.type==="video"; }).length;
      const pills = [];
      if(articleCount) pills.push("📝 " + articleCount + " บทความ");
      if(videoCount)   pills.push("▶ " + videoCount + " วิดีโอ");
      if(!pills.length) pills.push("เนื้อหาใหม่");
      const pillsHtml = pills.map(function(p){ return '<span class="collab-pill">' + p + '</span>'; }).join("");

      const banner = document.createElement("div");
      banner.className = "collab-banner";
      banner.onclick = function(){ openSeries(c); };
      banner.innerHTML =
        '<div class="collab-banner-inner">' +
          '<img class="collab-avatar" src="' + (c.photo_url||"") + '" onerror="this.style.background='rgba(255,255,255,0.08)'" />' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="collab-x">ใจดี TU ×</div>' +
            '<div class="collab-name">' + (c.name||"") + '</div>' +
            '<div class="collab-role">' + (c.role||"") + '</div>' +
            '<div class="collab-pills">' + pillsHtml + '</div>' +
          '</div>' +
          '<div class="collab-arr">→</div>' +
        '</div>';
      grid.appendChild(banner);
    }
  });
}


function openSeries(collab) {
  currentCollab = collab;
  document.getElementById("series-topbar-title").textContent = "ใจดี TU × " + (collab.name||"");

  const socials = [];
  if(collab.instagram) socials.push({icon:"📷", label:"Instagram", url:collab.instagram});
  if(collab.youtube)   socials.push({icon:"▶",  label:"YouTube",   url:collab.youtube});
  if(collab.facebook)  socials.push({icon:"📘", label:"Facebook",  url:collab.facebook});
  if(collab.website)   socials.push({icon:"🔗", label:"Website",   url:collab.website});

  const socialsHtml = socials.map(function(s){
    return '<a class="series-social" href="' + s.url + '" target="_blank">' + s.icon + ' ' + s.label + '</a>';
  }).join("");

  const content_items = collab.content || [];
  const itemsHtml = content_items.map(function(item) {
    const isVideo = item.type === "video";
    const icon = isVideo ? "▶" : "📝";
    const iconClass = isVideo ? "si-icon video" : "si-icon";
    const meta = isVideo
      ? "▶ วิดีโอ · " + (item.source||"YouTube")
      : "📖 " + (item.readTime||"5 นาที") + " · " + (item.tag||"จิตวิทยา");
    const itemData = encodeURIComponent(JSON.stringify(item));
    return '<div class="series-item" onclick="openSeriesItem(decodeAndOpen('' + itemData + ''))">' +
      '<div class="' + iconClass + '">' + icon + '</div>' +
      '<div class="si-body">' +
        '<div class="si-title">' + (item.title||"") + '</div>' +
        '<div class="si-meta">' + meta + '</div>' +
      '</div>' +
      '<div class="si-arr">→</div>' +
    '</div>';
  }).join("");

  const bioHtml = collab.bio ? '<div class="series-bio">' + collab.bio + '</div>' : "";
  const socialsWrap = socialsHtml ? '<div class="series-socials">' + socialsHtml + '</div>' : "";
  const emptyMsg = '<div style="color:var(--ink-soft);font-size:13px;padding:20px 0;">ยังไม่มีเนื้อหา — ทีมกำลังเตรียม 💛</div>';

  document.getElementById("series-body").innerHTML =
    '<div class="series-hero">' +
      '<div class="series-hero-x">ใจดี TU ×</div>' +
      '<div class="series-hero-row">' +
        '<img class="series-avatar" src="' + (collab.photo_url||"") + '" onerror="this.style.background='rgba(255,255,255,0.1)'"/>' +
        '<div>' +
          '<div class="series-name">' + (collab.name||"") + '</div>' +
          '<div class="series-role">' + (collab.role||"") + '</div>' +
        '</div>' +
      '</div>' +
      bioHtml + socialsWrap +
    '</div>' +
    '<div class="series-content">' +
      '<div class="series-section-eye">เนื้อหาทั้งหมด · ' + content_items.length + ' รายการ</div>' +
      (itemsHtml || emptyMsg) +
    '</div>';

  document.getElementById("series-page").classList.add("active");
  document.body.style.overflow = "hidden";
  document.getElementById("series-body").scrollTop = 0;
}

function decodeAndOpen(encoded) {
  try { return JSON.parse(decodeURIComponent(encoded)); } catch(e) { return {}; }
}


function openSeriesItem(item) {
  if(item.type === "video") {
    window.open(item.url, "_blank");
    return;
  }
  // article — build article object and open in reader
  let body = null;
  try { body = typeof item.body === "string" ? JSON.parse(item.body) : item.body; } catch {}
  if(body?.sections) {
    openReader({...item, body});
  } else {
    // No rich body — open URL if available
    if(item.url) window.open(item.url, "_blank");
  }
}

function closeSeries() {
  document.getElementById("series-page").classList.remove("active");
  document.body.style.overflow = "";
}

window.onload = () => { loadSettings(); load(); };
</script>
