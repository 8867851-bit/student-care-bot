<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>ใจดี TU — Puzzle Piece</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --cream:#FDFCF9;--dark:#1A1A1A;--mid:#555;--soft:#999;
      --border:#EEEBE4;--white:#fff;
      --gold:#F5A623;--gold-soft:#FFF5E0;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Sarabun',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;padding-bottom:60px;}

    .header{padding:48px 20px 24px;}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
    .headline{font-family:'Playfair Display',serif;font-size:30px;line-height:1.25;}
    .headline em{font-style:italic;color:var(--gold);}
    .sub{font-size:14px;color:var(--mid);line-height:1.7;margin-top:8px;}

    .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:12px;padding:0 16px;}

    .card{
      background:var(--white);border-radius:16px;overflow:hidden;
      border:1px solid var(--border);cursor:pointer;
      transition:transform 0.15s ease;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
    }
    .card:active{transform:scale(0.97);}

    .card-cover{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;}
    .card-cover-placeholder{
      width:100%;aspect-ratio:3/4;
      background:linear-gradient(135deg,#1A1A1A,#2A2A2A);
      display:flex;align-items:center;justify-content:center;font-size:32px;
    }
    .card-name{font-size:12px;font-weight:600;color:var(--dark);line-height:1.4;padding:10px 12px 12px;}

    /* PDF OVERLAY */
    .overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,0.97);z-index:100;flex-direction:column;}
    .overlay.active{display:flex;animation:fadeIn 0.2s ease both;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    .overlay-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;
    }
    .overlay-title{font-size:14px;font-weight:600;color:white;flex:1;margin-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .close-btn{background:rgba(255,255,255,0.1);border:none;border-radius:99px;padding:8px 16px;font-size:13px;font-family:'Sarabun',sans-serif;color:white;cursor:pointer;}
    .close-btn:active{background:rgba(255,255,255,0.2);}

    .pdf-frame{flex:1;width:100%;border:none;background:#111;}

    .empty-state{padding:60px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;}
    .empty-icon{font-size:48px;}
    .empty-title{font-family:'Playfair Display',serif;font-size:22px;}
    .empty-sub{font-size:14px;color:var(--soft);line-height:1.7;max-width:280px;}

    .loading-row{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:14px;padding:0 20px 24px;}
    .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg)}}

    .back-btn{background:none;border:none;color:var(--soft);font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;padding:16px 20px;display:block;}
  </style>
</head>
<body>

<div class="overlay" id="overlay-pdf">
  <div class="overlay-header">
    <div class="overlay-title" id="overlay-title"></div>
    <button class="close-btn" onclick="closePDF()">✕ ปิด</button>
  </div>
  <iframe class="pdf-frame" id="pdf-frame" src=""></iframe>
</div>

<div class="header">
  <div class="eyebrow">ใจดี TU · Puzzle Piece</div>
  <div class="headline" id="headline">จิตวิทยาที่<em>อ่านได้</em></div>
  <div class="sub" id="sub">กดอ่านได้เลย ไม่ต้อง download</div>
</div>

<div id="loading-row" class="loading-row">
  <div class="spinner"></div>
  <span>กำลังโหลด...</span>
</div>

<div class="grid" id="grid"></div>

<div id="empty-state" class="empty-state" style="display:none;">
  <div class="empty-icon">🧩</div>
  <div class="empty-title">กำลังสร้าง</div>
  <div class="empty-sub">ทีม Content กำลังเตรียมเนื้อหา ติดตามได้ผ่าน LINE 💛</div>
</div>

<button class="back-btn" onclick="window.history.back()">← กลับ</button>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyQFbcxgTyjwRrp-3vJb0MPMD8ZVAPnzZiGJFD68ojv3jQlUaEOadYoSPYua5052B9kWQ/exec";

// Cloudinary: auto-generate cover from page 1 of PDF
function getCover(pdfUrl) {
  if (!pdfUrl || !pdfUrl.includes("cloudinary.com")) return null;
  return pdfUrl
    .replace("/upload/", "/upload/pg_1,w_400,q_auto,f_jpg/")
    .replace(/\.pdf$/, "");
}

const MOCK = [
  {id:"P001", title:"ทำไมเราถึงรู้สึกแบบนี้", url:""},
  {id:"P002", title:"นอนไม่หลับ ต้องทำยังไง", url:""},
  {id:"P003", title:"ความเครียดและร่างกาย", url:""},
  {id:"P004", title:"เพื่อนคือใคร", url:""},
];

// Load site settings (editable wording from Sheet)
async function loadSettings() {
  try {
    const res = await fetch(API_URL + "?action=getSiteSettings");
    const d = await res.json();
    if (d.status === "OK" && d.settings) {
      if (d.settings.puzzle_headline)
        document.getElementById("headline").innerHTML =
          d.settings.puzzle_headline.replace(/\*(.+?)\*/g, '<em style="font-style:italic;color:#F5A623;">$1</em>');
      if (d.settings.puzzle_sub)
        document.getElementById("sub").innerText = d.settings.puzzle_sub;
    }
  } catch {} // silently fail — defaults stay
}

async function load() {
  let items;
  try {
    const res = await fetch(API_URL + "?action=getContent&world=puzzle");
    const d = await res.json();
    if (d.status==="OK" && d.content?.length) {
      items = d.content.filter(c => c.type==="pdf");
    } else throw new Error();
  } catch { items = MOCK; }

  document.getElementById("loading-row").style.display = "none";
  const grid = document.getElementById("grid");

  if (!items.length) {
    document.getElementById("empty-state").style.display = "flex";
    return;
  }

  items.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openPDF(p);

    const cover = getCover(p.url);
    card.innerHTML = cover
      ? `<img class="card-cover" src="${cover}" alt="${p.title}" onerror="this.outerHTML='<div class=\\'card-cover-placeholder\\'>🧩</div>'">`
      : `<div class="card-cover-placeholder">🧩</div>`;
    card.innerHTML += `<div class="card-name">${p.title||"ไม่มีชื่อ"}</div>`;
    grid.appendChild(card);
  });
}

function openPDF(p) {
  document.getElementById("overlay-title").innerText = p.title || "";
  const viewer = "https://docs.google.com/viewer?embedded=true&url=" + encodeURIComponent(p.url);
  document.getElementById("pdf-frame").src = viewer;
  document.getElementById("overlay-pdf").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closePDF() {
  document.getElementById("overlay-pdf").classList.remove("active");
  document.getElementById("pdf-frame").src = "";
  document.body.style.overflow = "";
}

window.onload = () => { loadSettings(); load(); };
</script>
</body>
</html>
