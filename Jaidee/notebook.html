<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>ใจดี TU — สมุดบันทึก</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;500;600&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream:     #FDFBF7;
      --cream-warm:#FFF8EE;
      --border:    #EDE9E0;
      --border-mid:#D8D3C8;
      --dark:      #1C1917;
      --mid:       #6B6560;
      --soft:      #A8A099;
      --gold:      #E8960C;
      --gold-soft: #FFF3DC;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: 'Noto Serif Thai', serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      /* Page enters from scale — set initial opacity for JS to animate */
      opacity: 0;
    }

    /* ── ENTRY ANIMATION ─────────────────────────────── */
    body.entered { opacity: 1; transition: opacity 0.28s ease; }

    /* ── BACK BAR ────────────────────────────────────── */
    .back-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--cream);
      border-bottom: 1px solid transparent;
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      transition: border-color 0.2s ease;
    }
    .back-bar.scrolled { border-bottom-color: var(--border); }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: none;
      border: none;
      font-family: 'Noto Serif Thai', serif;
      font-size: 13px;
      font-weight: 300;
      color: var(--soft);
      cursor: pointer;
      padding: 8px 0;
      transition: color 0.15s;
    }
    .back-btn:hover { color: var(--mid); }
    .back-arrow {
      width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .back-arrow svg { display: block; }

    /* ── PAGE CONTENT ────────────────────────────────── */
    .page {
      max-width: 620px;
      margin: 0 auto;
      padding: 28px 24px 80px;
    }

    /* ── HEADER ──────────────────────────────────────── */
    .nb-eyebrow {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 2px;
      color: var(--soft);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .nb-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--dark);
      line-height: 1.45;
      margin-bottom: 7px;
    }
    .nb-meta {
      font-size: 12px;
      font-weight: 300;
      color: var(--soft);
    }

    /* ── DIVIDER ─────────────────────────────────────── */
    .nb-divider {
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }

    /* ── BODY TEXT ───────────────────────────────────── */
    .nb-body {
      font-size: 15px;
      font-weight: 300;
      line-height: 2.1;
      color: var(--mid);
    }
    .nb-body + .nb-body { margin-top: 16px; }

    /* ── SECTION HEAD ────────────────────────────────── */
    .nb-section-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 36px 0 14px;
    }
    .nb-section-emoji { font-size: 16px; flex-shrink: 0; }
    .nb-section-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--dark);
      line-height: 1.4;
    }

    /* ── CALLOUT BLOCK ───────────────────────────────── */
    .nb-callout {
      border-left: 2px solid var(--border-mid);
      padding: 10px 0 10px 18px;
      margin: 16px 0;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.9;
      color: var(--mid);
    }
    .nb-callout-label {
      font-weight: 500;
      color: var(--dark);
      display: block;
      margin-bottom: 3px;
    }

    /* ── TABLE ───────────────────────────────────────── */
    .nb-table-wrap { margin: 16px 0 8px; overflow-x: auto; }
    .nb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .nb-table th {
      font-size: 10px;
      font-weight: 500;
      color: var(--soft);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-align: left;
      padding: 0 12px 10px 0;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .nb-table td {
      padding: 14px 12px 14px 0;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
      line-height: 1.75;
      color: var(--mid);
      font-weight: 300;
    }
    .nb-table td:first-child {
      font-weight: 400;
      color: var(--dark);
      white-space: nowrap;
      min-width: 80px;
    }
    .nb-table td:nth-child(2) { min-width: 120px; }
    .nb-table-sub {
      display: block;
      font-size: 11px;
      color: var(--soft);
      margin-top: 3px;
    }

    /* ── CLOSING ─────────────────────────────────────── */
    .nb-closing {
      font-size: 15px;
      font-weight: 300;
      line-height: 2.2;
      color: var(--mid);
      margin: 8px 0 28px;
    }

    /* ── RETURN ACTIONS ──────────────────────────────── */
    .return-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--soft);
      margin-bottom: 12px;
    }
    .return-actions { display: flex; flex-direction: column; gap: 8px; }
    .return-action {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: var(--cream-warm);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--dark);
      font-size: 14px;
      font-weight: 400;
      font-family: 'Noto Serif Thai', serif;
      transition: border-color 0.15s, background 0.15s;
    }
    .return-action:active { background: #FFF0D6; border-color: #F0D080; }
    .return-action-icon { font-size: 17px; flex-shrink: 0; width: 24px; text-align: center; }
    .return-arrow {
      margin-left: auto;
      font-size: 12px;
      color: var(--soft);
    }

    /* ── TRIAGE TABLE ────────────────────────────────── */
    .nb-triage-intro {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.9;
      color: var(--mid);
      margin-bottom: 20px;
    }
    .nb-triage-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .nb-triage-table th {
      font-size: 10px;
      font-weight: 500;
      color: var(--soft);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-align: left;
      padding: 0 0 10px;
      border-bottom: 1px solid var(--border);
    }
    .nb-triage-table th:not(:first-child) { padding-left: 14px; }
    .nb-triage-table td {
      padding: 16px 0;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
      line-height: 1.75;
      font-weight: 300;
      color: var(--mid);
    }
    .nb-triage-table td:not(:first-child) { padding-left: 14px; }
    .nb-triage-signal { font-weight: 500; color: var(--dark); }
    .nb-triage-detail {
      font-size: 12px;
      font-weight: 300;
      color: var(--soft);
      margin-top: 3px;
      line-height: 1.65;
    }
    .nb-level-normal {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #2D6A4F;
      background: #EBF6EF;
      border: 1px solid #B8DCCA;
      border-radius: 99px;
      padding: 2px 9px;
      margin-bottom: 6px;
    }
    .nb-level-consult {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #78500A;
      background: var(--gold-soft);
      border: 1px solid var(--gold-border);
      border-radius: 99px;
      padding: 2px 9px;
      margin-bottom: 6px;
    }
    .nb-level-clinical {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #8B2020;
      background: #FDEDED;
      border: 1px solid #F5BBBB;
      border-radius: 99px;
      padding: 2px 9px;
      margin-bottom: 6px;
    }
    /* ── INLINE TOOL LINK ────────────────────────────── */
    .tool-link {
      color: #2563EB;
      text-decoration: underline;
      text-decoration-color: rgba(37,99,235,0.35);
      text-underline-offset: 3px;
      cursor: pointer;
      font-weight: 400;
      white-space: nowrap;
      transition: text-decoration-color 0.15s;
    }
    .tool-link:hover { text-decoration-color: #2563EB; }

    /* ── TOOL POPUP ──────────────────────────────────── */
    .tool-popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(28,25,23,0.4);
      backdrop-filter: blur(2px);
      align-items: flex-end;
      justify-content: center;
    }
    .tool-popup-overlay.open { display: flex; }
    .tool-popup {
      background: var(--cream);
      border-radius: 24px 24px 0 0;
      padding: 20px 24px 40px;
      width: 100%;
      max-width: 480px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.1,0.64,1);
    }
    .tool-popup-overlay.open .tool-popup { transform: translateY(0); }
    .tool-popup-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .tool-popup-eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--soft);
      margin-bottom: 6px;
    }
    .tool-popup-title {
      font-family: 'Noto Serif Thai', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .tool-popup-desc {
      font-size: 14px;
      font-weight: 300;
      color: var(--mid);
      line-height: 1.8;
      margin-bottom: 20px;
    }
    .tool-popup-go {
      display: block;
      width: 100%;
      background: var(--dark);
      color: var(--cream);
      border: none;
      border-radius: 99px;
      padding: 14px 20px;
      font-family: 'Noto Serif Thai', serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .tool-popup-go:active { opacity: 0.8; }
    .tool-popup-close {
      display: block;
      width: 100%;
      background: none;
      border: none;
      font-family: 'Noto Serif Thai', serif;
      font-size: 13px;
      color: var(--soft);
      cursor: pointer;
      padding: 8px;
      text-align: center;
    }

    /* ── LOADING STATE ───────────────────────────────── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      color: var(--soft);
      font-size: 13px;
      font-weight: 300;
    }

    /* ── ATTRIBUTION TABLE ───────────────────────────── */
    .nb-attr-intro {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.9;
      color: var(--mid);
      margin-bottom: 16px;
    }
    .nb-attr-table {
      width: 100%;
      border-collapse: collapse;
      margin: 4px 0 0;
      font-size: 13px;
    }
    .nb-attr-table th {
      font-size: 10px;
      font-weight: 500;
      color: var(--soft);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-align: left;
      padding: 0 0 10px;
      border-bottom: 1px solid var(--border);
    }
    .nb-attr-table th:not(:first-child) { padding-left: 14px; }
    .nb-attr-table td {
      padding: 14px 0;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
      line-height: 1.75;
      font-weight: 300;
      color: var(--mid);
    }
    .nb-attr-table td:not(:first-child) { padding-left: 14px; }
    .nb-attr-situation {
      font-weight: 400;
      color: var(--dark);
      white-space: nowrap;
      min-width: 100px;
    }
    .nb-attr-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      color: var(--soft);
      background: var(--cream-warm);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px 9px;
      margin-bottom: 6px;
      white-space: nowrap;
    }
    .nb-attr-inner {
      font-size: 13px;
      font-weight: 300;
      line-height: 1.75;
      color: var(--mid);
    }

    /* ── ERROR STATE ─────────────────────────────────── */
    #error-state { display: none; }
  </style>
</head>
<body>

<div class="back-bar" id="back-bar">
  <button class="back-btn" id="back-btn" onclick="goBack()">
    <span class="back-arrow">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    กลับ
  </button>
</div>

<div class="page" id="nb-page">
  <div id="loading">กำลังโหลด...</div>
  <div id="nb-content" style="display:none;"></div>
  <div id="error-state">
    <p style="color:var(--soft);font-size:14px;font-weight:300;">ไม่พบเนื้อหาที่ต้องการ</p>
    <button onclick="goBack()" style="margin-top:16px;background:none;border:none;color:var(--mid);font-family:'Noto Serif Thai',serif;font-size:13px;cursor:pointer;text-decoration:underline;">← กลับ</button>
  </div>
</div>

<script>
// ── NAVIGATION STATE ─────────────────────────────────────────
// index.html writes these before navigating here
const _returnKey  = sessionStorage.getItem('nb_return_sit') || null;
const _returnScroll = parseInt(sessionStorage.getItem('nb_return_scroll') || '0', 10);

function goBack() {
  // Animate out
  document.body.style.transition = 'opacity 0.22s ease';
  document.body.style.opacity = '0';
  setTimeout(() => {
    if (_returnKey) {
      sessionStorage.setItem('jaidee_reopen_sit', _returnKey);
    }
    sessionStorage.setItem('nb_restore_scroll', String(_returnScroll));
    window.location.href = 'index.html';
  }, 220);
}

// ── SCROLL SHADOW ─────────────────────────────────────────────
window.addEventListener('scroll', () => {
  document.getElementById('back-bar').classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });

// ── INLINE TOOL LINK INJECTION ────────────────────────────────
function injectToolLinks(container, links) {
  // Only inject into text nodes inside .nb-body, .nb-callout, .nb-closing, td
  const selectors = '.nb-body, .nb-callout, .nb-closing, .nb-attr-inner, td';
  container.querySelectorAll(selectors).forEach(el => {
    links.forEach(({ phrase, toolId }) => {
      // Walk text nodes only — don't double-wrap
      walkTextNodes(el, phrase, toolId);
    });
  });
}

function walkTextNodes(el, phrase, toolId) {
  // Skip if already contains a tool-link for this phrase
  if (el.querySelector && el.querySelector('.tool-link')) {
    // Check if this exact phrase is already linked
    const existing = Array.from(el.querySelectorAll('.tool-link'));
    if (existing.some(e => e.textContent === phrase)) return;
  }
  const children = Array.from(el.childNodes);
  children.forEach(node => {
    if (node.nodeType === 3) { // text node
      const idx = node.textContent.indexOf(phrase);
      if (idx === -1) return;
      // Replace only first occurrence per text node
      const before = document.createTextNode(node.textContent.slice(0, idx));
      const link = document.createElement('span');
      link.className = 'tool-link';
      link.textContent = phrase;
      link.setAttribute('role', 'button');
      link.setAttribute('tabindex', '0');
      link.onclick = () => openToolPopup(toolId);
      link.onkeydown = (e) => { if (e.key === 'Enter') openToolPopup(toolId); };
      const after = document.createTextNode(node.textContent.slice(idx + phrase.length));
      const parent = node.parentNode;
      parent.insertBefore(before, node);
      parent.insertBefore(link, node);
      parent.insertBefore(after, node);
      parent.removeChild(node);
    } else if (node.nodeType === 1 && !node.classList.contains('tool-link')) {
      walkTextNodes(node, phrase, toolId);
    }
  });
}

// ── CONTENT RENDERER ──────────────────────────────────────────
function renderGuide(g) {
  document.title = 'ใจดี TU — ' + g.title;

  let html = '';

  // Header
  html += `
    <div class="nb-eyebrow">${g.category}</div>
    <div class="nb-title">${g.title}</div>
    <div class="nb-meta">ใช้เวลาอ่านประมาณ ${g.readTime}</div>
    <div class="nb-divider"></div>`;

  // Sections
  g.sections.forEach(sec => {
    if (sec.type === 'intro') {
      sec.body.split('\n\n').forEach(para => {
        html += `<p class="nb-body">${para}</p>`;
      });

    } else if (sec.type === 'section') {
      html += `<div class="nb-divider"></div>
        <div class="nb-section-head">
          <span class="nb-section-emoji" aria-hidden="true">${sec.emoji}</span>
          <span class="nb-section-label">${sec.heading}</span>
        </div>`;

      if (sec.body) {
        sec.body.split('\n\n').forEach(para => {
          html += `<p class="nb-body">${para}</p>`;
        });
      }

      if (sec.callouts) {
        sec.callouts.forEach(c => {
          html += `<div class="nb-callout">
            <span class="nb-callout-label">${c.label}</span>
            ${c.body}
          </div>`;
        });
      }

      if (sec.after) {
        sec.after.split('\n\n').forEach(para => {
          html += `<p class="nb-body" style="margin-top:16px;">${para}</p>`;
        });
      }

    } else if (sec.type === 'table') {
      html += `<div class="nb-divider"></div>
        <div class="nb-section-head">
          <span class="nb-section-emoji" aria-hidden="true">${sec.emoji}</span>
          <span class="nb-section-label">${sec.heading}</span>
        </div>
        <div class="nb-table-wrap">
          <table class="nb-table">
            <thead><tr>${sec.columns.map(c => `<th>${c}</th>`).join('')}</tr></thead>
            <tbody>`;
      sec.rows.forEach(row => {
        html += '<tr>';
        row.forEach((cell, i) => {
          if (i === 1 && cell.includes('\n')) {
            const parts = cell.split('\n');
            html += `<td>${parts[0]}<span class="nb-table-sub">${parts[1]}</span></td>`;
          } else {
            html += `<td>${cell}</td>`;
          }
        });
        html += '</tr>';
      });
      html += `</tbody></table></div>`;

    } else if (sec.type === 'triage') {
      const levelLabels = { normal: 'ธรรมชาติ', consult: 'ควรปรึกษา', clinical: 'ต้องการผู้เชี่ยวชาญ' };
      html += `<div class="nb-divider"></div>
        <div class="nb-section-head">
          <span class="nb-section-emoji" aria-hidden="true">${sec.emoji}</span>
          <span class="nb-section-label">${sec.heading}</span>
        </div>`;
      if (sec.intro) {
        html += `<p class="nb-triage-intro">${sec.intro}</p>`;
      }
      html += `<div class="nb-table-wrap"><table class="nb-triage-table">
        <thead><tr>
          <th>สัญญาณ</th>
          <th>สิ่งที่เกิดขึ้น</th>
          <th>แนวทางดูแลตัวเอง</th>
        </tr></thead>
        <tbody>`;
      sec.rows.forEach(row => {
        const levelClass = `nb-level-${row.level}`;
        html += `<tr>
          <td>
            <span class="nb-triage-signal">${row.signal}</span>
            <span class="nb-triage-detail">${row.detail}</span>
          </td>
          <td>${row.mechanism}</td>
          <td>
            <span class="${levelClass}">${levelLabels[row.level] || row.level}</span><br>
            ${row.action}
          </td>
        </tr>`;
      });
      html += `</tbody></table></div>`;

    } else if (sec.type === 'attribution') {
      html += `<div class="nb-divider"></div>
        <div class="nb-section-head">
          <span class="nb-section-emoji" aria-hidden="true">${sec.emoji}</span>
          <span class="nb-section-label">${sec.heading}</span>
        </div>`;
      if (sec.intro) {
        html += `<p class="nb-attr-intro">${sec.intro}</p>`;
      }
      html += `<div class="nb-table-wrap"><table class="nb-attr-table">
        <thead><tr>
          <th>สถานการณ์</th>
          <th>Attribution</th>
          <th>เสียงในหัว</th>
        </tr></thead>
        <tbody>`;
      sec.rows.forEach(row => {
        html += `<tr>
          <td class="nb-attr-situation">${row.situation}</td>
          <td><span class="nb-attr-tag">${row.interpretation}</span></td>
          <td class="nb-attr-inner">${row.inner}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
      if (sec.after) {
        sec.after.split('\n\n').forEach(para => {
          html += `<p class="nb-body" style="margin-top:20px;">${para}</p>`;
        });
      }

    } else if (sec.type === 'closing') {
      html += `<div class="nb-divider"></div>
        <p class="nb-closing">${sec.body.replace(/\n/g, '<br>')}</p>`;
    }
  });

  // Return actions
  if (g.returnActions && g.returnActions.length) {
    html += `<div class="nb-divider"></div>
      <div class="return-label">ลองเริ่มจากสิ่งนี้</div>
      <div class="return-actions">`;
    g.returnActions.forEach(a => {
      html += `<a class="return-action" href="${a.href}">
        <span class="return-action-icon" aria-hidden="true">${a.icon}</span>
        <span>${a.name}</span>
        <span class="return-arrow">→</span>
      </a>`;
    });
    html += `</div>`;
  }

  document.getElementById('loading').style.display = 'none';
  const content = document.getElementById('nb-content');
  content.innerHTML = html;
  content.style.display = 'block';

  // Inject inline tool links
  if (window.GUIDE_TOOL_LINKS && window.GUIDE_TOOL_LINKS.length) {
    injectToolLinks(content, window.GUIDE_TOOL_LINKS);
  }

  window.dispatchEvent(new Event('nb_content_ready'));
}

// ── GUIDE LOADER ───────────────────────────────────────────────
function loadGuide() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { showError(); return; }

  // Content is loaded via <script> tag pointing to guides/{id}.js
  // That script sets window.GUIDE_CONTENT, then we render it
  const script = document.createElement('script');
  script.src = 'guides/' + id + '.js';
  script.onload = () => {
    if (window.GUIDE_CONTENT) {
      renderGuide(window.GUIDE_CONTENT);
      // Small delay so content is in DOM before animating in
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.body.classList.add('entered');
        });
      });
    } else {
      showError();
    }
  };
  script.onerror = () => showError();
  document.head.appendChild(script);
}

function showError() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-state').style.display = 'block';
  document.body.classList.add('entered');
}

loadGuide();
</script>
<!-- ── TOOL POPUP OVERLAY ── -->
<div class="tool-popup-overlay" id="tool-popup-overlay" onclick="closeToolPopup(event)">
  <div class="tool-popup" onclick="event.stopPropagation()">
    <div class="tool-popup-handle"></div>
    <div class="tool-popup-eyebrow" id="tp-eyebrow"></div>
    <div class="tool-popup-title" id="tp-title"></div>
    <div class="tool-popup-desc" id="tp-desc"></div>
    <a class="tool-popup-go" id="tp-go" href="#">เปิดเครื่องมือนี้ →</a>
    <button class="tool-popup-close" onclick="dismissToolPopup()">อ่านต่อก่อน ←</button>
  </div>
</div>

<script>
// ── TOOL POPUP ────────────────────────────────────────────────
const TOOL_REGISTRY = {
  breathe:   { eyebrow:'หายใจ', title:'หายใจผ่อนคลาย', desc:'เทคนิคหายใจที่ช่วยส่งสัญญาณบอกระบบประสาทว่าปลอดภัยแล้ว รวมถึง Physiological Sigh และ 4-7-8', href:'alltools.html#breathe' },
  journal:   { eyebrow:'เขียน', title:'เขียนระบาย', desc:'พื้นที่ปลอดภัยสำหรับทิ้งความคิดและความรู้สึกออกมาก่อนจะล้นหัว', href:'alltools.html#journal' },
  reframe:   { eyebrow:'ความคิด', title:'คลายมือจากความคิด', desc:'แยก Fact ออกจาก Interpretation และปรับมุมมองที่กำลังบีบคุณอยู่', href:'alltools.html#reframe' },
  move:      { eyebrow:'เคลื่อนไหว', title:'ขยับร่างกาย', desc:'ปลดปล่อยพลังงานความเครียดที่ค้างอยู่ในระบบ เลือกตามระดับพลังงานที่มีได้เลย', href:'alltools.html#move' },
  rest:      { eyebrow:'พักใจ', title:'พักใจ · Self-Compassion', desc:'Body scan และการพูดกับตัวเองอย่างนุ่มนวล เหมาะกับคืนที่หนักเกินไป', href:'alltools.html#rest' },
  rain:      { eyebrow:'อยู่กับมัน', title:'RAIN — อยู่กับความรู้สึก', desc:'Recognize · Allow · Investigate · Nurture วิธีนั่งกับความรู้สึกยากๆ โดยไม่ต้องหนีมัน', href:'alltools.html#rain' },
  grounding: { eyebrow:'ลงดิน', title:'Grounding 5-4-3-2-1', desc:'ดึงสมองกลับมาอยู่กับปัจจุบันทันทีผ่านประสาทสัมผัสทั้งห้า', href:'alltools.html#grounding' },
  play:      { eyebrow:'โฟกัส', title:'แตะให้ตรงจังหวะ', desc:'ฝึกสมองให้กลับมาอยู่กับปัจจุบัน ไม่ต้องคิดอะไร แค่มองและแตะ', href:'alltools.html#play' },
  savor:     { eyebrow:'ซึมซับ', title:'บันทึกช่วงเวลาดีๆ', desc:'ฝึกสมองให้สังเกตเห็นสิ่งดีๆ เล็กๆ ที่มีอยู่รอบตัว แก้ Negativity Bias', href:'alltools.html#savor' },
  worry:     { eyebrow:'กังวล', title:'กล่องวางความกังวล', desc:'บรรจุความกังวลลงกล่องก่อนนอน ให้สมองได้วางมันลงชั่วคราว', href:'alltools.html#worry' },
  clarity:   { eyebrow:'ความชัดเจน', title:'Clarity — จัดการความคิดรก', desc:'เมื่อมีหลายสิ่งค้างในหัว เครื่องมือนี้ช่วยเรียงลำดับและหาจุดเริ่มต้น', href:'alltools.html#clarity' },
};

let _scrollBeforePopup = 0;

function openToolPopup(toolId) {
  const t = TOOL_REGISTRY[toolId];
  if (!t) return;
  _scrollBeforePopup = window.scrollY;
  document.getElementById('tp-eyebrow').textContent = t.eyebrow;
  document.getElementById('tp-title').textContent   = t.title;
  document.getElementById('tp-desc').textContent    = t.desc;
  const go = document.getElementById('tp-go');
  go.href = t.href;
  go.onclick = () => {
    // Save scroll position so user can return to reading
    sessionStorage.setItem('nb_tool_return_scroll', String(_scrollBeforePopup));
    sessionStorage.setItem('nb_tool_return_id', new URLSearchParams(location.search).get('id') || '');
  };
  document.getElementById('tool-popup-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function dismissToolPopup() {
  const overlay = document.getElementById('tool-popup-overlay');
  const popup = overlay.querySelector('.tool-popup');
  popup.style.transform = 'translateY(100%)';
  setTimeout(() => {
    overlay.classList.remove('open');
    popup.style.transform = '';
    document.body.style.overflow = '';
    // Restore scroll position
    window.scrollTo(0, _scrollBeforePopup);
  }, 280);
}

function closeToolPopup(e) {
  if (e.target === document.getElementById('tool-popup-overlay')) dismissToolPopup();
}

// ── RESTORE SCROLL after returning from tool ──────────────────
(function(){
  const returnId     = sessionStorage.getItem('nb_tool_return_id');
  const returnScroll = parseInt(sessionStorage.getItem('nb_tool_return_scroll') || '-1', 10);
  const currentId    = new URLSearchParams(location.search).get('id') || '';
  if (returnId === currentId && returnScroll >= 0) {
    sessionStorage.removeItem('nb_tool_return_scroll');
    sessionStorage.removeItem('nb_tool_return_id');
    // Restore after content renders
    window.addEventListener('nb_content_ready', () => {
      requestAnimationFrame(() => window.scrollTo(0, returnScroll));
    }, { once: true });
  }
})();
</script>
