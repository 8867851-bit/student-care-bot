<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>เรื่องที่หลายคนเคยเจอ — ใจดี TU</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream:#FDFBF7; --cream-warm:#FFF8EE; --cream-border:#EDE9E0;
      --gold:#E8960C; --gold-soft:#FFF3DC; --gold-border:#FFE0A0;
      --dark:#1C1917; --mid:#6B6560; --soft:#A8A099; --faint:#C4BDB7;
      --card:#FFFFFF; --card-border:#EDE9E0;
      --green:#3A7D44; --green-soft:#EEF6EF; --green-border:#C2DFC6;
      --blue:#2E5FA3; --blue-soft:#EEF3FB;
      --red:#DC2626; --red-soft:#FEF2F2; --red-border:#FECACA;
      --purple:#7C3AED; --purple-soft:#F5F3FF;
      --teal:#0D9488;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Mitr',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;padding-bottom:64px;overflow-x:hidden;}

    .back-btn{display:inline-flex;align-items:center;gap:6px;padding:44px 24px 0;font-size:13px;color:var(--soft);cursor:pointer;background:none;border:none;font-family:'Mitr',sans-serif;}
    .hero{padding:14px 24px 28px;}
    .hero-eyebrow{font-size:10px;font-weight:500;letter-spacing:2px;color:var(--green);text-transform:uppercase;margin-bottom:8px;}
    .hero-title{font-family:'Noto Serif Thai',serif;font-size:24px;font-weight:600;color:var(--dark);line-height:1.3;margin-bottom:8px;}
    .hero-sub{font-size:13px;font-weight:300;color:var(--soft);line-height:1.8;}

    /* ── SECTION LABELS ── */
    .sec-label{
      display:flex;align-items:center;gap:10px;
      padding:0 20px;margin:20px 0 12px;
    }
    .sec-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
    .sec-text{font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--mid);}
    .sec-line{flex:1;height:1px;background:var(--cream-border);}
    #shelf-container .sec-label:first-child .sec-line{display:none;}

    /* ── SHELF GRID ── */
    .shelf{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      padding:0 16px;
    }

    .shelf-card{
      background:var(--card);
      border:1.5px solid var(--card-border);
      border-radius:16px;
      padding:16px 10px 14px;
      display:flex;flex-direction:column;align-items:center;
      text-align:center;
      cursor:pointer;
      transition:transform 0.15s,border-color 0.15s,box-shadow 0.15s;
      min-height:90px;
      opacity:0;transform:translateY(8px);
    }
    .shelf-card.visible{
      opacity:1;transform:translateY(0);
      transition:opacity 0.3s ease,transform 0.3s ease,border-color 0.15s,box-shadow 0.15s;
    }
    .shelf-card:active{transform:scale(0.95);}
    .shelf-card.urgent{border-color:var(--red-border);background:var(--red-soft);}

    .sc-emoji{font-size:26px;margin-bottom:8px;display:block;line-height:1;}
    .sc-title{
      font-family:'Noto Serif Thai',serif;
      font-size:12px;font-weight:600;
      color:var(--dark);line-height:1.35;
      margin-bottom:5px;
    }
    .shelf-card.urgent .sc-title{color:var(--red);}
    .sc-sub{font-size:10px;font-weight:300;color:var(--soft);line-height:1.5;}


    /* ── PRESS ANIMATION ── */
    .shelf-card.pressing{
      transform:scale(0.96);
      border-color:var(--gold-border);
      box-shadow:0 0 0 3px rgba(232,150,12,0.2);
      transition:transform 0.08s ease,border-color 0.08s,box-shadow 0.08s;
    }

    /* ── CONTENT LAYERS — stagger fade-in ── */
    .sheet-layer{
      opacity:0;
      transform:translateY(7px);
      transition:opacity 0.25s ease, transform 0.25s ease;
    }
    .sheet-layer.in{opacity:1;transform:translateY(0);}

    /* ── SWIPE HANDLE visual cue ── */
    .sheet-handle{cursor:grab;}
    .sheet-handle:active{cursor:grabbing;}

    /* ── OVERLAY ── */
    #sit-overlay{
      display:none;position:fixed;inset:0;
      background:rgba(0,0,0,0);
      z-index:500;
      transition:background 0.3s;
      pointer-events:none;
    }
    #sit-overlay.open{
      display:flex;flex-direction:column;justify-content:flex-end;
      background:rgba(0,0,0,0.55);
      pointer-events:all;
      backdrop-filter:blur(2px);
    }

    /* ── MODAL SHEET ── */
    #sit-sheet{
      background:var(--cream);
      border-radius:24px 24px 0 0;
      max-height:88vh;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      transform:translateY(100%);
      transition:transform 0.35s cubic-bezier(0.34,1.05,0.64,1);
      padding-bottom:env(safe-area-inset-bottom,16px);
    }
    #sit-overlay.open #sit-sheet{transform:translateY(0);}

    .sheet-handle{
      width:36px;height:4px;background:var(--cream-border);
      border-radius:2px;margin:14px auto 0;
    }
    .sheet-close{
      position:absolute;top:14px;right:20px;
      background:none;border:none;
      font-size:18px;color:var(--faint);cursor:pointer;
      padding:6px;line-height:1;
    }

    /* ── SHEET CONTENT LAYERS ── */
    .sheet-body{padding:0 22px 4px;position:relative;}

    /* Layer 1 — Recognition */
    .sit-emoji-lg{font-size:38px;display:block;margin:16px 0 10px;}
    .sit-title-lg{
      font-family:'Noto Serif Thai',serif;
      font-size:24px;font-weight:600;
      color:var(--dark);line-height:1.25;margin-bottom:12px;
    }
    .sit-recog{
      font-size:13px;font-weight:400;color:var(--mid);
      line-height:1.85;
      padding:14px 16px;
      background:var(--cream-warm);
      border-radius:12px;
      margin-bottom:4px;
    }
    .sit-recog strong{font-weight:500;color:var(--dark);}

    .layer-divider{height:1px;background:var(--cream-border);margin:20px 0;}
    .layer-lbl{
      font-size:9px;font-weight:500;letter-spacing:2px;
      text-transform:uppercase;color:var(--faint);margin-bottom:12px;
    }

    /* Layer 2 — Tiny actions */
    .actions-list{display:flex;flex-direction:column;gap:7px;}
    .action-row{
      display:flex;align-items:center;gap:12px;
      padding:12px 14px;border-radius:12px;
      border:1px solid var(--cream-border);
      background:var(--card);
      text-decoration:none;
      transition:transform 0.15s;
    }
    .action-row:active{transform:scale(0.97);}
    .ar-icon{font-size:20px;flex-shrink:0;width:30px;text-align:center;}
    .ar-name{font-size:13px;font-weight:500;color:var(--dark);flex:1;}
    .ar-arrow{font-size:11px;color:var(--faint);}

    /* Layer 3 — Tool */
    .tool-btn{
      display:flex;align-items:center;gap:14px;
      padding:16px 18px;border-radius:16px;
      background:var(--dark);text-decoration:none;
      margin-bottom:8px;transition:transform 0.15s;
    }
    .tool-btn:active{transform:scale(0.98);}
    .tb-icon{font-size:26px;flex-shrink:0;}
    .tb-body{flex:1;}
    .tb-name{font-family:'Noto Serif Thai',serif;font-size:16px;font-weight:600;color:#FDFBF7;display:block;margin-bottom:3px;}
    .tb-desc{font-size:11px;font-weight:300;color:rgba(253,251,247,0.5);}
    .tb-arrow{font-size:14px;color:rgba(255,255,255,0.25);flex-shrink:0;}

    /* Layer 4 — Deeper */
    .deeper-note{
      font-size:12px;font-weight:300;color:var(--soft);
      line-height:1.75;margin-bottom:10px;
    }
    .deeper-link{
      display:flex;align-items:center;gap:12px;
      padding:12px 14px;border-radius:12px;
      border:1.5px solid var(--card-border);background:var(--card);
      text-decoration:none;margin-bottom:8px;transition:transform 0.15s;
    }
    .deeper-link:active{transform:scale(0.97);}
    .dl-icon{font-size:18px;flex-shrink:0;width:28px;text-align:center;}
    .dl-name{font-size:13px;font-weight:500;color:var(--dark);flex:1;}
    .dl-arrow{font-size:11px;color:var(--faint);}

    /* Layer 5 — Related */
    .related-note{font-size:11px;color:var(--faint);margin-bottom:10px;}
    .related-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
    .rpill{
      display:flex;align-items:center;gap:5px;
      padding:7px 12px;border-radius:50px;
      background:var(--card);border:1px solid var(--card-border);
      font-size:11px;font-weight:400;color:var(--mid);
      cursor:pointer;transition:transform 0.15s;
      text-decoration:none;
    }
    .rpill:active{transform:scale(0.95);}
  </style>
</head>

// ── PRESS ANIMATION ─────────────────────────────────────────
function pressCard(el, key) {
  el.classList.add('pressing');
  setTimeout(() => {
    el.classList.remove('pressing');
    openSheet(key);
  }, 140);
}

// ── STAGGER LAYERS after sheet opens ─────────────────────────
function staggerLayers() {
  document.querySelectorAll('.sheet-layer').forEach(layer => {
    const delay = parseInt(layer.dataset.delay || 0);
    setTimeout(() => layer.classList.add('in'), delay);
  });
}

// ── SWIPE DOWN TO CLOSE ──────────────────────────────────────
(function() {
  const sheet = document.getElementById('sit-sheet');
  let startY = 0, currentY = 0, isDragging = false;

  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop > 0) return; // only if at top
    startY = e.touches[0].clientY;
    isDragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  sheet.addEventListener('touchmove', e => {
    if (!isDragging) return;
    currentY = e.touches[0].clientY;
    const delta = currentY - startY;
    if (delta > 0) sheet.style.transform = `translateY(${delta}px)`;
  }, { passive: true });

  sheet.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;
    const delta = currentY - startY;
    sheet.style.transition = 'transform 0.3s cubic-bezier(0.34,1.05,0.64,1)';
    if (delta > 120) {
      closeSheet();
    } else {
      sheet.style.transform = 'translateY(0)';
    }
    startY = 0; currentY = 0;
  });
})();

// ═══ GROUP RENDERING ══════════════════════════════════════════
function buildShelf() {
  const groups = {};
  SITUATIONS.forEach(s => {
    if (!groups[s.group]) groups[s.group] = { color: s.groupColor, items: [] };
    groups[s.group].items.push(s);
  });

  let html = '';
  Object.entries(groups).forEach(([name, g]) => {
    html += `
      <div class="sec-label">
        <div class="sec-dot" style="background:${g.color}"></div>
        <div class="sec-text">${name}</div>
        <div class="sec-line"></div>
      </div>
      <div class="shelf">
        ${g.items.map(s => `
          <div class="shelf-card${s.urgent ? ' urgent' : ''}" onclick="pressCard(this,'${s.key}')">
            <span class="sc-emoji">${s.emoji}</span>
            <div class="sc-title">${s.title}</div>
          </div>
        `).join('')}
      </div>`;
  });

  document.getElementById('shelf-container').innerHTML = html;

  // Stagger card entrances
  document.querySelectorAll('.shelf-card').forEach((card, i) => {
    setTimeout(() => card.classList.add('visible'), 60 + i * 40);
  });
}

// ═══ SHEET RENDERING ══════════════════════════════════════════
function openSheet(key) {
  const s = SITUATIONS.find(x => x.key === key);
  if (!s) return;

  const actionsHtml = s.actions.map(a =>
    a.href
      ? `<a class="action-row" href="${a.href}">${a.icon ? `<span class="ar-icon">${a.icon}</span>` : ''}<span class="ar-name">${a.name}</span><span class="ar-arrow">→</span></a>`
      : `<div class="action-row" style="cursor:default;">${a.icon ? `<span class="ar-icon">${a.icon}</span>` : ''}<span class="ar-name">${a.name}</span></div>`
  ).join('');

  const toolsHtml = s.tools.map(t =>
    `<a class="tool-btn" href="${t.href}">
      <span class="tb-icon">${t.icon}</span>
      <span class="tb-body">
        <span class="tb-name">${t.name}</span>
        ${t.desc ? `<span class="tb-desc">${t.desc}</span>` : ''}
      </span>
      <span class="tb-arrow">→</span>
    </a>`
  ).join('');

  const deeperHtml = s.deeper.map(d =>
    `<a class="deeper-link" href="${d.href}">
      <span class="dl-icon">${d.icon}</span>
      <span class="dl-name">${d.name}</span>
      <span class="dl-arrow">→</span>
    </a>`
  ).join('');

  const relatedHtml = s.related
    .map(k => SITUATIONS.find(x => x.key === k))
    .filter(Boolean)
    .map(r => `<span class="rpill" onclick="switchSheet('${r.key}')"><span style="font-size:14px;">${r.emoji}</span>${r.title.replace('\n',' ')}</span>`)
    .join('');

  document.getElementById('sheet-body').innerHTML = `
    <div class="sheet-layer" data-delay="0">
      <span class="sit-emoji-lg">${s.emoji}</span>
      <div class="sit-title-lg">${s.title.replace('\n','<br>')}</div>
      <div class="sit-recog">${s.recognition}</div>
    </div>

    <div class="sheet-layer" data-delay="150">
      <div class="layer-divider"></div>
      <div class="actions-list">${actionsHtml}</div>
    </div>

    <div class="sheet-layer" data-delay="280">
      <div class="layer-divider"></div>
      ${toolsHtml}
    </div>

    <div class="sheet-layer" data-delay="400">
      <div class="layer-divider"></div>
      <div style="font-size:12px;font-weight:400;color:var(--soft);margin-bottom:10px;line-height:1.65;">${s.deeperNote}</div>
      ${deeperHtml}
    </div>

    <div class="sheet-layer" data-delay="550">
      <div class="layer-divider"></div>
      <div class="related-note">อาจใกล้เคียงกับ...</div>
      <div class="related-pills">${relatedHtml}</div>
      <div style="height:8px;"></div>
    </div>
  `;

  const ov = document.getElementById('sit-overlay');
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('sit-sheet').scrollTop = 0;
  document.getElementById('sit-sheet').style.transform = '';
  setTimeout(staggerLayers, 180); // after sheet finishes rising
}

function switchSheet(key) {
  // Swap sheet content without closing
  document.getElementById('sit-sheet').scrollTop = 0;
  openSheet(key);
}

function closeSheet() {
  document.getElementById('sit-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('sit-overlay')) closeSheet();
}

// ═══ DEEP LINK ════════════════════════════════════════════════
buildShelf();

const hash = window.location.hash.replace('#','');
if (hash && SITUATIONS.find(s => s.key === hash)) {
  setTimeout(() => openSheet(hash), 300);
}
</script>

  const actionsHtml = s.actions.map(a =>
    a.href
      ? `<a class="action-row" href="${a.href}">${a.icon ? `<span class="ar-icon">${a.icon}</span>` : ''}<span class="ar-name">${a.name}</span><span class="ar-arrow">→</span></a>`
      : `<div class="action-row" style="cursor:default;">${a.icon ? `<span class="ar-icon">${a.icon}</span>` : ''}<span class="ar-name">${a.name}</span></div>`
  ).join('');

  const toolsHtml = s.tools.map(t =>
    `<a class="tool-btn" href="${t.href}">
      <span class="tb-icon">${t.icon}</span>
      <span class="tb-body">
        <span class="tb-name">${t.name}</span>
        ${t.desc ? `<span class="tb-desc">${t.desc}</span>` : ''}
      </span>
      <span class="tb-arrow">→</span>
    </a>`
  ).join('');

  const deeperHtml = s.deeper.map(d =>
    `<a class="deeper-link" href="${d.href}">
      <span class="dl-icon">${d.icon}</span>
      <span class="dl-name">${d.name}</span>
      <span class="dl-arrow">→</span>
    </a>`
  ).join('');

  const relatedHtml = s.related
    .map(k => SITUATIONS.find(x => x.key === k))
    .filter(Boolean)
    .map(r => `<span class="rpill" onclick="switchSheet('${r.key}')"><span style="font-size:14px;">${r.emoji}</span>${r.title.replace('\n',' ')}</span>`)
    .join('');

  document.getElementById('sheet-body').innerHTML = `
    <div class="sheet-layer" data-delay="0">
      <span class="sit-emoji-lg">${s.emoji}</span>
      <div class="sit-title-lg">${s.title.replace('\n','<br>')}</div>
      <div class="sit-recog">${s.recognition}</div>
    </div>

    <div class="sheet-layer" data-delay="150">
      <div class="layer-divider"></div>
      <div class="actions-list">${actionsHtml}</div>
    </div>

    <div class="sheet-layer" data-delay="280">
      <div class="layer-divider"></div>
      ${toolsHtml}
    </div>

    <div class="sheet-layer" data-delay="400">
      <div class="layer-divider"></div>
      <div style="font-size:12px;font-weight:400;color:var(--soft);margin-bottom:10px;line-height:1.65;">${s.deeperNote}</div>
      ${deeperHtml}
    </div>

    <div class="sheet-layer" data-delay="550">
      <div class="layer-divider"></div>
      <div class="related-note">อาจใกล้เคียงกับ...</div>
      <div class="related-pills">${relatedHtml}</div>
      <div style="height:8px;"></div>
    </div>
  `;

  const ov = document.getElementById('sit-overlay');
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('sit-sheet').scrollTop = 0;
  document.getElementById('sit-sheet').style.transform = '';
  setTimeout(staggerLayers, 180); // after sheet finishes rising
}

function switchSheet(key) {
  // Swap sheet content without closing
  document.getElementById('sit-sheet').scrollTop = 0;
  openSheet(key);
}

function closeSheet() {
  document.getElementById('sit-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('sit-overlay')) closeSheet();
}

// ═══ DEEP LINK ════════════════════════════════════════════════
buildShelf();

const hash = window.location.hash.replace('#','');
if (hash && SITUATIONS.find(s => s.key === hash)) {
  setTimeout(() => openSheet(hash), 300);
}
</script>
</body>
</html>
