<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>ใจดี TU — ผู้คน </title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #FEF4F4;
      --surface: #FFFFFF;
      --surface2: #FDE8E8;
      --border: rgba(200,80,80,0.1);
      --border2: rgba(200,80,80,0.18);
      --text: #2A1215;
      --mid: #8A5055;
      --soft: #B07070;
      --faint: rgba(180,80,80,0.25);
      --rose: #C85050;
      --rose-tag: #FFF0F0;
      --rose-tag-border: #F0C0C0;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family:'Sarabun',sans-serif;
      background:var(--bg);
      background-image:
        radial-gradient(ellipse at 100% 0%, rgba(240,140,140,0.14) 0%, transparent 50%),
        radial-gradient(ellipse at 0% 100%, rgba(240,170,140,0.1) 0%, transparent 50%);
      color:var(--text);
      min-height:100vh;
      padding-bottom:60px;
    }

    /* HEADER */
    .page-header {
      padding:48px 24px 0;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .header-left { flex:1; }
    .header-eyebrow {
      font-size:11px;font-weight:700;letter-spacing:0.14em;
      color:var(--rose);text-transform:uppercase;
      margin-bottom:8px;opacity:0;
      animation:slideUp 0.5s ease 0.1s both;
    }
    .header-title {
      font-family:'Lora',serif;font-size:42px;
      color:var(--text);line-height:1.05;font-weight:400;
      opacity:0;animation:slideUp 0.55s ease 0.18s both;
    }
    .header-title em { font-style:italic;color:var(--rose); }
    .header-sub {
      font-size:13px;color:var(--mid);margin-top:8px;line-height:1.65;
      opacity:0;animation:slideUp 0.55s ease 0.26s both;
    }

    /* TU LOGO */
    .tu-logo {
      flex-shrink:0;opacity:0;animation:slideUp 0.5s ease 0.1s both;
      width:80px;display:flex;flex-direction:column;align-items:center;gap:3px;
    }
    .tu-logo img {
      width:80px;height:auto;
      /* the image is pink on white — mix-blend-mode makes white transparent */
      mix-blend-mode:multiply;
      filter:drop-shadow(0 1px 3px rgba(200,80,80,0.18));
    }

    /* SEARCH */
    .search-wrap {
      padding:18px 24px 0;
      opacity:0;animation:slideUp 0.5s ease 0.32s both;
    }
    .search-inner { position:relative;display:flex;align-items:center; }
    .search-icon { position:absolute;left:13px;font-size:14px;color:var(--soft);pointer-events:none; }
    .search-input {
      width:100%;background:var(--surface);border:1.5px solid var(--border2);
      border-radius:12px;padding:10px 36px 10px 36px;
      font-size:14px;font-family:'Sarabun',sans-serif;color:var(--text);
      transition:border-color 0.18s;
    }
    .search-input::placeholder { color:var(--soft); }
    .search-input:focus { outline:none;border-color:var(--rose); }
    .search-clear {
      position:absolute;right:12px;background:none;border:none;
      color:var(--soft);font-size:16px;cursor:pointer;padding:2px;display:none;
    }

    /* TABS */
    .tab-bar {
      padding:14px 24px 0;display:flex;gap:0;
      border-bottom:1px solid var(--border2);overflow-x:auto;scrollbar-width:none;
      opacity:0;animation:slideUp 0.5s ease 0.38s both;
    }
    .tab-bar::-webkit-scrollbar { display:none; }
    .tab-btn {
      flex-shrink:0;padding:8px 18px 12px;font-size:12px;font-weight:700;
      color:rgba(138,80,85,0.4);cursor:pointer;border:none;background:none;
      font-family:'Sarabun',sans-serif;border-bottom:2px solid transparent;
      margin-bottom:-1px;transition:all 0.18s;
    }
    .tab-btn.active { color:var(--rose);border-bottom-color:var(--rose); }

    /* COUNT */
    .count-line {
      padding:12px 24px 4px;display:flex;
      align-items:center;justify-content:space-between;
    }
    .count-num { font-size:11px;font-weight:700;color:var(--soft);letter-spacing:0.04em; }
    .ghost-num {
      font-family:'Syne',sans-serif;font-size:52px;font-weight:800;
      color:rgba(200,80,80,0.07);line-height:1;letter-spacing:-0.04em;pointer-events:none;
    }

    /* GRID */
    .people-grid {
      padding:4px 20px 0;
      display:grid;grid-template-columns:1fr 1fr;gap:12px;
    }

    /* CARD */
    .person-card {
      background:var(--surface);border-radius:14px;overflow:hidden;
      cursor:pointer;border:1px solid var(--border2);
      box-shadow:0 2px 10px rgba(180,60,60,0.06);
      transition:transform 0.18s ease;
      opacity:0;animation:cardIn 0.45s ease both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    .person-card:active { transform:scale(0.96); }
    .card-thumb {
      width:100%;aspect-ratio:4/3;
      background:linear-gradient(135deg,#FAD8D8,#F4C0B8);
      display:flex;align-items:center;justify-content:center;
      font-size:30px;position:relative;overflow:hidden;
    }
    .card-thumb img { width:100%;height:100%;object-fit:cover; }
    .card-thumb-overlay {
      position:absolute;inset:0;
      background:linear-gradient(to bottom,transparent 50%,rgba(42,18,21,0.2));
    }
    .play-btn {
      position:absolute;bottom:8px;right:8px;
      width:28px;height:28px;border-radius:50%;
      background:rgba(200,80,80,0.88);color:white;font-size:8px;
      display:flex;align-items:center;justify-content:center;
      transition:transform 0.15s;
    }
    .person-card:hover .play-btn { transform:scale(1.1); }
    .card-body { padding:10px 12px 12px; }
    .card-subject {
      font-size:10px;font-weight:700;letter-spacing:0.1em;
      text-transform:uppercase;color:var(--soft);margin-bottom:3px;
    }
    .card-name { font-family:'Lora',serif;font-size:14px;color:var(--text);font-weight:600;line-height:1.2; }
    .card-tag {
      display:inline-block;margin-top:6px;
      background:var(--rose-tag);border:1px solid var(--rose-tag-border);
      border-radius:99px;padding:2px 8px;font-size:9px;color:var(--rose);
      font-weight:700;letter-spacing:0.06em;
    }

    /* NOT FOUND */
    .not-found-box {
      display:none;margin:16px 20px 0;
      background:var(--surface);border:1.5px dashed var(--rose-tag-border);
      border-radius:14px;padding:20px 18px;text-align:center;
      animation:cardIn 0.3s ease both;
    }
    .not-found-box.visible { display:block; }
    .nf-icon { font-size:28px;margin-bottom:8px; }
    .nf-title { font-family:'Lora',serif;font-size:16px;color:var(--text);font-weight:600;margin-bottom:4px; }
    .nf-query { font-style:italic;color:var(--rose);font-weight:600; }
    .nf-sub { font-size:12px;color:var(--mid);line-height:1.6;margin-bottom:14px; }
    .request-form {
      display:flex;flex-direction:column;gap:10px;text-align:left;
      border-top:1px solid var(--border2);padding-top:14px;margin-top:4px;
    }
    .req-label { font-size:11px;font-weight:700;color:var(--mid);letter-spacing:0.04em; }
    .req-input {
      background:var(--bg);border:1.5px solid var(--border2);
      border-radius:10px;padding:10px 12px;
      font-size:13px;font-family:'Sarabun',sans-serif;color:var(--text);width:100%;
    }
    .req-input:focus { outline:none;border-color:var(--rose); }
    .req-input::placeholder { color:var(--soft); }
    .req-btn {
      background:var(--rose);border:none;border-radius:10px;
      padding:12px;font-size:13px;font-family:'Sarabun',sans-serif;
      font-weight:700;color:white;cursor:pointer;
      transition:opacity 0.18s;width:100%;
    }
    .req-btn:active { opacity:0.8; }
    .req-btn:disabled { opacity:0.5;cursor:not-allowed; }

    /* LOADING */
    .loading-state {
      padding:52px 24px;display:flex;flex-direction:column;
      align-items:center;gap:12px;color:var(--soft);font-size:13px;
    }
    .spinner {
      width:24px;height:24px;border:2px solid var(--border2);
      border-top-color:var(--rose);border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* TOAST */
    .toast {
      position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
      background:var(--rose);color:white;padding:10px 20px;
      border-radius:99px;font-size:13px;font-weight:700;
      white-space:nowrap;z-index:999;pointer-events:none;
      opacity:0;transition:opacity 0.25s;
    }
    .toast.show { opacity:1; }

    /* MODAL */
    .modal-overlay {
      display:none;position:fixed;inset:0;z-index:200;
      background:rgba(42,18,21,0.9);
      align-items:flex-end;justify-content:center;
    }
    .modal-overlay.open { display:flex;animation:fadeIn 0.2s ease both; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal-sheet {
      width:100%;max-width:540px;background:var(--surface);
      border-radius:20px 20px 0 0;border-top:1px solid var(--border2);
      overflow:hidden;animation:sheetUp 0.32s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes sheetUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .modal-handle {
      width:36px;height:3px;background:var(--faint);
      border-radius:99px;margin:12px auto 0;
    }
    .modal-video { width:100%;aspect-ratio:16/9;background:#111;margin-top:12px; }
    .modal-video iframe { width:100%;height:100%;border:none;display:block; }
    .modal-info { padding:16px 20px 4px; }
    .modal-year { font-size:10px;font-weight:700;letter-spacing:0.14em;color:var(--rose);text-transform:uppercase;margin-bottom:4px; }
    .modal-name { font-family:'Lora',serif;font-size:24px;font-weight:600;color:var(--text); }
    .modal-subject { font-size:13px;color:var(--mid);margin-top:3px; }
    .modal-close {
      display:block;width:calc(100% - 40px);margin:14px 20px 20px;
      padding:13px;background:var(--surface2);border:1px solid var(--border2);
      border-radius:10px;color:var(--mid);font-family:'Sarabun',sans-serif;
      font-size:13px;font-weight:600;cursor:pointer;
    }

    /* BACK */
    .back-row { padding:20px 24px 0; }
    .back-btn {
      background:none;border:none;color:var(--soft);
      font-family:'Sarabun',sans-serif;font-size:12px;cursor:pointer;padding:0;
    }

    @keyframes slideUp {
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="handleModalClick(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-video" id="modal-vid"></div>
    <div class="modal-info">
      <div class="modal-year" id="modal-year"></div>
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-subject" id="modal-subject"></div>
      <div id="modal-bio" style="font-size:12px;color:var(--mid);margin-top:6px;line-height:1.65;display:none;"></div>
      <div id="modal-tags" style="display:none;flex-wrap:wrap;gap:5px;margin-top:8px;"></div>
    </div>
    <button class="modal-close" onclick="closeModal()">ปิด</button>
  </div>
</div>

<!-- HEADER -->
<div class="page-header">
  <div class="header-left">
    <div class="header-eyebrow">ใจดี TU</div>
    <div class="header-title">รู้จัก<em> ผู้คน </em></div>
    <div class="header-sub"> "เราต่างมาจากร้อยพ่อพันเเม่ ภูมิหลัง การหล่อหลอม เเละ คติที่ต่างกัน" ไตร่ตรองก่อนเชื่อ (มีสิทธ์Collabกับ ชมรมหนังสังคม) </div>
  </div>
  <div class="tu-logo">
    <img src="school-logo.png" alt="โลโก้เตรียมอุดมศึกษา"/>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-inner">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search-input" type="text"
      placeholder="ค้นหาชื่อครู หรือวิชา..." oninput="handleSearch()"/>
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
</div>

<!-- TABS -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="filterGroup('all',this)">ทั้งหมด</button>
  <button class="tab-btn" onclick="filterGroup('m4',this)">ม.4</button>
  <button class="tab-btn" onclick="filterGroup('m5',this)">ม.5</button>
  <button class="tab-btn" onclick="filterGroup('m6',this)">ม.6</button>
  <button class="tab-btn" onclick="filterGroup('others',this)">อื่นๆ</button>
</div>

<!-- LOADING -->
<div class="loading-state" id="loading-state">
  <div class="spinner"></div>
  <span>กำลังโหลด</span>
</div>

<!-- COUNT -->
<div class="count-line" id="count-line" style="display:none">
  <span class="count-num" id="count-num"></span>
  <span class="ghost-num" id="ghost-num"></span>
</div>

<!-- GRID -->
<div class="people-grid" id="people-grid"></div>

<!-- NOT FOUND + REQUEST -->
<div class="not-found-box" id="not-found-box">
  <div class="nf-icon">🔍</div>
  <div class="nf-title">ไม่พบ "<span class="nf-query" id="nf-query"></span>"</div>
  <div class="nf-sub">อยากให้ทีมเพิ่มครูท่านนี้ไหม?<br>ส่งคำขอแล้วเราจะรีบดำเนินการ 💛</div>
  <div class="request-form">
    <div class="req-label">ชื่อครู / วิชา ที่ต้องการ</div>
    <input class="req-input" id="req-name" placeholder="เช่น ครูสมชาย / คณิตศาสตร์"/>
    <div class="req-label">หมายเหตุเพิ่มเติม (ไม่จำเป็น)</div>
    <input class="req-input" id="req-note" placeholder="เช่น ครูสอน ม.5 สายวิทย์"/>
    <button class="req-btn" id="req-btn" onclick="submitRequest()">ส่งคำขอ →</button>
  </div>
</div>

<div class="back-row">
  <button class="back-btn" onclick="window.history.back()">← กลับ</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyQFbcxgTyjwRrp-3vJb0MPMD8ZVAPnzZiGJFD68ojv3jQlUaEOadYoSPYua5052B9kWQ/exec";
const MOCK = [
  {id:"T001",name:"ครูสมชาย ใจดี",subject:"คณิตศาสตร์",year_group:"m4",thumbnail_url:"",youtube_url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ",active:true},
  {id:"T002",name:"ครูสุดา นภาลัย",subject:"ภาษาไทย",year_group:"m4",thumbnail_url:"",youtube_url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ",active:true},
  {id:"T003",name:"ครูวิชัย รุ่งเรือง",subject:"ฟิสิกส์",year_group:"m4",thumbnail_url:"",youtube_url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ",active:true},
  {id:"T004",name:"ครูมาลี ทองสุข",subject:"เคมี",year_group:"m5",thumbnail_url:"",youtube_url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ",active:true},
  {id:"T005",name:"ครูประยุทธ สกุลดี",subject:"ชีววิทยา",year_group:"m5",thumbnail_url:"",youtube_url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ",active:true},
  {id:"T006",name:"ครูอรุณ ศรีสว่าง",subject:"ภาษาอังกฤษ",year_group:"m6",thumbnail_url:"",youtube_url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ",active:true},
  {id:"T007",name:"ครูนภา เมฆขาว",subject:"สังคมศึกษา",year_group:"m6",thumbnail_url:"",youtube_url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ",active:true},
  {id:"T008",name:"ครูเกียรติ ดนตรีดี",subject:"ดนตรี",year_group:"others",thumbnail_url:"",youtube_url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ",active:true},
];
const GROUP_LABELS = {m4:"ม.4",m5:"ม.5",m6:"ม.6",others:"อื่นๆ"};
let allTeachers=[], currentGroup="all", currentQuery="";

function ytId(url){const m=url?.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null;}
function ytThumb(url){const id=ytId(url);return id?`https://img.youtube.com/vi/${id}/mqdefault.jpg`:null;}
function ytEmbed(url){const id=ytId(url);return id?`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`:null;}

function getVisible(){
  return allTeachers.filter(t=>{
    if(!t.active)return false;
    if(currentGroup!=="all"&&t.year_group!==currentGroup)return false;
    if(currentQuery){const q=currentQuery.toLowerCase();return t.name.toLowerCase().includes(q)||t.subject.toLowerCase().includes(q);}
    return true;
  });
}

function filterGroup(grp,btn){
  currentGroup=grp;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function handleSearch(){
  const val=document.getElementById('search-input').value;
  currentQuery=val;
  document.getElementById('search-clear').style.display=val?'block':'none';
  renderGrid();
}

function clearSearch(){
  document.getElementById('search-input').value='';
  currentQuery='';
  document.getElementById('search-clear').style.display='none';
  renderGrid();
}

function renderGrid(){
  const visible=getVisible();
  const grid=document.getElementById('people-grid');
  const nfBox=document.getElementById('not-found-box');
  const cl=document.getElementById('count-line');
  grid.innerHTML='';
  if(!visible.length){
    nfBox.classList.add('visible');
    document.getElementById('nf-query').textContent=currentQuery||'ครูท่านนี้';
    document.getElementById('req-name').value=currentQuery;
    cl.style.display='none';
  } else {
    nfBox.classList.remove('visible');
    cl.style.display='flex';
    document.getElementById('count-num').textContent=`${visible.length} คน`;
    document.getElementById('ghost-num').textContent=visible.length;
    visible.forEach((t,i)=>grid.appendChild(buildCard(t,i)));
  }
}

function buildCard(t,index){
  const card=document.createElement('div');
  card.className='person-card';
  card.style.animationDelay=`${index*0.055}s`;
  const thumb=t.thumbnail_url||ytThumb(t.youtube_url);
  card.innerHTML=`
    <div class="card-thumb">
      ${thumb?`<img src="${thumb}" alt="${t.name}" onerror="this.style.display='none'"/>`:`<span style="font-size:28px">👩‍🏫</span>`}
      <div class="card-thumb-overlay"></div>
      <div class="play-btn">▶</div>
    </div>
    <div class="card-body">
      <div class="card-subject">${t.subject}</div>
      <div class="card-name">${t.name}</div>
      <div class="card-tag">${GROUP_LABELS[t.year_group]||''}</div>
    </div>`;
  card.onclick=()=>openModal(t);
  return card;
}

function openModal(t){
  const embed=ytEmbed(t.youtube_url);
  if(!embed)return;
  document.getElementById('modal-vid').innerHTML=`<iframe src="${embed}" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
  document.getElementById('modal-name').textContent=t.name;
  document.getElementById('modal-subject').textContent=t.subject;
  document.getElementById('modal-year').textContent=GROUP_LABELS[t.year_group]||'';
  // bio
  const bioEl=document.getElementById('modal-bio');
  if(bioEl){bioEl.textContent=t.short_bio||'';bioEl.style.display=t.short_bio?'block':'none';}
  // tags
  const tagsEl=document.getElementById('modal-tags');
  if(tagsEl){
    if(t.tag){
      tagsEl.innerHTML=t.tag.split(',').map(tag=>
        `<span style="display:inline-block;background:var(--rose-tag);border:1px solid var(--rose-tag-border);border-radius:99px;padding:2px 9px;font-size:10px;font-weight:700;color:var(--rose);letter-spacing:0.06em;">${tag.trim()}</span>`
      ).join('');
      tagsEl.style.display='flex';
    } else {
      tagsEl.style.display='none';
      tagsEl.innerHTML='';
    }
  }
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal-vid').innerHTML='';
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}
function handleModalClick(e){if(e.target===document.getElementById('modal'))closeModal();}

async function submitRequest(){
  const name=document.getElementById('req-name').value.trim();
  const note=document.getElementById('req-note').value.trim();
  if(!name){showToast('กรุณาระบุชื่อครูหรือวิชา');return;}
  const btn=document.getElementById('req-btn');
  btn.disabled=true;btn.textContent='กำลังส่ง...';
  try{
    await fetch(API_URL+'?'+new URLSearchParams({action:'requestTeacher',teacher_name:name,note,query:currentQuery,timestamp:new Date().toISOString()}).toString());
  }catch(e){}
  btn.textContent='✓ ส่งแล้ว!';
  showToast('ส่งคำขอแล้ว ทีมจะรีบดำเนินการ 💛');
  setTimeout(()=>{btn.disabled=false;btn.textContent='ส่งคำขอ →';},3000);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

async function load(){
  let teachers;
  try{
    const res=await fetch(API_URL+'?action=getPeople');
    const d=await res.json();
    if(d.status==='OK'&&d.people?.length){teachers=d.people;}else throw new Error();
  }catch{teachers=MOCK;}
  allTeachers=teachers;
  document.getElementById('loading-state').style.display='none';
  document.getElementById('count-line').style.display='flex';
  renderGrid();
}

window.onload=load;
</script>
</body>
</html>
