<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Jaidee TU — yt channel</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;600;700&family=Satisfy&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:"Sarabun",sans-serif;background:#fff;color:#111;min-height:100vh;overflow-x:hidden;}

    /* PAGE SYSTEM */
    .page{position:fixed;inset:0;background:#fff;overflow-y:auto;
          transition:transform 0.38s cubic-bezier(0.4,0,0.2,1),opacity 0.3s ease;}
    .page.hidden-right{transform:translateX(100%);opacity:0;pointer-events:none;}
    .page.hidden-left {transform:translateX(-30%);opacity:0;pointer-events:none;}
    .page.visible{transform:translateX(0);opacity:1;}

    /* ── PAGE 1: LANDING ── */
    .channel-hero{width:100%;aspect-ratio:16/7;overflow:hidden;background:#1A0A2E;position:relative;}
    .channel-hero img{width:100%;height:100%;object-fit:cover;display:block;}
    .hero-fallback{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;
      font-family:"Noto Serif Thai",serif;
    }
    .hf-small{font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:4px;}
    .hf-big{font-size:42px;font-weight:700;color:#7C3AED;line-height:1;}
    .hf-italic{font-family:"Satisfy",cursive;font-size:16px;color:rgba(255,255,255,0.45);margin-top:8px;}

    .series-landing{padding:28px 20px 40px;}
    .series-landing-label{font-size:10px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:#999;text-align:center;margin-bottom:20px;}
    .series-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

    .series-box{cursor:pointer;text-align:center;}
    .series-box:active .series-frame{transform:scale(0.95);}
    .series-frame{
      width:100%;aspect-ratio:3/4;
      border:2px solid;
      border-image:linear-gradient(145deg,#E8C97A,#C9A84C,#F5E196,#C9A84C) 1;
      background:#fff;
      margin-bottom:8px;
      position:relative;
      overflow:hidden;
      transition:transform 0.15s;
    }
    /* gold shimmer border using box-shadow trick */
    .series-frame{
      border:none;
      box-shadow:0 0 0 2px #C9A84C, 0 0 0 3px rgba(245,225,150,0.4);
      border-radius:2px;
    }
    .series-frame img{width:100%;height:100%;object-fit:cover;display:block;}
    .series-frame-placeholder{
      width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      background:#FAFAF8;font-size:28px;opacity:0.3;
    }
    .series-num{font-family:"Satisfy",cursive;font-size:13px;color:#C9A84C;margin-bottom:3px;}
    .series-name-text{font-size:10px;color:#555;line-height:1.4;}

    /* ── PAGE 2: EPISODES GRID ── */
    .ep-header{
      display:flex;align-items:center;gap:12px;
      padding:14px 16px;
      border-bottom:1px solid #F0EDE8;
      position:sticky;top:0;background:#fff;z-index:10;
    }
    .ep-back{background:none;border:none;font-size:22px;cursor:pointer;color:#333;padding:4px;line-height:1;}
    .ep-header-info{flex:1;}
    .ep-header-series{font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#C9A84C;}
    .ep-header-title{font-family:"Noto Serif Thai",serif;font-size:15px;font-weight:600;color:#111;}

    .ep-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;padding:16px 12px 40px;}
    .ep-cell{padding:6px;}
    .ep-cell:active .ep-frame{transform:scale(0.94);}

    .ep-label{
      font-family:"Satisfy",cursive;font-size:16px;color:#F5C842;
      text-align:center;margin-bottom:4px;
      text-shadow:0 1px 3px rgba(0,0,0,0.15);
    }
    .ep-frame{
      width:100%;aspect-ratio:4/3;
      box-shadow:0 0 0 2px #C9A84C, 0 0 0 3px rgba(245,225,150,0.35);
      border-radius:2px;
      background:#F9F6F0;
      overflow:hidden;
      margin-bottom:6px;
      cursor:pointer;
      transition:transform 0.15s;
      position:relative;
    }
    .ep-frame img{width:100%;height:100%;object-fit:cover;display:block;}
    .ep-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0.25;}
    .ep-title{font-size:10px;color:#333;text-align:center;line-height:1.4;padding:0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  </style>
</head>
<body>

<!-- ══ PAGE 1: CHANNEL LANDING ══ -->
<div class="page visible" id="page-landing">

  <!-- Channel art — replace src with your Cloudinary URL -->
  <div class="channel-hero">
    <img src="PASTE_YOUR_CLOUDINARY_URL_HERE"
         onerror="this.style.display='none';document.getElementById('hfb').style.display='flex';"
         alt="Jaidee TU yt channel"/>
    <div class="hero-fallback" id="hfb" style="display:none;">
      <div class="hf-small">Jaidee TU</div>
      <div class="hf-big">yt channel</div>
      <div class="hf-italic">Introduction Time</div>
    </div>
  </div>

  <div class="series-landing">
    <div class="series-landing-label">เลือก series</div>
    <div class="series-row">

      <div class="series-box" onclick="openSeries(1)">
        <div class="series-frame">
          <!-- ใส่รูป cover ของแต่ละ series ได้ที่นี่ -->
          <div class="series-frame-placeholder">🔬</div>
        </div>
        <div class="series-num">Series 1</div>
        <div class="series-name-text">วิทยาศาสตร์ที่ไม่ได้สอนในห้อง</div>
      </div>

      <div class="series-box" onclick="openSeries(2)">
        <div class="series-frame">
          <div class="series-frame-placeholder">🚪</div>
        </div>
        <div class="series-num">Series 2</div>
        <div class="series-name-text">เข้าไปแล้วเป็นยังไง</div>
      </div>

      <div class="series-box" onclick="openSeries(3)">
        <div class="series-frame">
          <div class="series-frame-placeholder">🫂</div>
        </div>
        <div class="series-num">Series 3</div>
        <div class="series-name-text">คนจริง เรื่องจริง</div>
      </div>

    </div>
  </div>
</div>

<!-- ══ PAGE 2: EPISODE GRID ══ -->
<div class="page hidden-right" id="page-episodes">

  <div class="ep-header">
    <button class="ep-back" onclick="goBack()">‹</button>
    <div class="ep-header-info">
      <div class="ep-header-series" id="ep-series-num">SERIES 1</div>
      <div class="ep-header-title" id="ep-series-title">วิทยาศาสตร์ที่ไม่ได้สอนในห้อง</div>
    </div>
  </div>

  <div class="ep-grid" id="ep-grid"></div>

</div>

<script>
// ── SERIES DATA ──────────────────────────────────────────────
// ytUrl: ใส่ YouTube URL จริงเมื่อมีวิดีโอ
// thumb: ใส่ thumbnail URL จาก YouTube หรือ Cloudinary
// เพิ่ม episode ได้เรื่อยๆ — max 6 ต่อ series
const SERIES = {
  1: {
    num: "SERIES 1",
    title: "วิทยาศาสตร์ที่ไม่ได้สอนในห้อง",
    episodes: [
      { ep:1, title:"ทำไมสอบแล้วหัวว่าง ทั้งที่อ่านมาตลอด", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
      { ep:2, title:"นอน 6 กับ 8 ชั่วโมง ต่างกันยังไงในสมอง", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
      { ep:3, title:"หายใจออกยาว 6 วินาทีเปลี่ยนระบบประสาทได้จริงไหม", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
      { ep:4, title:"ทำไมการขอความช่วยเหลือถึงฉลาดกว่าการไม่ขอ", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
    ]
  },
  2: {
    num: "SERIES 2",
    title: "เข้าไปแล้วเป็นยังไง",
    episodes: [
      { ep:1, title:"เซสชัน PR จริงๆ เป็นยังไง — รุ่นพี่เล่าให้ฟัง", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
      { ep:2, title:"นักจิตวิทยาโรงเรียนทำอะไร — ไม่ใช่แค่คุยปัญหา", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
      { ep:3, title:"โทร 1323 ครั้งแรก — เขารับสายแล้วพูดอะไร", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
    ]
  },
  3: {
    num: "SERIES 3",
    title: "คนจริง เรื่องจริง",
    episodes: [
      { ep:1, title:"ฉันแอดวิศวะจุฬาฯ ตอนม.6 ฉันไปหานักจิตฯ", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
      { ep:2, title:"ครูแนะแนวเห็นนักเรียนยังไง — พูดตรงๆ", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
      { ep:3, title:"หมดไฟตอนม.5 — แล้วกลับมาได้ยังไง", thumb:"", ytUrl:"https://youtube.com/@JaideeTU" },
    ]
  }
};

// ── NAVIGATION ───────────────────────────────────────────────
function openSeries(n) {
  const s = SERIES[n];
  document.getElementById("ep-series-num").textContent   = s.num;
  document.getElementById("ep-series-title").textContent = s.title;
  buildGrid(s.episodes);

  document.getElementById("page-landing").className  = "page hidden-left";
  document.getElementById("page-episodes").className = "page visible";
  document.getElementById("page-episodes").scrollTop = 0;
}

function goBack() {
  document.getElementById("page-landing").className  = "page visible";
  document.getElementById("page-episodes").className = "page hidden-right";
}

// ── BUILD EPISODE GRID ───────────────────────────────────────
function buildGrid(episodes) {
  const grid = document.getElementById("ep-grid");
  grid.innerHTML = "";
  episodes.forEach(ep => {
    const cell = document.createElement("div");
    cell.className = "ep-cell";

    // YouTube thumbnail auto-fetch from video ID if available
    const ytId = ep.ytUrl && ep.ytUrl.includes("watch?v=")
      ? ep.ytUrl.split("watch?v=")[1].split("&")[0]
      : null;
    const thumbSrc = ep.thumb || (ytId ? "https://img.youtube.com/vi/"+ytId+"/mqdefault.jpg" : "");

    cell.innerHTML =
      "<div class=\"ep-label\">Ep. " + ep.ep + "</div>" +
      "<div class=\"ep-frame\" onclick=\"openYT(\'" + ep.ytUrl + "\')\">" +
        (thumbSrc
          ? "<img src=\"" + thumbSrc + "\" loading=\"lazy\" onerror=\"this.style.display=\'none\'\"/>"
          : "<div class=\"ep-placeholder\">▶</div>") +
      "</div>" +
      "<div class=\"ep-title\">" + ep.title + "</div>";

    grid.appendChild(cell);
  });
}

function openYT(url) {
  window.open(url, "_blank", "noopener");
}
</script>
</body>
</html>
