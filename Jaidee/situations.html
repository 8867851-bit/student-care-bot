<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>

  <title>ตอนนี้คุณอยากได้อะไร? — ใจดี TU</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --cream:#FDFBF7;--cream-warm:#FFF8EE;--cream-border:#EDE9E0;
      --gold:#C9A35A;--gold-soft:#F7F0E1;--gold-border:#E8DAC0;
      --dark:#1C1917;--mid:#6B6560;--soft:#A8A099;--faint:#C4BDB7;
      --card:#FFFFFF;--card-border:#EDE9E0;
      --green:#3A7D44;--green-soft:#EEF6EF;--green-border:#C2DFC6;
      --red:#DC2626;--red-soft:#FEF2F2;--red-border:#FECACA;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Mitr',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;padding-bottom:56px;overflow-x:hidden;}

    .back-btn{display:inline-flex;align-items:center;gap:6px;padding:44px 24px 0;font-size:13px;color:var(--soft);cursor:pointer;background:none;border:none;font-family:'Mitr',sans-serif;}

    .hero{padding:14px 24px 28px;}
    .hero-eyebrow{font-size:10px;font-weight:500;letter-spacing:2px;color:var(--green);text-transform:uppercase;margin-bottom:8px;}
    .hero-title{font-family:'Noto Serif Thai',serif;font-size:24px;font-weight:600;color:var(--dark);line-height:1.3;margin-bottom:6px;}
    .hero-sub{font-size:13px;font-weight:300;color:var(--soft);line-height:1.65;}

    /* ── TIER SECTIONS ── */
    .tier-section{padding:0 20px;margin-bottom:24px;}
    .tier-label{
      display:flex;align-items:center;gap:8px;margin-bottom:12px;
    }
    .tier-dot{width:5px;height:5px;border-radius:50%;background:var(--soft);flex-shrink:0;}
    .tier-text{font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft);}
    .tier-line{flex:1;height:1px;background:var(--cream-border);}
    #tiers-container .tier-section:first-child .tier-line{display:none;}

    /* ── PILLS — wrap layout ── */
    .tier-pills{display:flex;flex-wrap:wrap;gap:8px;}
    .sit-pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:11px 16px;border-radius:50px;
      background:var(--card);border:1.5px solid var(--card-border);
      cursor:pointer;font-family:'Mitr',sans-serif;
      transition:transform 0.15s;
    }
    .sit-pill:active{transform:scale(0.95);}
    .sit-pill.pressing{
      transform:scale(0.96);
      border-color:#E6C77A;
      box-shadow:0 0 0 3px rgba(87,143,98,0.14);
      transition:transform 0.08s ease,border-color 0.08s,box-shadow 0.08s;
    }
    /* Visited — warmer cream, like a bookmarked page, not a completed task */
    .sit-pill.touched{
      background:rgba(216,184,191,0.06);
      border-color:#D8B8BF;
      box-shadow:none;
      transition:border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    }
    .sit-pill.touched-last{
      background:rgba(216,184,191,0.10);
      border-color:#C7A6BA;
      box-shadow:none;
      transition:border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
    }
    .sit-emoji{font-size:15px;line-height:1;}
    .sit-label{font-size:12px;font-weight:400;color:var(--dark);}

    /* ── SIT-OVERLAY ── */
    #sit-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0);z-index:400;align-items:flex-end;justify-content:center;transition:background 0.3s;pointer-events:none;}
    #sit-overlay.sit-open{display:flex;pointer-events:all;background:rgba(0,0,0,0.52);}
    #sit-sheet{
      background:var(--cream);border-radius:24px 24px 0 0;
      width:100%;max-width:480px;
      transform:translateY(100%);
      transition:transform 0.35s cubic-bezier(0.34,1.05,0.64,1);
      padding-bottom:env(safe-area-inset-bottom,16px);
      max-height:85vh;overflow-y:auto;position:relative;
    }
    #sit-overlay.sit-open #sit-sheet{transform:translateY(0);}
    .sheet-handle{width:36px;height:4px;background:var(--cream-border);border-radius:2px;margin:14px auto 0;}
    .sheet-close-btn{position:absolute;top:14px;right:16px;background:none;border:none;font-size:16px;color:var(--faint);cursor:pointer;padding:6px;line-height:1;z-index:1;}
    #sit-sheet-content{padding:16px 20px 20px;}

    /* ── SHEET INNER ── */
    ._sl{opacity:0;transform:translateY(6px);transition:opacity 0.25s ease,transform 0.25s ease;}
    ._sl.in{opacity:1;transform:translateY(0);}

    /* tool + deeper cards */
    .s-action{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;background:var(--cream-warm);border:1px solid var(--cream-border);margin-bottom:7px;transition:transform 0.15s;}
    .s-action:active{transform:scale(0.97);}
    .s-action-primary{background:var(--dark);border-color:var(--dark);}
    .s-tool{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;background:var(--dark);text-decoration:none;margin-bottom:8px;transition:transform 0.15s;}
    .s-tool:active{transform:scale(0.98);}
    .s-deep{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;border:1.5px solid var(--card-border);background:var(--card);margin-bottom:8px;transition:transform 0.15s;}
    .s-deep:active{transform:scale(0.97);}
  </style>
<script data-goatcounter="https://jaideetu-countpillvisit.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>

<!-- P2-1: Situation Search -->
<div style="padding:10px 20px 4px;position:relative;">

    <span style="font-size:14px;color:var(--soft);">💭</span>
    <input id="sit-search" type="text" placeholder="มีอะไรอยู่ในใจไหม?" autocomplete="off"
      style="flex:1;border:none;outline:none;font-family:'Mitr',sans-serif;font-size:13px;background:transparent;color:var(--dark);"
      oninput="onSitSearch(this.value)" onfocus="document.getElementById('search-wrap').style.borderColor='var(--green)'" onblur="document.getElementById('search-wrap').style.borderColor='var(--cream-border)'"/>
    <button id="search-clear" onclick="clearSitSearch()" style="display:none;background:none;border:none;font-size:14px;color:var(--soft);cursor:pointer;padding:0;">✕</button>
  </div>
  <!-- Search results dropdown -->
  <div id="search-results" style="display:none;position:absolute;left:20px;right:20px;top:calc(100% - 4px);background:var(--card);border:1.5px solid var(--cream-border);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.1);z-index:50;overflow:hidden;max-height:320px;overflow-y:auto;"></div>
</div>

<div id="tiers-container"></div>

<!-- SIT OVERLAY -->
<div id="sit-overlay" onclick="handleSitOverlay(event)">

// ── SWIPE DOWN TO CLOSE sit-sheet ────────────────────────────
(function() {
  const sheet = document.getElementById('sit-sheet');
  let startY = 0, currentY = 0, dragging = false;
  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop > 0) return;
    startY = e.touches[0].clientY; dragging = true;
    sheet.style.transition = 'none';
  }, {passive:true});
  sheet.addEventListener('touchmove', e => {
    if (!dragging) return;
    const delta = e.touches[0].clientY - startY;
    if (delta > 0) { currentY = delta; sheet.style.transform = `translateY(${delta}px)`; }
  }, {passive:true});
  sheet.addEventListener('touchend', () => {
    if (!dragging) return; dragging = false;
    sheet.style.transition = 'transform 0.3s cubic-bezier(0.34,1.05,0.64,1)';
    if (currentY > 110) closeSitSheet();
    else sheet.style.transform = 'translateY(0)';
    startY = 0; currentY = 0;
  });
})();




function pressPill(btn, key) {
  // P0-2: "I don't know" → directly open What's This Feeling, no extra screen
  if (key === '__unsure__') {
    window.location.href = 'reflection.html';
    return;
  }

  // Anonymous tap counter — no user ID, no cookies, fire-and-forget.
  try {
    if (window.goatcounter && typeof window.goatcounter.count === 'function') {
      window.goatcounter.count({ path: 'pill-' + key, title: key, event: true });
    }
  } catch (e) {}

  if (!btn) { openSitSheet(key); return; }
  btn.classList.add('pressing');
  setTimeout(() => {
    btn.classList.remove('pressing');
    openSitSheet(key);
  }, 130);
}
function openSitSheet(key) {
  const d = SIT_DATA[key];
  if (!d) return;
  SESSION_OPENED.add(key); _lastOpenedKey = key; _currentSitKey = key;

  // P0-4: Track recent situations in localStorage
  try {
    const recent = JSON.parse(localStorage.getItem('jaidee_recent_sit') || '[]');
    const filtered = recent.filter(k => k !== key);
    filtered.unshift(key);
    localStorage.setItem('jaidee_recent_sit', JSON.stringify(filtered.slice(0, 3)));
  } catch(e) {}

  // ── Type A/B/C layout — situation sheet UX spec v1 ──
  const type = d.type || 'B';
  const group = d.group;
  const articleTool  = d.tools.find(t => t.href && t.href.indexOf('notebook.html') !== -1);
  const peerTool     = d.tools.find(t => t.href === 'peer.html');
  const primaryTool  = d.tools.find(t => t.primary && t !== articleTool && t !== peerTool)
                     || d.tools.find(t => t !== articleTool && t !== peerTool)
                     || d.tools[0];
  const restTools    = d.tools.filter(t => t !== articleTool && t !== primaryTool && !(type === 'C' && t === peerTool));

  function _toolCard(t) {
    const href = t.href && t.href !== '#' ? `href="${t.href}"` : 'href="#"';
    const onclick = t.onclick ? ` onclick="${t.onclick}"` : '';
    return `<a ${href}${onclick} style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;background:${t.primary?'var(--dark)':'var(--cream-warm)'};border:1px solid ${t.primary?'var(--dark)':'var(--cream-border)'};margin-bottom:8px;">
      <span style="font-size:18px;flex-shrink:0;width:28px;text-align:center;">${t.icon}</span>
      <span style="flex:1;">
        <span style="display:block;font-size:13px;font-weight:500;color:${t.primary?'#FDFBF7':'var(--dark)'};">${t.name}</span>
        <span style="display:block;font-size:11px;font-weight:300;color:${t.primary?'rgba(253,251,247,0.55)':'var(--soft)'};">${t.desc}</span>
      </span>
      <span style="font-size:12px;color:${t.primary?'rgba(255,255,255,0.3)':'var(--faint)'};">→</span>
    </a>`;
  }

  // The one large recommendation — "เริ่มตรงนี้" or "ลองแบบนี้ดูไหม"
  // Color system: dark card = primary action, gold = human support only, white/cream = everything else.
  // The label above it is a neutral caption — the dark card itself signals "do this".
  function _primaryCard(t, label) {
    if (!t) return '';
    const href = t.href && t.href !== '#' ? `href="${t.href}"` : 'href="#"';
    const onclick = t.onclick ? ` onclick="${t.onclick}"` : '';
    return `<div style="margin-bottom:16px;">
      <div style="font-family:'Mitr',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;padding-left:2px;">${label}</div>
      <a ${href}${onclick} style="display:flex;align-items:center;gap:16px;padding:20px;border-radius:18px;text-decoration:none;background:var(--dark);">
        <span style="font-size:26px;flex-shrink:0;">${t.icon}</span>
        <span style="flex:1;">
          <span style="display:block;font-size:16px;font-weight:600;color:#FDFBF7;margin-bottom:3px;line-height:1.4;">${t.name}</span>
          <span style="display:block;font-size:12px;font-weight:300;color:rgba(253,251,247,0.55);line-height:1.5;">${t.desc || ''}</span>
        </span>
        <span style="font-size:14px;color:rgba(255,255,255,0.3);flex-shrink:0;">→</span>
      </a>
    </div>`;
  }

  // Notebook-family atmosphere — neutral card, colored identity (icon/border/top-glow only)
  const GROUP_STYLES = {
    understand: { icon:'rgba(13,148,136,0.10)',  border:'rgba(13,148,136,0.35)',  glow:'rgba(13,148,136,0.045)'  },
    comfort:    { icon:'rgba(216,184,191,0.20)', border:'rgba(216,184,191,0.6)',  glow:'rgba(216,184,191,0.05)'  },
    grow:       { icon:'rgba(201,163,90,0.16)',  border:'rgba(201,163,90,0.4)',   glow:'rgba(201,163,90,0.045)'  },
    belong:     { icon:'rgba(127,163,135,0.16)', border:'rgba(127,163,135,0.4)',  glow:'rgba(127,163,135,0.045)' },
  };

  // Article (📖 notebook guide) — a white/cream card = "secondary action / other options"
  function _articleCard(t, label, big, group) {
    if (!t) return '';
    const pad = big ? '16px 18px' : '14px 16px';
    const iconSize = big ? '20px' : '17px';
    const gs = GROUP_STYLES[group] || { icon:'var(--cream-warm)', border:'#D8D0C6', glow:'transparent' };
    return `<div style="margin-bottom:16px;">
      <div style="font-family:'Mitr',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;padding-left:2px;">${label}</div>
      <a href="${t.href}" style="position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:14px;padding:${pad};border-radius:16px;text-decoration:none;background:var(--cream);border:1.5px dashed ${gs.border};">
        <div style="position:absolute;top:0;left:0;right:0;height:44px;background:linear-gradient(180deg, ${gs.glow}, transparent);pointer-events:none;"></div>
        <span style="position:relative;font-size:${iconSize};flex-shrink:0;width:32px;height:32px;border-radius:9px;background:${gs.icon};display:flex;align-items:center;justify-content:center;">📖</span>
        <span style="position:relative;flex:1;">
          <span style="display:block;font-size:13px;font-weight:500;color:var(--dark);line-height:1.45;margin-bottom:4px;">${t.name}</span>
          <span style="display:block;font-size:11px;font-weight:400;color:var(--soft);line-height:1.5;">${t.desc || ''}</span>
        </span>
        <span style="position:relative;font-size:12px;color:var(--faint);flex-shrink:0;margin-top:3px;">→</span>
      </a>
    </div>`;
  }

  // Type C — "อยากมีคนอยู่ด้วยไหม?" — always present for human-first situations
  function _peerCard() {
    return `<div style="margin-bottom:16px;">
      <div style="font-family:'Mitr',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;padding-left:2px;">อยากมีคนอยู่ด้วยไหม?</div>
      <a href="peer.html" style="display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;text-decoration:none;background:var(--gold-soft);border:1.5px solid var(--gold-border);">
        <span style="font-size:24px;flex-shrink:0;">💛</span>
        <span style="flex:1;">
          <span style="display:block;font-size:15px;font-weight:600;color:#5C3D00;margin-bottom:2px;">เพื่อนที่ปรึกษา</span>
          <span style="display:block;font-size:11px;font-weight:300;color:#8B6000;">มีคนพร้อมรับฟัง ไม่ตัดสิน</span>
        </span>
        <span style="font-size:14px;color:#8B6000;flex-shrink:0;">→</span>
      </a>
    </div>`;
  }

  function _divider(text) {
    return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0 12px;"><div style="flex:1;height:1px;background:var(--cream-border);"></div><div style="font-family:'Mitr',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.08em;color:var(--gold);text-transform:uppercase;white-space:nowrap;">${text}</div><div style="flex:1;height:1px;background:var(--cream-border);"></div></div>`;
  }

  const restHtml = restTools.length ? (_divider('ตัวเลือกอื่น') + restTools.map(_toolCard).join('')) : '';

  let toolsHtml;
  if (type === 'A') {
    // Regulation first: one primary tool, article (if any) de-emphasized below it
    toolsHtml = _primaryCard(primaryTool, 'เริ่มตรงนี้')
      + _articleCard(articleTool, 'เข้าใจสิ่งที่เกิดขึ้น', false, group)
      + restHtml;
  } else if (type === 'C') {
    // Human first: peer card always on top, then understanding, then a primary tool
    toolsHtml = _peerCard()
      + _articleCard(articleTool, 'เข้าใจสิ่งที่เกิดขึ้น', false, group)
      + _primaryCard(primaryTool, 'ลองแบบนี้ดูไหม')
      + restHtml;
  } else {
    // Type B — understanding first: article large/primary, then a primary tool
    toolsHtml = articleTool
      ? (_articleCard(articleTool, 'เริ่มตรงนี้', true, group) + _primaryCard(primaryTool, 'ลองแบบนี้ดูไหม') + restHtml)
      : (_primaryCard(primaryTool, 'เริ่มตรงนี้') + restHtml);
  }

  // Talk nudge — original style → talk_who.html
  const talkHtml = d.talk ? `
    <div style="margin-top:36px;padding-top:22px;border-top:1px solid var(--cream-border);">
      <a href="talk_who.html" style="display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;text-decoration:none;background:var(--cream-warm);border:1.5px solid var(--cream-border);">
        <span style="font-size:22px;flex-shrink:0;">💭</span>
        <span style="flex:1;">
          <span style="display:block;font-size:13px;font-weight:400;color:var(--mid);line-height:1.7;">${d.talk}</span>
          <span style="display:block;font-size:11px;font-weight:300;color:var(--soft);margin-top:3px;">คุยกับคนจริงๆ →</span>
        </span>
        <span style="font-size:15px;color:var(--faint);flex-shrink:0;">›</span>
      </a>
    </div>` : '';

  // P1-2: Emotional breadcrumbs — show adjacent situations visited this session
  const visited = [...SESSION_OPENED].filter(k => k !== key && k !== '__unsure__' && SIT_DATA_COMBINED[k]);
  const breadcrumbsHtml = visited.length ? `
    <div style="margin-top:20px;padding:14px 16px;background:var(--cream-warm);border:1px solid var(--cream-border);border-radius:14px;">
      <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:var(--soft);margin-bottom:10px;">วันนี้คุณเคยดู</div>
      ${visited.slice(-3).map(k => {
        const s = SIT_DATA_COMBINED[k];
        return `<button onclick="closeSitSheet();setTimeout(()=>pressPill(null,'${k}'),400)" style="display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;font-family:'Mitr',sans-serif;padding:4px 0;cursor:pointer;text-align:left;">
          <span style="font-size:15px;">${s.emoji}</span>
          <span style="font-size:12px;font-weight:400;color:var(--mid);">${s.title}</span>
          <span style="font-size:10px;color:var(--green);margin-left:auto;">✓</span>
        </button>`;
      }).join('')}
    </div>` : '';

  document.getElementById('sit-sheet-content').innerHTML = `
    <div class="_sl" style="opacity:0;transform:translateY(6px);transition:opacity 0.25s ease,transform 0.25s ease;">
      <div style="margin-bottom:14px;">
        <div style="font-size:28px;line-height:1;margin-bottom:8px;">${d.emoji}</div>
        <div style="font-family:'Noto Serif Thai',serif;font-size:20px;font-weight:600;color:var(--dark);">${d.title}</div>
      </div>
      <div style="font-size:14px;font-weight:300;color:var(--mid);line-height:1.8;max-width:34ch;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--cream-border);">${d.note}</div>
      ${toolsHtml}
      ${breadcrumbsHtml}
      ${talkHtml}
    </div>`;

  requestAnimationFrame(() => {
    document.querySelectorAll('#sit-sheet-content ._sl').forEach(el => {
      el.style.opacity = '1'; el.style.transform = 'translateY(0)';
    });
  });

  const ov = document.getElementById('sit-overlay');
  ov.style.display = 'flex';
  ov.style.pointerEvents = 'all';
  requestAnimationFrame(() => {
    ov.style.background = 'rgba(0,0,0,0.52)';
    document.getElementById('sit-sheet').style.transform = 'translateY(0)';
  });
  document.body.style.overflow = 'hidden';
}

function closeSitSheet() {
  const ov = document.getElementById('sit-overlay');
  ov.style.background = 'rgba(0,0,0,0)';
  _currentSitKey = null;
  document.getElementById('sit-sheet').style.transform = 'translateY(100%)';
  setTimeout(() => {
    ov.style.display = 'none';
    ov.style.pointerEvents = 'none';
    document.body.style.overflow = '';
    _updatePillStates();
    setTimeout(() => {
      const t = document.querySelector('.tier-pills .sit-pill.touched-last');
      if (t) t.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
    }, 200);
  }, 360);
}

function handleSitOverlay(e) {
  if (e.target === document.getElementById('sit-overlay')) closeSitSheet();
}

function onSitSearch(val) {
  const q = val.trim();
  const clear = document.getElementById('search-clear');
  const results = document.getElementById('search-results');
  const tiers = document.getElementById('tiers-container');

  clear.style.display = q ? 'block' : 'none';

  if (!q) {
    results.style.display = 'none';
    tiers.style.display = '';
    return;
  }

  tiers.style.display = 'none';

  // Search: direct key match, alias match, title/label substring
  const hits = new Map(); // key → score

  // 1. Alias exact match
  Object.entries(SEARCH_ALIASES).forEach(([alias, keys]) => {
    if (alias.includes(q) || q.includes(alias.replace(/ๆ/g,''))) {
      keys.forEach(k => hits.set(k, (hits.get(k)||0) + 3));
    }
  });

  // 2. Pill label substring match across all tiers
  TIERS.forEach(tier => {
    tier.pills.forEach(p => {
      if (p.key === '__unsure__') return;
      if (p.label.includes(q)) hits.set(p.key, (hits.get(p.key)||0) + 2);
    });
  });

  // 3. SIT_DATA title match
  Object.entries(SIT_DATA_COMBINED).forEach(([k, d]) => {
    if (d.title && d.title.includes(q)) hits.set(k, (hits.get(k)||0) + 2);
    if (d.note && d.note.includes(q)) hits.set(k, (hits.get(k)||0) + 1);
  });

  const sorted = [...hits.entries()]
    .sort((a,b) => b[1]-a[1])
    .map(([k]) => k)
    .filter(k => SIT_DATA_COMBINED[k])
    .slice(0, 8);

  if (!sorted.length) {
    results.innerHTML = `<div style="padding:16px 18px;font-size:13px;color:var(--soft);text-align:center;">ไม่พบตรงๆ — ลองดูความรู้สึกใกล้เคียงด้านล่าง</div>`;
    results.style.display = 'block';
    tiers.style.display = '';
    return;
  }

  results.innerHTML = sorted.map(k => {
    const d = SIT_DATA_COMBINED[k];
    return `<button onclick="clearSitSearch();pressPill(null,'${k}')"
      style="display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;background:none;border:none;border-bottom:1px solid var(--cream-border);font-family:'Mitr',sans-serif;cursor:pointer;text-align:left;transition:background 0.12s;"
      onmouseenter="this.style.background='var(--cream-warm)'" onmouseleave="this.style.background='none'"
      ontouchstart="this.style.background='var(--cream-warm)'" ontouchend="this.style.background='none'">
      <span style="font-size:20px;flex-shrink:0;">${d.emoji}</span>
      <span style="flex:1;">
        <span style="display:block;font-size:13px;font-weight:500;color:var(--dark);">${d.title}</span>
      </span>
      <span style="font-size:12px;color:var(--faint);">→</span>
    </button>`;
  }).join('');
  results.style.display = 'block';
}

function clearSitSearch() {
  const inp = document.getElementById('sit-search');
  inp.value = '';
  onSitSearch('');
  inp.focus();
}
const SESSION_OPENED = new Set();
let _lastOpenedKey = null, _currentSitKey = null;
function _updatePillStates(){
  document.querySelectorAll('.tier-pills .sit-pill[onclick]').forEach(b=>{
    const m=b.getAttribute('onclick').match(/'([^']+)'\)/);
    if(!m) return; const k=m[1];
    if(SESSION_OPENED.has(k)){ b.classList.remove('touched','touched-last'); b.classList.add(k===_lastOpenedKey?'touched-last':'touched'); }
  });
}

  const container = document.getElementById('tiers-container');

  // P0-4: Show recent situations from localStorage at the top

  try {
    const recent = JSON.parse(localStorage.getItem('jaidee_recent_sit') || '[]')
      .filter(k => k !== '__unsure__' && SIT_DATA[k]);
    if (recent.length) {
      const pills = recent.map(k => {
        const s = SIT_DATA[k];
        const touched = SESSION_OPENED.has(k);
        const cls = touched ? (k === _lastOpenedKey ? ' touched-last' : ' touched') : '';
        return `<button class="sit-pill${cls}" onclick="pressPill(this,'${k}')">
          <span class="sit-emoji">${s.emoji}</span>
          <span class="sit-label">${s.title}</span>
        </button>`;
      }).join('');
      recentSection = `<div class="tier-section">
        <div class="tier-label">
          <div class="tier-dot" style="background:var(--gold);"></div>
          <div class="tier-text" style="color:var(--gold);">ครั้งก่อนคุณดู</div>
          <div class="tier-line"></div>
        </div>
        <div class="tier-pills">${pills}</div>
      </div>`;
    }
  } catch(e) {}

  container.innerHTML = recentSection + TIERS.map((tier, ti) => `
    <div class="tier-section">
      <div class="tier-label">
        ${ti === 0 ? '' : '<div class="tier-dot"></div>'}
        <div class="tier-text"${ti === 0 ? ' style="font-size:15px;font-weight:600;letter-spacing:0.3px;text-transform:none;color:var(--dark);"' : ''}>${tier.label}</div>
        <div class="tier-line"></div>
      </div>
      <div class="tier-pills">
        ${tier.pills.map(p => {
          const isUnsure = p.key === '__unsure__';
          const base = isUnsure
            ? `style="background:var(--gold-soft);border-color:var(--gold-border);"`
            : '';
          return `
          <button class="sit-pill${SESSION_OPENED.has(p.key)?(p.key===_lastOpenedKey?' touched-last':' touched'):''}" onclick="pressPill(this,'${p.key}')" ${base}>
            <span class="sit-emoji">${p.emoji}</span>
            <span class="sit-label"${isUnsure ? ' style="color:#7A5C00;font-weight:500;"' : ''}>${p.label}</span>
          </button>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

renderAllTiers();

// ── RETURN-TO-CARD: reopen the same situation sheet after visiting a tool ──
function _reopenSit(){ try{ const k=sessionStorage.getItem('jaidee_reopen_sit'); if(k){ sessionStorage.removeItem('jaidee_reopen_sit'); if(SIT_DATA[k]) openSitSheet(k); } }catch(e){} }
document.addEventListener('click', function(e){
  const a = e.target.closest && e.target.closest('a[href]');
  if(!a) return; const h=a.getAttribute('href');
  if(!h || h==='#' || h.indexOf('javascript')===0) return;
  if(_currentSitKey){ try{ sessionStorage.setItem('jaidee_reopen_sit', _currentSitKey); }catch(e){} }
}, true);
window.addEventListener('pageshow', function(e){ if(e.persisted) _reopenSit(); });
_reopenSit();

const _hash = window.location.hash.replace('#','');
if (_hash && SIT_DATA[_hash]) setTimeout(() => pressPill(null, _hash), 300);

</script>
</body>
</html>
