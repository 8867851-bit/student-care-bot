<head>
  <meta charset="UTF-8"/>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --cream:#FDFBF7;--cream-warm:#FFF8EE;--cream-border:#EDE9E0;
      --gold:#E8960C;--gold-soft:#FFF3DC;--gold-border:#FFE0A0;
      --dark:#1C1917;--mid:#6B6560;--soft:#A8A099;--faint:#C4BDB7;
      --card:#FFFFFF;--card-border:#EDE9E0;
      --green:#3A7D44;--green-soft:#EEF6EF;--green-border:#C2DFC6;
      --red:#DC2626;--red-soft:#FEF2F2;--red-border:#FECACA;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Mitr',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;padding-bottom:56px;overflow-x:hidden;}

    .back-btn{display:inline-flex;align-items:center;gap:6px;padding:44px 24px 0;font-size:13px;color:var(--soft);cursor:pointer;background:none;border:none;font-family:'Mitr',sans-serif;}

    .hero{padding:14px 24px 28px;}
    .hero-eyebrow{font-size:10px;font-weight:500;letter-spacing:2px;color:var(--green);text-transform:uppercase;margin-bottom:8px;}
    .hero-title{font-family:'Noto Serif Thai',serif;font-size:24px;font-weight:600;color:var(--dark);line-height:1.3;margin-bottom:6px;}
    .hero-sub{font-size:13px;font-weight:300;color:var(--soft);line-height:1.65;}

    /* ── TIER SECTIONS ── */
    .tier-section{padding:0 20px;margin-bottom:24px;}
    .tier-label{
      display:flex;align-items:center;gap:8px;margin-bottom:12px;
    }
    .tier-dot{width:5px;height:5px;border-radius:50%;background:var(--soft);flex-shrink:0;}
    .tier-text{font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft);}
    .tier-line{flex:1;height:1px;background:var(--cream-border);}
    #tiers-container .tier-section:first-child .tier-line{display:none;}

    /* ── PILLS — wrap layout ── */
    .tier-pills{display:flex;flex-wrap:wrap;gap:8px;}
    .sit-pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:9px 14px;border-radius:50px;
      background:var(--card);border:1.5px solid var(--card-border);
      cursor:pointer;font-family:'Mitr',sans-serif;
      transition:transform 0.15s;
    }
    .sit-pill:active{transform:scale(0.95);}
    .sit-pill.pressing{
      transform:scale(0.95);
      border-color:var(--gold-border);
      box-shadow:0 0 0 3px rgba(232,150,12,0.18);
    }
    .sit-emoji{font-size:15px;line-height:1;}
    .sit-label{font-size:12px;font-weight:400;color:var(--dark);}

    /* ── SIT-OVERLAY ── */
    #sit-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0);z-index:400;align-items:flex-end;justify-content:center;transition:background 0.3s;pointer-events:none;}
    #sit-overlay.sit-open{display:flex;pointer-events:all;background:rgba(0,0,0,0.52);}
    #sit-sheet{
      background:var(--cream);border-radius:24px 24px 0 0;
      width:100%;max-width:480px;
      transform:translateY(100%);
      transition:transform 0.35s cubic-bezier(0.34,1.05,0.64,1);
      padding-bottom:env(safe-area-inset-bottom,16px);
      max-height:85vh;overflow-y:auto;position:relative;
    }
    #sit-overlay.sit-open #sit-sheet{transform:translateY(0);}
    .sheet-handle{width:36px;height:4px;background:var(--cream-border);border-radius:2px;margin:14px auto 0;}
    .sheet-close-btn{position:absolute;top:14px;right:16px;background:none;border:none;font-size:16px;color:var(--faint);cursor:pointer;padding:6px;line-height:1;z-index:1;}
    #sit-sheet-content{padding:16px 20px 20px;}

    /* ── SHEET INNER ── */
    ._sl{opacity:0;transform:translateY(6px);transition:opacity 0.25s ease,transform 0.25s ease;}
    ._sl.in{opacity:1;transform:translateY(0);}

    /* tool + deeper cards */
    .s-action{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;background:var(--cream-warm);border:1px solid var(--cream-border);margin-bottom:7px;transition:transform 0.15s;}
    .s-action:active{transform:scale(0.97);}
    .s-action-primary{background:var(--dark);border-color:var(--dark);}
    .s-tool{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;background:var(--dark);text-decoration:none;margin-bottom:8px;transition:transform 0.15s;}
    .s-tool:active{transform:scale(0.98);}
    .s-deep{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;border:1.5px solid var(--card-border);background:var(--card);margin-bottom:8px;transition:transform 0.15s;}
    .s-deep:active{transform:scale(0.97);}
  </style>
</head>

// ── SWIPE DOWN TO CLOSE sit-sheet ────────────────────────────
(function() {
  const sheet = document.getElementById('sit-sheet');
  let startY = 0, currentY = 0, dragging = false;
  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop > 0) return;
    startY = e.touches[0].clientY; dragging = true;
    sheet.style.transition = 'none';
  }, {passive:true});
  sheet.addEventListener('touchmove', e => {
    if (!dragging) return;
    const delta = e.touches[0].clientY - startY;
    if (delta > 0) { currentY = delta; sheet.style.transform = `translateY(${delta}px)`; }
  }, {passive:true});
  sheet.addEventListener('touchend', () => {
    if (!dragging) return; dragging = false;
    sheet.style.transition = 'transform 0.3s cubic-bezier(0.34,1.05,0.64,1)';
    if (currentY > 110) closeSitSheet();
    else sheet.style.transform = 'translateY(0)';
    startY = 0; currentY = 0;
  });
})();




function pressPill(btn, key) {
  if (!btn) { openSitSheet(key); return; }
  btn.classList.add('pressing');
  setTimeout(() => {
    btn.classList.remove('pressing');
    openSitSheet(key);
  }, 130);
}
function openSitSheet(key) {
  const d = SIT_DATA[key];
  if (!d) return;

  // Build content
  const toolsHtml = d.tools.map(t => `
    <a href="${t.href}" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;background:${t.primary ? 'var(--dark)' : 'var(--cream-warm)'};border:1px solid ${t.primary ? 'var(--dark)' : 'var(--cream-border)'};margin-bottom:8px;">
      <span style="font-size:18px;flex-shrink:0;width:28px;text-align:center;">${t.icon}</span>
      <span style="flex:1;">
        <span style="display:block;font-size:13px;font-weight:500;color:${t.primary ? '#FDFBF7' : 'var(--dark)'};">${t.name}</span>
        <span style="display:block;font-size:11px;font-weight:300;color:${t.primary ? 'rgba(253,251,247,0.55)' : 'var(--soft)'};">${t.desc}</span>
      </span>
      <span style="font-size:12px;color:${t.primary ? 'rgba(255,255,255,0.3)' : 'var(--faint)'};">→</span>
    </a>`).join('');

  document.getElementById('sit-sheet-content').innerHTML = `
    <div class="_sl" style="opacity:0;transform:translateY(6px);transition:opacity 0.25s ease,transform 0.25s ease;">
      <div style="font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--soft);margin-bottom:8px;">วันนี้เป็นยังไงบ้าง?</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <span style="font-size:28px;">${d.emoji}</span>
        <span style="font-family:'Noto Serif Thai',serif;font-size:17px;font-weight:600;color:var(--dark);">${d.title}</span>
      </div>
      <div style="font-size:13px;font-weight:400;color:var(--mid);line-height:1.75;margin-bottom:16px;padding:12px 14px;background:var(--cream-warm);border-radius:10px;">${d.note}</div>
    </div>
    <div class="_sl" style="opacity:0;transform:translateY(6px);transition:opacity 0.25s ease,transform 0.25s ease;">
      ${toolsHtml}
    </div>
    <div class="_sl" style="opacity:0;transform:translateY(6px);transition:opacity 0.25s ease,transform 0.25s ease;">
      <div style="border-top:1px solid var(--cream-border);padding-top:10px;margin-top:6px;font-size:12px;color:var(--soft);line-height:1.6;">
        ${d.talk} <a href="talk_who.html" style="color:var(--mid);font-weight:500;text-decoration:underline;text-underline-offset:3px;">คุยกับใครสักคน →</a>
      </div>
    </div>`;

  // Stagger layers: recognition → tools → talk
  const [STAGGER_DELAYS] = [[0, 150, 300]];
  document.querySelectorAll('._sl').forEach((el, i) => {
    setTimeout(() => { el.style.opacity='1'; el.style.transform='translateY(0)'; }, 180 + STAGGER_DELAYS[i]);
  });

  const ov = document.getElementById('sit-overlay');
  ov.style.display = 'flex';
  ov.style.pointerEvents = 'all';
  requestAnimationFrame(() => {
    ov.style.background = 'rgba(0,0,0,0.52)';
    document.getElementById('sit-sheet').style.transform = 'translateY(0)';
  });
  document.body.style.overflow = 'hidden';
}

function closeSitSheet() {
  const ov = document.getElementById('sit-overlay');
  ov.style.background = 'rgba(0,0,0,0)';
  document.getElementById('sit-sheet').style.transform = 'translateY(100%)';
  setTimeout(() => {
    ov.style.display = 'none';
    ov.style.pointerEvents = 'none';
    document.body.style.overflow = '';
  }, 360);
}

function handleSitOverlay(e) {
  if (e.target === document.getElementById('sit-overlay')) closeSitSheet();
}

// ── RENDER ALL TIERS ─────────────────────────────────────────
function renderAllTiers() {
  const container = document.getElementById('tiers-container');
  container.innerHTML = TIERS.map(tier => `
    <div class="tier-section">
      <div class="tier-label">
        <div class="tier-dot"></div>
        <div class="tier-text">${tier.label}</div>
        <div class="tier-line"></div>
      </div>
      <div class="tier-pills">
        ${tier.pills.map(p => `
          <button class="sit-pill" onclick="pressPill(this,'${p.key}')">
            <span class="sit-emoji">${p.emoji}</span>
            <span class="sit-label">${p.label}</span>
          </button>`).join('')}
      </div>
    </div>
  `).join('');
}

renderAllTiers();

const _hash = window.location.hash.replace('#','');
if (_hash && SIT_DATA[_hash]) setTimeout(() => pressPill(null, _hash), 300);
